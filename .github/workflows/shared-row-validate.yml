name: Shared row validation
on:
  push:
    branches: [codex/shared-row-publication]
concurrency:
  group: shared-row-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      RUST_MIN_STACK: 134217728
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}
      - run: cargo clean -p pos3ql
      - name: Runner formatting patch
        run: |
          cargo fmt
          git diff --binary > "$RUNNER_TEMP/format.patch"
      - name: Compile all targets
        run: |
          set -euo pipefail
          cargo check --all-targets --locked --message-format=json 2>&1 | tee "$RUNNER_TEMP/check.json"
      - name: Lint
        run: cargo clippy --lib --bins -- -D warnings
      - name: Focused regressions
        run: |
          set -euo pipefail
          for filter in shared_row_publication visible_row_heap_ownership row_read_ownership row_version_ownership heap_compaction; do
            cargo test --lib --locked "$filter" -- --test-threads=1 2>&1 | tee -a "$RUNNER_TEMP/tests.log"
          done
      - name: Guards
        run: |
          python3 tools/check-docs.py
          bash tools/check-bugs.sh
          bash tools/check-object-store-boundary.sh
          sh tools/check-dups.sh
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: shared-row-diagnostics
          path: |
            ${{ runner.temp }}/format.patch
            ${{ runner.temp }}/check.json
            ${{ runner.temp }}/tests.log
