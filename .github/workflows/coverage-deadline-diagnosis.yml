name: Coverage deadline diagnosis

on:
  push:
    branches: [bound-routine-execution]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  formatting:
    name: Format diagnosis
    uses: ./.github/workflows/formatting.yml

  comparison:
    name: Routine boundary workload (${{ matrix.variant }})
    needs: formatting
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: before
            revision: fa702ae87a0dfbbb8e0514103b2318b62581e465
          - variant: after
            revision: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ matrix.revision }}
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99.1"
          components: llvm-tools-preview
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov@0.9.1
          checksum: true
          fallback: none
      - name: Record compiler, revision and runner resources
        run: |
          git rev-parse HEAD
          rustc -vV
          cargo -V
          nproc
          free -m
          df -h "$GITHUB_WORKSPACE"
      - name: Build the original instrumented test executable
        run: |
          coverage_environment=$(cargo llvm-cov show-env --sh)
          eval "$coverage_environment"
          cargo test --lib --release --locked --no-run
      - name: Time the unchanged boundary and recovery fixture
        run: |
          coverage_environment=$(cargo llvm-cov show-env --sh)
          eval "$coverage_environment"
          /usr/bin/time -v python3 tools/test_command.py \
            cargo test --lib --release --locked -- \
            --exact sql::tests::remaining_execution_widths_are_allocation_free_and_survive_cold_recovery \
            --test-threads=1

  lint:
    name: Call binding build, lint and correctness
    needs: formatting
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99.1"
          components: clippy
      - run: cargo clippy --all-targets --locked -- -D warnings
      - name: Function, polymorphic, domain and call-boundary regressions
        run: >-
          python3 tools/test_command.py cargo test --lib --locked --
          routine_ function_ polymorphic_ domain_ routine_calls:: --test-threads=1
