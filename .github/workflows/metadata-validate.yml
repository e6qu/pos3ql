name: Metadata validation
on:
  push:
    branches: [codex/synchronize-cluster-metadata]
concurrency:
  group: metadata-validation-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: metadata-validation-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
      - run: |
          cargo fmt --all
          git diff --binary > "$RUNNER_TEMP/formatting.patch"
      - uses: actions/upload-artifact@v6
        with:
          name: metadata-formatting
          path: ${{ runner.temp }}/formatting.patch
      - run: cargo clean -p pos3ql
      - run: cargo check --all-targets --locked
      - run: cargo clippy --lib --bins --locked -- -D warnings
      - run: cargo test --lib --locked cluster_metadata -- --nocapture
      - run: cargo test --lib --locked manifest_catalog_duplicates -- --nocapture
      - run: cargo test --lib --locked alter_system -- --nocapture
      - run: cargo test --lib --locked prepared_transaction -- --nocapture
