name: Row scan qualification
on:
  push:
    branches: [codex/captured-row-scan-sources]
concurrency:
  group: row-scan-qualification-${{ github.ref }}
  cancel-in-progress: true
jobs:
  captured-scans:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-
      - run: cargo clean -p pos3ql
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --lib --locked captured_row_scans -- --test-threads=1 --nocapture
      - run: cargo test --lib --locked storage::row_walks::tests -- --test-threads=1 --nocapture
      - run: cargo test --lib --locked retained_object_rows -- --test-threads=1 --nocapture
      - run: cargo test --lib --locked query_sst_roots -- --test-threads=1 --nocapture
      - run: cargo test --lib --locked startup_bounded -- --test-threads=1 --nocapture
