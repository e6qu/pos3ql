name: Rust formatting

on:
  workflow_call:

jobs:
  check:
    name: Rust formatting
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5

      - name: Check Rust formatting
        run: |
          if ! { cargo fmt --check && rustfmt --check --edition 2024 src/storage/native_tests.rs; }; then
            cargo fmt
            rustfmt --edition 2024 src/storage/native_tests.rs
            git diff --binary > "$RUNNER_TEMP/formatting.patch"
            exit 1
          fi

      - name: Retain formatting correction
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: formatting-${{ github.sha }}
          path: ${{ runner.temp }}/formatting.patch
          if-no-files-found: ignore

  compile:
    name: Rust type checks
    needs: check
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Cache Rust dependencies
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-source-check-dependencies-${{ hashFiles('Cargo.lock') }}
      - name: Check and lint all Rust targets before test matrices
        env:
          RUSTFLAGS: -Dwarnings
        run: cargo clippy --locked --all-targets --keep-going --jobs 1 -- -Dwarnings
