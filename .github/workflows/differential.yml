name: Differential

# Runs the SQL corpora and the generative fuzzer against a REAL PostgreSQL 18
# and against pos3ql, and diffs them. This is the coverage that the fast
# unit-test CI (ci.yml) cannot give: tens of thousands of vendored
# sqllogictest blocks plus thousands of generated statements, all validated
# against PostgreSQL as the oracle.
#
# Sharded so every job fits the 15-minute cap while total coverage is
# preserved: four shards each replay a quarter of the vendored sqllogictest
# corpus's query blocks (all files and statements on every shard), a fifth
# shard runs the full generative fuzzer, and a sixth runs the deterministic
# wire/tooling/curated-corpus gates once. Repeating those gates in every slow
# shard wastes the fixed wall-clock budget and can cancel a healthy fuzzer.

on:
  push:
    branches: [main]
  pull_request:

# One run per ref: a new push cancels the previous, still-running run, and a
# feature branch runs once (via pull_request) instead of twice.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  differential:
    name: differential (${{ matrix.shard }})
    runs-on: ubuntu-latest
    # Hard ceiling on every CI job: 15 minutes. Each shard runs one quarter of
    # the sqllogictest queries, the fuzzer alone, or the deterministic gates
    # alone; the cap still guarantees a pathological query can never wedge CI.
    timeout-minutes: 15

    strategy:
      # Report every shard's result rather than cancelling siblings on the
      # first failure — a divergence in one shard should not hide others.
      fail-fast: false
      matrix:
        include:
          - shard: slt-1
            run_fast: "0"
            run_slt: "1"
            query_shard: "0"
            run_fuzz: "0"
          - shard: slt-2
            run_fast: "0"
            run_slt: "1"
            query_shard: "1"
            run_fuzz: "0"
          - shard: slt-3
            run_fast: "0"
            run_slt: "1"
            query_shard: "2"
            run_fuzz: "0"
          - shard: slt-4
            run_fast: "0"
            run_slt: "1"
            query_shard: "3"
            run_fuzz: "0"
          - shard: fuzz
            run_fast: "0"
            run_slt: "0"
            query_shard: "0"
            run_fuzz: "1"
          - shard: fast
            run_fast: "1"
            run_slt: "0"
            query_shard: "0"
            run_fuzz: "0"

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          # Match pos3ql: C/byte collation so ordering/min/max agree, and UTF8
          # server encoding (vanilla PostgreSQL's real-world default, and what
          # pos3ql advertises) so text columns decode to str, not raw bytes.
          POSTGRES_INITDB_ARGS: "--lc-collate=C --lc-ctype=C --encoding=UTF8"
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      - uses: actions/checkout@v5

      - name: Install PostgreSQL 18 client and Python
        run: |
          sudo sh -c 'echo "deb http://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" > /etc/apt/sources.list.d/pgdg.list'
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc |
            sudo gpg --dearmor -o /etc/apt/trusted.gpg.d/pgdg.gpg
          # Runner-image Microsoft feeds are unrelated to the PostgreSQL oracle and
          # occasionally reject apt metadata requests.
          sudo rm -f /etc/apt/sources.list.d/azure-cli.list /etc/apt/sources.list.d/microsoft-prod.list
          sudo apt-get update
          sudo apt-get install -y postgresql-client-18 python3-venv
          echo "/usr/lib/postgresql/18/bin" >> "$GITHUB_PATH"

      - name: Cache Rust build
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      # `target` is cached by dependency lockfile, not source revision. Keep
      # dependencies warm but rebuild this checkout's crate every time.
      - name: Rebuild checked-out crate
        run: cargo clean -p pos3ql

      - name: Differential conformance (corpora + fuzzer vs real PostgreSQL)
        env:
          PGHOST: 127.0.0.1
          PGPORT: "5432"
          PGUSER: postgres
          P3_PORT: "15599"
          # Replay the whole vendored sqllogictest corpus (~11k blocks): each of
          # the four slt shards runs all files and all statements but a quarter of
          # the query blocks, so even one pathologically slow file (select4's
          # joins) is balanced under the cap. SLT_LIMIT is the per-file block cap
          # (all).
          SLT_LIMIT: "50000"
          SLT_QUERY_SHARDS: "4"
          SLT_QUERY_SHARD: ${{ matrix.query_shard }}
          # Unsupported SQL is a measured compatibility debt, not a green
          # escape hatch. Wide range tables now execute too, so no shard may
          # classify any block as unsupported.
          SLT_UNSUPPORTED_BUDGET: "0"
          RUN_FAST: ${{ matrix.run_fast }}
          RUN_SLT: ${{ matrix.run_slt }}
          RUN_FUZZ: ${{ matrix.run_fuzz }}
          # The fuzzer runs alone on its own shard and keeps all 10k generated
          # statements. Ignored on the other shards (RUN_FUZZ=0).
          FUZZ_COUNT: "10000"
          FUZZ_SEED: "3"
          # Generated PostgreSQL-valid statements must execute, not be silently
          # classified as unsupported by the differential harness.
          FUZZ_UNSUPPORTED_BUDGET: "0"
          # Ratchet budget: allowed fuzz divergences before failing (see BUGS.md
          # A ceiling, not an exact target — the residual divergences are
          # PostgreSQL-implementation-specific (unspecified within-row operand
          # order, plan-dependent projection placement). Ratchet toward zero.
          FUZZ_BUDGET: "0"
        run: bash tests/external/ci_diff.sh
