name: Qualify database-local type references
on:
  push:
    branches: [isolate-type-renames]
jobs:
  native:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-library-tests-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-
      - run: cargo clean -p pos3ql
      - name: Compile and lint all targets
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: Database isolation, pending references and recovery
        shell: bash
        run: |
          set -euo pipefail
          for selection in type_reference_moves_ moved_enum_identity_survives_uploaded_wal_and_nested_references composite_domain_arrays_survive_checkpoint_recovery_and_type_moves domain_identity_changes_ composite_attribute_rename_rewrites_domain_chain_transactionally composite_attribute_rename_rewrites_nested_and_set_operation_views database_template_catalogs_diverge_and_survive_object_cold_recovery storage::table_definitions::tests::; do
            cargo test --lib --locked "$selection" -- --test-threads=1 --nocapture | tee "$RUNNER_TEMP/pending-edits-$selection.log"
            grep -Eq 'test result: ok\. [1-9][0-9]* passed' "$RUNNER_TEMP/pending-edits-$selection.log"
          done
      - name: Verify the original type move modifies another database
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin 95672b93a29c86c2245a20822773f80f90dc9796
          python3 - <<'PY'
          from pathlib import Path
          import os
          import subprocess

          old = "95672b93a29c86c2245a20822773f80f90dc9796"
          paths = [Path("src/storage/mod.rs"), Path("src/storage/table_definitions.rs"), Path("src/storage/table_edits.rs")]
          original = {path: path.read_text() for path in paths}
          try:
              for path in paths:
                  restored = subprocess.check_output(["git", "show", f"{old}:{path}"], text=True)
                  path.write_text(restored)
              result = subprocess.run(
                  ["cargo", "test", "--lib", "--locked",
                   "type_reference_moves_preserve_other_database_definitions_and_comments",
                   "--", "--test-threads=1", "--nocapture"],
                  stdout=subprocess.PIPE, stderr=subprocess.STDOUT, text=True,
              )
              print(result.stdout, flush=True)
              Path(os.environ["RUNNER_TEMP"], "type-reference-old-runtime.log").write_text(result.stdout)
              assert result.returncode != 0, "original runtime unexpectedly passed the database-isolation regression"
              assert "test result: FAILED. 0 passed; 1 failed" in result.stdout
              assert "type rename changed another database" in result.stdout
          finally:
              for path, content in original.items():
                  path.write_text(content)
          subprocess.check_call(["git", "diff", "--exit-code", "--",
                                 "src/storage/mod.rs", "src/storage/table_definitions.rs", "src/storage/table_edits.rs"])
          print("Confirmed the cross-database mutation on the old runtime; restored the qualified source.")
          PY
  postgresql:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: mirror.gcr.io/library/postgres:18@sha256:74935e72241653ca55e0414067e6d8763aceb8a810eb51b452253ec3dcfc4336
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_INITDB_ARGS: "--lc-collate=C --lc-ctype=C --encoding=UTF8"
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-
      - run: cargo clean -p pos3ql
      - uses: ./.github/actions/python-test-environment
        with:
          venv: target/external-venv
      - name: Compare type moves across databases with actual PostgreSQL 18
        env:
          PGHOST: 127.0.0.1
          PGPORT: "5432"
          PGUSER: postgres
          P3_PORT: "15599"
          RUN_FAST: "0"
          RUN_CORE: "0"
          RUN_CORPUS: "0"
          RUN_AUX: "1"
          RUN_SLT: "0"
          RUN_FUZZ: "0"
          AUXILIARY_PHASE: "types"
        run: |
          bash tests/external/ci_diff.sh
          RUN_AUX=0 RUN_CORPUS=1 FAST_CORPUS_ONLY=193_domain_routine_coercion bash tests/external/ci_diff.sh
