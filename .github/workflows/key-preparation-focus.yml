name: Key preparation focus

on:
  push:
    branches: [coherent-statement-capture]
  workflow_dispatch:

concurrency:
  group: key-preparation-focus-${{ github.ref }}
  cancel-in-progress: true

jobs:
  focused:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: mirror.gcr.io/library/postgres:18@sha256:74935e72241653ca55e0414067e6d8763aceb8a810eb51b452253ec3dcfc4336
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_INITDB_ARGS: "--lc-collate=C --lc-ctype=C --encoding=UTF8"
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: key-preparation-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            coherent-readers-${{ runner.os }}-
            ${{ runner.os }}-cargo-
      - name: Format and retain exact patch
        run: |
          cargo fmt
          git diff --binary > "$RUNNER_TEMP/format.patch"
      - uses: actions/upload-artifact@v6
        with:
          name: key-preparation-format
          path: ${{ runner.temp }}/format.patch
      - name: Compile and lint all targets
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: PostgreSQL 18 exact SQL reference
        run: |
          python3 - <<'PY'
          import pathlib
          import subprocess

          image = "mirror.gcr.io/library/postgres:18@sha256:74935e72241653ca55e0414067e6d8763aceb8a810eb51b452253ec3dcfc4336"
          containers = subprocess.check_output(["docker", "ps", "--filter", f"ancestor={image}", "--format", "{{.ID}}"], text=True).splitlines()
          assert len(containers) == 1, containers
          command = ["docker", "exec", "-i", containers[0], "psql", "-U", "postgres", "-X", "-q", "-A", "-t", "-v", "ON_ERROR_STOP=1"]
          version = subprocess.run(command, input="SHOW server_version_num;", text=True, capture_output=True, check=True)
          assert 180000 <= int(version.stdout.strip()) < 190000, version.stdout
          fixture = pathlib.Path("tests/external/differential_exact/19_key_preparation.sql").read_text()
          result = subprocess.run(command, input=fixture, text=True, capture_output=True, check=True)
          expected = ["1", "1|11", "3|20|23", "2|5|42"]
          assert result.stdout.splitlines() == expected, (result.stdout, result.stderr)
          print(f"PostgreSQL {version.stdout.strip()}: {expected}")
          PY
      - name: Key preparation, ownership, rows and index regressions
        run: >-
          cargo test --release --lib --locked --
          key_preparation_ row_layout_ shared_row_publication_ private_index_bindings_
          row_walk_ value_index_ expression_index partial_index
          index_creation_cache_failure_ failed_index_cache_reservation_
          --test-threads=1 --color=never --format=pretty
