name: Table state validation
on:
  push:
    branches: [codex/table-state-synchronization]
concurrency:
  group: table-state-validation-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-
      - run: cargo clean -p pos3ql
      - run: |
          cargo fmt --all
          git diff -- src > "$RUNNER_TEMP/formatting.patch"
      - uses: actions/upload-artifact@v6
        with:
          name: formatting
          path: ${{ runner.temp }}/formatting.patch
      - run: cargo check --all-targets --locked
      - run: cargo test --lib --locked table_serial_state -- --test-threads=1
      - run: cargo test --lib --locked serial_auto_increment -- --test-threads=1
      - run: cargo test --lib --locked identity_ -- --test-threads=1
