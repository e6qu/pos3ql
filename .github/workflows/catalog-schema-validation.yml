name: Catalog schema validation

on:
  push:
    branches: [catalog-schema-routine-snapshots]

concurrency:
  group: catalog-schema-validation-${{ github.ref }}
  cancel-in-progress: false

jobs:
  all-native:
    name: library (${{ matrix.partition }})
    if: startsWith(github.event.head_commit.message, 'Validate all library partitions')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        partition: [0-of-8, 1-of-8, 2-of-8, 3-of-8, 4-of-8, 5-of-8, 6-of-8, 7-of-8]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-catalog-schema-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-
      - name: Library regressions with the normal CI partitioning
        shell: bash
        run: |
          sh tools/test-lib-shard.sh '${{ matrix.partition }}' 2>&1 | tee "$RUNNER_TEMP/library.log"
          grep -Eq 'test result: ok\. [1-9][0-9]* passed; 0 failed; 0 ignored;' "$RUNNER_TEMP/library.log"
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: catalog-schema-library-${{ matrix.partition }}-${{ github.sha }}
          path: ${{ runner.temp }}/library.log

  reports:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: mirror.gcr.io/library/postgres:18@sha256:74935e72241653ca55e0414067e6d8763aceb8a810eb51b452253ec3dcfc4336
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: [5432:5432]
        options: >-
          --health-cmd pg_isready
          --health-interval 1s
          --health-timeout 5s
          --health-retries 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-catalog-schema-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-
      - name: Format on the runner
        run: |
          cargo fmt
          git diff --binary > "$RUNNER_TEMP/formatting.patch"
      - name: PostgreSQL namespaces and report schemas
        env:
          PGHOST: localhost
          PGUSER: postgres
        run: |
          psql -X -v ON_ERROR_STOP=1 -P pager=off > "$RUNNER_TEMP/postgresql-report-schema.txt" <<'SQL'
          SELECT version();
          SELECT oid,nspname,nspowner,nspacl FROM pg_namespace ORDER BY nspname;
          SELECT n.nspname,c.relname,a.attnum,a.attname,format_type(a.atttypid,NULL)
            FROM pg_attribute a JOIN pg_class c ON c.oid=a.attrelid
            JOIN pg_namespace n ON n.oid=c.relnamespace
           WHERE n.nspname='information_schema' AND c.relname IN ('schemata','routines','parameters','routine_privileges')
             AND a.attnum>0 AND NOT a.attisdropped ORDER BY c.relname,a.attnum;
          SELECT schema_name FROM information_schema.schemata ORDER BY schema_name;
          CREATE ROLE namespace_reader;
          SET ROLE namespace_reader;
          SELECT nspname,has_schema_privilege(oid,'USAGE'),has_schema_privilege(oid,'CREATE')
            FROM pg_namespace ORDER BY nspname;
          SELECT schema_name FROM information_schema.schemata ORDER BY schema_name;
          RESET ROLE;
          CREATE FUNCTION snapshot_routine_before(a integer,b integer DEFAULT 17)
            RETURNS integer LANGUAGE SQL IMMUTABLE STRICT SECURITY DEFINER AS 'SELECT a+b';
          SELECT routine_name,routine_type,data_type,routine_body,external_language,is_deterministic,is_null_call,security_type,routine_definition
            FROM information_schema.routines WHERE routine_name='snapshot_routine_before';
          SELECT ordinal_position,parameter_name,parameter_mode,data_type,udt_name,parameter_default
            FROM information_schema.parameters WHERE specific_schema='public' AND specific_name LIKE 'snapshot_routine_before_%' ORDER BY ordinal_position;
          SET ROLE namespace_reader;
          SELECT has_function_privilege('abs(integer)','EXECUTE'),has_function_privilege('abs(integer)'::regprocedure,'EXECUTE'),has_function_privilege('abs(integer)'::regprocedure,'EXECUTE WITH GRANT OPTION');
          SELECT has_function_privilege(0::oid,'EXECUTE'),has_schema_privilege(0::oid,'USAGE');
          RESET ROLE;
          SQL
      - name: Native catalog and schema regressions
        shell: bash
        run: |
          cargo test --lib --locked -- catalog_snapshot_ schema_rename_ schema_sql_rewrite_ schema_name_ --test-threads=1 --color=never --nocapture 2>&1 | tee "$RUNNER_TEMP/catalog-tests.log"
          python3 - "$RUNNER_TEMP/catalog-tests.log" <<'PY'
          import pathlib
          import re
          import sys
          log = pathlib.Path(sys.argv[1]).read_text()
          result = re.findall(r'test result: ok\. ([0-9]+) passed; 0 failed; 0 ignored;', log)
          if len(result) != 1 or int(result[0]) == 0:
              raise SystemExit('Native validation did not report a passing test run')
          for name in ('catalog_snapshot_account_reports_', 'catalog_snapshot_schemata_', 'catalog_snapshot_routine_reports_'):
              if not re.search(r'^test \S*' + re.escape(name) + r'\S* \.\.\. ok$', log, re.MULTILINE):
                  raise SystemExit('Missing passing regression: ' + name)
          PY
      - name: Symbolize allocation guard failures
        if: failure()
        shell: bash
        run: |
          python3 - "$RUNNER_TEMP/catalog-tests.log" "$RUNNER_TEMP/allocation-backtrace.txt" <<'PY'
          import pathlib
          import re
          import subprocess
          import sys
          log = pathlib.Path(sys.argv[1]).read_text()
          binary = re.search(r'Running unittests src/lib.rs \(([^)]+)\)', log)
          addresses = list(dict.fromkeys(re.findall(r'\(\+(0x[0-9a-fA-F]+)\)', log)))
          if binary and addresses:
              trace = subprocess.check_output(['addr2line', '-f', '-C', '-e', binary[1], *addresses], text=True)
              pathlib.Path(sys.argv[2]).write_text(trace)
              print(trace)
          PY
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: catalog-schema-${{ github.sha }}
          path: |
            ${{ runner.temp }}/formatting.patch
            ${{ runner.temp }}/postgresql-report-schema.txt
            ${{ runner.temp }}/catalog-tests.log
            ${{ runner.temp }}/allocation-backtrace.txt

  comparison:
    needs: reports
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: mirror.gcr.io/library/postgres:18@sha256:74935e72241653ca55e0414067e6d8763aceb8a810eb51b452253ec3dcfc4336
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: [5432:5432]
        options: >-
          --health-cmd pg_isready
          --health-interval 1s
          --health-timeout 5s
          --health-retries 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-differential-build-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-
      - name: Build this revision
        run: cargo build --release --locked
      - uses: ./.github/actions/python-test-environment
        with:
          venv: target/external-venv
      - name: PostgreSQL 18 dump tools
        shell: bash
        run: |
          mkdir -p .ci-bin
          for client in pg_dump pg_restore; do
            printf '%s\n' '#!/bin/sh' "exec docker run --rm --network host -v \"\$PWD:\$PWD\" -w \"\$PWD\" -v /tmp:/tmp mirror.gcr.io/library/postgres:18@sha256:74935e72241653ca55e0414067e6d8763aceb8a810eb51b452253ec3dcfc4336 $client \"\$@\"" > ".ci-bin/$client"
          done
          chmod +x .ci-bin/pg_dump .ci-bin/pg_restore
          echo "${{ github.workspace }}/.ci-bin" >> "$GITHUB_PATH"
      - name: Compare catalogs and types against actual PostgreSQL
        shell: bash
        env:
          PGHOST: 127.0.0.1
          PGPORT: 5432
          PGUSER: postgres
          RUN_FAST: '0'
          RUN_CORE: '0'
          RUN_CORPUS: '0'
          RUN_AUX: '1'
          RUN_SLT: '0'
          RUN_FUZZ: '0'
          AUXILIARY_PHASE: types
          POS3QL_PYTHON_WHEELHOUSE: ${{ runner.temp }}/pos3ql-test-wheels
        run: bash tests/external/ci_diff.sh "$PWD/target/release/pos3ql" "$RUNNER_TEMP/comparison"
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: catalog-schema-comparison-${{ github.sha }}
          path: ${{ runner.temp }}/comparison/
