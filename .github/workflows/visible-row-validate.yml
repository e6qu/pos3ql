name: Visible row validation
on:
  push:
    branches: [codex/visible-row-heap-ownership]
concurrency:
  group: visible-row-validation
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      RUST_MIN_STACK: '134217728'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-
      - run: cargo clean -p pos3ql
      - name: Format and compile
        run: |
          cargo fmt --all
          git diff --binary > "$RUNNER_TEMP/format.patch"
          cargo check --all-targets --locked --message-format=json > "$RUNNER_TEMP/check.json"
      - name: Lints and ownership regressions
        run: |
          cargo clippy --lib --bins --locked -- -D warnings
          cargo test --lib --locked visible_row_heap_ownership -- --nocapture 2>&1 | tee "$RUNNER_TEMP/tests.log"
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: visible-row-diagnostics
          path: |
            ${{ runner.temp }}/format.patch
            ${{ runner.temp }}/check.json
            ${{ runner.temp }}/tests.log
