name: Routine default validation

on:
  push:
    branches: [bound-routine-execution]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  formatting:
    name: Format default validation
    uses: ./.github/workflows/formatting.yml

  native:
    name: Default bindings and bounded catalog polling
    needs: formatting
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - run: cargo clippy --all-targets --locked -- -D warnings
      - name: Function, default, type and polling regressions
        run: >-
          python3 tools/test_command.py cargo test --lib --locked --
          routine_ function_ polymorphic_ domain_ routine_calls::
          view_rule_catalog_is_synchronized_and_startup_bounded --test-threads=1

  behavior:
    name: Default PostgreSQL comparison
    needs: formatting
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: mirror.gcr.io/library/postgres:18@sha256:74935e72241653ca55e0414067e6d8763aceb8a810eb51b452253ec3dcfc4336
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_INITDB_ARGS: "--lc-collate=C --lc-ctype=C --encoding=UTF8"
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
      - name: Configure PostgreSQL reference
        run: |
          postgres_container=$(docker ps --filter ancestor=mirror.gcr.io/library/postgres:18@sha256:74935e72241653ca55e0414067e6d8763aceb8a810eb51b452253ec3dcfc4336 --format '{{.ID}}' | head -n 1)
          test -n "$postgres_container"
          docker exec "$postgres_container" mkdir -p /tmp/pos3ql-extensions
          docker cp tests/external/extensions/. "$postgres_container":/tmp/pos3ql-extensions/
          docker exec "$postgres_container" psql -U postgres -X -v ON_ERROR_STOP=1 -c "ALTER SYSTEM SET max_prepared_transactions = 8"
          docker restart "$postgres_container"
          for _ in $(seq 1 50); do
            pg_isready -h 127.0.0.1 -p 5432 -U postgres >/dev/null 2>&1 && exit 0
            sleep 0.1
          done
          exit 1
      - uses: ./.github/actions/python-test-environment
      - run: cargo build --release --locked
      - name: Compare every exact PostgreSQL fixture
        env:
          POS3QL_BIN: ${{ github.workspace }}/target/release/pos3ql
          POS3QL_VENV: ${{ github.workspace }}/venv
          POS3QL_PSQL: psql
          POS3QL_REFERENCE_PG_HOST: 127.0.0.1
          POS3QL_REFERENCE_PG_PORT: "5432"
          POS3QL_REFERENCE_PSQL: psql
          POS3QL_EXTENSION_CONTROL_PATH: ${{ github.workspace }}/tests/external/extensions
          POS3QL_REFERENCE_EXTENSION_CONTROL_PATH: /tmp/pos3ql-extensions
          POS3QL_DIFF_CORPUS_SHARD: none
          POS3QL_DIFF_AUXILIARY: exact
        run: |
          set +e
          bash tests/external/differential.sh 2>&1 | tee "$RUNNER_TEMP/default-bindings.log"
          comparison_status=${PIPESTATUS[0]}
          set -e
          python3 - "$RUNNER_TEMP/default-bindings.log" "$comparison_status" <<'PY'
          import pathlib
          import re
          import sys

          log = pathlib.Path(sys.argv[1]).read_text()
          status = int(sys.argv[2])
          passed = re.findall(r"^PASS: exact errors: (\S+)$", log, re.MULTILINE)
          failed = re.findall(r"^FAIL: exact errors: (\S+)$", log, re.MULTILINE)
          expected = {path.stem for path in pathlib.Path("tests/external/differential_exact").glob("*.sql")}
          if not expected or status != 0 or set(passed) != expected or len(passed) != len(expected) or failed:
              raise SystemExit(f"Candidate comparison failed: status={status}, passed={len(passed)}, expected={len(expected)}, failed={failed}")
          print(f"All {len(expected)} exact PostgreSQL fixtures passed")
          PY
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: routine-default-after
          path: ${{ runner.temp }}/default-bindings.log
          if-no-files-found: ignore

  ownership:
    name: Complete interpreter ownership gate
    needs: formatting
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: miri
      - run: cargo miri setup
      - name: Preserve all 95 configured ownership cases
        run: |
          /usr/bin/time -v bash tools/test-miri-ownership.sh "$RUNNER_TEMP/miri-default-validation.log"
          grep -q '^test result: ok\. 95 passed; 0 failed; 0 ignored;' "$RUNNER_TEMP/miri-default-validation.log"
