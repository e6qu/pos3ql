name: Table transition qualification

on:
  push:
    branches: [share-table-existence-and-rule-history]

concurrency:
  group: table-transition-${{ github.ref }}
  cancel-in-progress: true

jobs:
  table-transition:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: mirror.gcr.io/library/postgres:18@sha256:74935e72241653ca55e0414067e6d8763aceb8a810eb51b452253ec3dcfc4336
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          # Match pos3ql: C/byte collation so ordering/min/max agree, and UTF8
          # server encoding (vanilla PostgreSQL's real-world default, and what
          # pos3ql advertises) so text columns decode to str, not raw bytes.
          POSTGRES_INITDB_ARGS: "--lc-collate=C --lc-ctype=C --encoding=UTF8"
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      - uses: actions/checkout@v5
      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-
      - run: cargo clean -p pos3ql
      - uses: ./.github/actions/python-test-environment
        with:
          venv: target/external-venv
      - name: Build the checked-out server
        run: cargo build --release --locked
      - name: Compare rule publication against PostgreSQL
        env:
          PGHOST: 127.0.0.1
          PGUSER: postgres
        run: |
          set -euo pipefail
          qualification_work=$(mktemp -d)
          cat > "$qualification_work/server.conf" <<EOF
          listen_addr = 127.0.0.1:15599
          data_dir = $qualification_work/data
          object_store = off
          max_tables = 64
          table_rows = 8192
          max_value_indexes = 64
          max_prepared_transactions = 8
          $(cat tests/external/differential-capacities.conf)
          memtable_bytes = 256MiB
          EOF
          target/release/pos3ql --config "$qualification_work/server.conf" > "$qualification_work/server.log" 2>&1 &
          qualification_server=$!
          trap 'kill "$qualification_server" 2>/dev/null || true; tail -60 "$qualification_work/server.log"' EXIT
          target/external-venv/bin/python -u - <<'PYTHON'
          import importlib.util
          import time
          import psycopg
          spec = importlib.util.spec_from_file_location("mvcc_diff", "tests/external/mvcc_diff.py")
          probe = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(probe)
          for attempt in range(100):
              try:
                  ready = probe.connect(15599)
                  ready.close()
                  break
              except psycopg.OperationalError:
                  time.sleep(0.1)
          else:
              raise RuntimeError("pos3ql did not become ready")
          def transcript(port):
              reader, writer = probe.connect(port), probe.connect(port)
              try:
                  return probe.rule_publication_transcript(reader, writer)
              finally:
                  reader.close()
                  writer.close()
          expected = transcript(5432)
          print("PostgreSQL:", expected, flush=True)
          observed = transcript(15599)
          print("pos3ql:", observed, flush=True)
          assert observed == expected, "rule publication differs from PostgreSQL"
          PYTHON
