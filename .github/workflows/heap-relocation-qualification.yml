name: Heap relocation qualification
on:
  push:
    branches: [codex/retained-heap-relocation]
concurrency:
  group: heap-relocation-qualification-${{ github.ref }}
  cancel-in-progress: true
jobs:
  relocation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - run: cargo clippy --all-targets --locked -- -D warnings
      - name: Relocation, retained rows, scans, and startup accounting
        run: |
          set -eu
          cargo test --lib --locked owned_heap_rows -- --nocapture
          cargo test --lib --locked row_heap_ -- --nocapture
          cargo test --lib --locked shared_heap_append -- --nocapture
          cargo test --lib --locked storage::row_images::tests -- --nocapture
          cargo test --lib --locked storage::row_walks::tests -- --nocapture
          cargo test --lib --locked startup_bounded -- --nocapture
          cargo test --lib --locked table_state_row_map_controls -- --nocapture
  memory-safety:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: miri
      - run: cargo miri setup
      - run: cargo miri test --lib --locked shared_heap_append -- --test-threads=1
