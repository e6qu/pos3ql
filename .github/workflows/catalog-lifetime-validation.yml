name: Catalog lifetime validation
on:
  push:
    branches: [catalog-lifetime-identifiers]
concurrency:
  group: catalog-lifetime-validation
  cancel-in-progress: true
jobs:
  macos:
    name: Catalog lifetimes on macOS
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: macOS-reactor-dependencies-${{ hashFiles('Cargo.lock') }}
      - name: Catalog lifetime and cold recovery regressions
        run: cargo test --lib --locked -- catalog_lifetime --test-threads=1
      - name: All-target lint
        run: cargo clippy --all-targets --locked -- -D warnings
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: mirror.gcr.io/library/postgres:18@sha256:74935e72241653ca55e0414067e6d8763aceb8a810eb51b452253ec3dcfc4336
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_INITDB_ARGS: "--lc-collate=C --lc-ctype=C --encoding=UTF8"
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: catalog-lifetime-dependencies-${{ hashFiles('Cargo.lock') }}
      - name: Formatting
        run: |
          cargo fmt --all
          git diff --binary -- src > "$RUNNER_TEMP/catalog-lifetime-format.patch"
      - uses: actions/upload-artifact@v6
        with:
          name: catalog-lifetime-format-${{ github.sha }}
          path: ${{ runner.temp }}/catalog-lifetime-format.patch
          retention-days: 3
      - name: PostgreSQL lifetime oracle
        env:
          POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          docker exec "$POSTGRES_CONTAINER" mkdir -p /tmp/pos3ql-extensions
          docker cp tests/external/extensions/. "$POSTGRES_CONTAINER":/tmp/pos3ql-extensions/
          docker exec -i --env PGOPTIONS='-c extension_control_path=/tmp/pos3ql-extensions' \
            "$POSTGRES_CONTAINER" psql -X -qAt -v ON_ERROR_STOP=1 -U postgres \
            < tests/external/differential_exact/32_catalog_lifetimes.sql > "$RUNNER_TEMP/catalog-lifetimes-pg.txt"
          python3 - "$RUNNER_TEMP/catalog-lifetimes-pg.txt" <<'PYCODE'
          import pathlib, sys
          rows = pathlib.Path(sys.argv[1]).read_text().splitlines()
          assert rows == ['t'] * 8, rows
          print('PostgreSQL: eight lifetime observations match')
          PYCODE
      - name: PostgreSQL shared subscription oracle
        env:
          POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          set -euo pipefail
          reference() {
            docker exec -i "$POSTGRES_CONTAINER" psql -X -qAt -v ON_ERROR_STOP=1 -U postgres -d "$1"
          }
          reference postgres <<'SQL'
          CREATE DATABASE catalog_first TEMPLATE template0;
          CREATE DATABASE catalog_second TEMPLATE template0;
          SQL
          for database in catalog_first catalog_second; do
            reference "$database" <<'SQL'
          CREATE SUBSCRIPTION shared_catalog_sub CONNECTION 'host=127.0.0.1 port=5432 user=repl dbname=publisher sslmode=disable' PUBLICATION orders WITH (connect = false, slot_name = NONE);
          CREATE TABLE saved_shared_subscription AS SELECT oid AS identity, subdbid AS database_identity FROM pg_subscription WHERE subname = 'shared_catalog_sub' AND subdbid = (SELECT oid FROM pg_database WHERE datname = current_database());
          SQL
          done
          for database in catalog_first catalog_second; do
            reference "$database" <<'SQL' >> "$RUNNER_TEMP/shared-subscriptions-pg.txt"
          SELECT count(*) = 2 AND count(DISTINCT oid) = 2 AND count(DISTINCT subdbid) = 2 FROM pg_subscription WHERE subname = 'shared_catalog_sub';
          SELECT count(*) = 1 FROM saved_shared_subscription s JOIN pg_subscription c ON c.oid = s.identity AND c.subdbid = s.database_identity;
          BEGIN;
          ALTER SUBSCRIPTION shared_catalog_sub RENAME TO shared_catalog_temporary;
          SELECT count(*) = 1 FROM pg_subscription WHERE subname = 'shared_catalog_temporary' AND subdbid = (SELECT oid FROM pg_database WHERE datname = current_database());
          ROLLBACK;
          SQL
          done
          reference catalog_first <<'SQL' >> "$RUNNER_TEMP/shared-subscriptions-pg.txt"
          DROP SUBSCRIPTION shared_catalog_sub;
          CREATE SUBSCRIPTION shared_catalog_sub CONNECTION 'host=127.0.0.1 port=5432 user=repl dbname=publisher sslmode=disable' PUBLICATION orders WITH (connect = false, slot_name = NONE);
          SELECT count(*) = 0 FROM saved_shared_subscription s JOIN pg_subscription c ON c.oid = s.identity;
          SQL
          reference catalog_second <<'SQL' >> "$RUNNER_TEMP/shared-subscriptions-pg.txt"
          SELECT count(*) = 1 FROM saved_shared_subscription s JOIN pg_subscription c ON c.oid = s.identity AND c.subdbid = s.database_identity;
          SQL
          python3 - "$RUNNER_TEMP/shared-subscriptions-pg.txt" <<'PYCODE'
          import pathlib, sys
          rows = pathlib.Path(sys.argv[1]).read_text().splitlines()
          assert rows == ['t'] * 8, rows
          print('PostgreSQL: eight shared subscription observations match')
          PYCODE
      - name: Focused lifetime and recovery regressions
        run: cargo test --lib --locked -- public_identifiers catalog_lifetime metadata_database_copy every_exposed_catalog catalog_row_keys table_definition_images --test-threads=1
      - name: All-target lint
        run: cargo clippy --all-targets --locked -- -D warnings
