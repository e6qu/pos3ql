name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  linux-x86_64:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - name: Verify tag matches Cargo version
        run: |
          version=$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -n 1)
          test "$GITHUB_REF_NAME" = "v$version"

      - name: Build locked release executable
        run: cargo build --release --locked

      - name: Package and install-test
        run: |
          tools/package-release.sh dist
          tools/test-release-package.sh dist/pos3ql-*.tar.gz

      - name: Publish immutable tag artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME" dist/*
          --verify-tag
          --generate-notes
