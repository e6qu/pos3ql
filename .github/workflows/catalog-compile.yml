name: Catalog compile
on:
  push:
    branches: [codex/synchronize-database-definitions]
concurrency:
  group: catalog-compile-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: database-compile-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
      - run: cargo clean -p pos3ql
      - run: cargo check --all-targets --locked
      - run: cargo clippy --lib --bins --locked -- -D warnings
      - run: cargo test --lib --locked database_catalog_is_synchronized -- --nocapture
      - run: cargo test --lib --locked database_reservation_rejects -- --nocapture
      - run: cargo test --lib --locked database_retirement_and_failed_clone -- --nocapture
      - run: cargo test --lib --locked manifest_database_duplicates -- --nocapture
