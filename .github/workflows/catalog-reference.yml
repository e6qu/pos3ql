name: Catalog reference

on:
  push:
    branches: [catalog-statement-visibility]
    paths:
      - src/**
      - Cargo.toml
      - Cargo.lock
      - build.rs
      - tests/external/catalog_snapshot_diff.py
      - tests/external/differential-capacities.conf
      - .github/workflows/catalog-reference.yml

permissions:
  contents: read
  actions: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  reference:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    services:
      postgres:
        image: mirror.gcr.io/library/postgres:18@sha256:74935e72241653ca55e0414067e6d8763aceb8a810eb51b452253ec3dcfc4336
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_INITDB_ARGS: "--lc-collate=C --lc-ctype=C --encoding=UTF8"
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/python-test-environment
        with:
          venv: target/external-venv
      - name: Record actual PostgreSQL catalog visibility
        run: |
          mkdir -p "$RUNNER_TEMP/catalog-reference"
          target/external-venv/bin/python tests/external/catalog_snapshot_diff.py \
            --host 127.0.0.1 --port 5432 --user postgres --database postgres \
            --metadata-output "$RUNNER_TEMP/catalog-reference/metadata.json" \
            --output "$RUNNER_TEMP/catalog-reference/postgresql.json"
          git rev-parse HEAD > "$RUNNER_TEMP/catalog-reference/revision"
          docker inspect '${{ job.services.postgres.id }}' --format '{{.Image}}' > "$RUNNER_TEMP/catalog-reference/postgresql-image"
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: catalog-reference-${{ github.sha }}
          path: ${{ runner.temp }}/catalog-reference/
          if-no-files-found: error

  comparison:
    needs: reference
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-catalog-comparison-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ runner.os }}-differential-build-
      - uses: ./.github/actions/python-test-environment
        with:
          venv: target/external-venv
      - uses: actions/download-artifact@v8
        with:
          name: catalog-reference-${{ github.sha }}
          path: ${{ runner.temp }}/catalog-comparison
      - name: Rebuild the checked-out server
        shell: bash
        run: |
          cargo clean -p pos3ql
          work="$RUNNER_TEMP/catalog-comparison"
          (
            while true; do
              date -u
              ps -C cargo,rustc,cc,ld,clang,lld -o pid,ppid,pcpu,rss,stat,etime,comm || true
              free -m
              if test -r /sys/fs/cgroup/memory.events; then
                cat /sys/fs/cgroup/memory.events
              fi
              sleep 10
            done
          ) > "$work/build-resources.log" &
          monitor=$!
          trap 'kill "$monitor" 2>/dev/null || true; wait "$monitor" 2>/dev/null || true' EXIT
          /usr/bin/time -v cargo build --release --locked 2>&1 | tee "$work/build.log"
          git rev-parse HEAD > "$RUNNER_TEMP/catalog-comparison/candidate-revision"
          sha256sum target/release/pos3ql > "$RUNNER_TEMP/catalog-comparison/candidate-SHA256SUMS"
      - name: Compare live catalog behavior with actual PostgreSQL
        shell: bash
        run: |
          work="$RUNNER_TEMP/catalog-comparison"
          test "$(cat "$work/revision")" = "$GITHUB_SHA"
          cat > "$work/pos3ql.conf" <<EOF
          listen_addr = 127.0.0.1:15599
          data_dir = $work/data
          object_store = off
          log_format = text
          max_tables = 64
          table_rows = 8192
          max_value_indexes = 64
          max_prepared_transactions = 8
          memtable_bytes = 256MiB
          EOF
          cat tests/external/differential-capacities.conf >> "$work/pos3ql.conf"
          target/release/pos3ql --config "$work/pos3ql.conf" > "$work/server.log" 2>&1 &
          server=$!
          trap 'kill "$server" 2>/dev/null || true; wait "$server" 2>/dev/null || true' EXIT
          ready=0
          for attempt in {1..100}; do
            kill -0 "$server"
            if grep -q '^startup complete:.*accepting connections$' "$work/server.log"; then
              ready=1
              break
            fi
            sleep 0.1
          done
          test "$ready" = 1
          target/external-venv/bin/python tests/external/catalog_snapshot_diff.py \
            --host 127.0.0.1 --port 15599 --user postgres --database postgres \
            --reference "$work/postgresql.json" --output "$work/pos3ql.json" \
            2>&1 | tee "$work/comparison.log"
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: catalog-comparison-${{ github.sha }}
          path: |
            ${{ runner.temp }}/catalog-comparison/*.json
            ${{ runner.temp }}/catalog-comparison/*.log
            ${{ runner.temp }}/catalog-comparison/pos3ql.conf
            ${{ runner.temp }}/catalog-comparison/revision
            ${{ runner.temp }}/catalog-comparison/candidate-revision
            ${{ runner.temp }}/catalog-comparison/candidate-SHA256SUMS
            ${{ runner.temp }}/catalog-comparison/postgresql-image
          if-no-files-found: error
