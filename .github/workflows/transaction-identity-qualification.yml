name: Transaction identity qualification
on:
  push:
    branches: [codex/shared-transaction-identities]
concurrency:
  group: transaction-identity-${{ github.ref }}
  cancel-in-progress: true
jobs:
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-
      - run: cargo clean -p pos3ql
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --lib --locked transaction_identit -- --nocapture
      - run: cargo test --lib --locked transaction_exhaustion -- --nocapture
      - run: cargo test --lib --locked unassigned_wal_transactions -- --nocapture
      - run: cargo test --lib --locked prepared_transactions_survive_checkpoint -- --nocapture
      - run: cargo test --lib --locked startup_bounded -- --nocapture
