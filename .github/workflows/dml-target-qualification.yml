name: DML target qualification

on:
  push:
    branches: [retain-dml-target-sources]

concurrency:
  group: dml-target-${{ github.ref }}
  cancel-in-progress: true

jobs:
  conflict:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: mirror.gcr.io/library/postgres:18@sha256:74935e72241653ca55e0414067e6d8763aceb8a810eb51b452253ec3dcfc4336
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_INITDB_ARGS: "--locale-provider=libc --lc-collate=C --lc-ctype=C --encoding=UTF8"
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-
      - run: cargo clean -p pos3ql
      - name: Lint all targets
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: Target ownership, trigger, and command regressions
        run: |
          set -euo pipefail
          for filter in dml_target on_conflict trigger command_exhaustion; do
            cargo test --lib --locked "$filter" -- --nocapture --test-threads=2 2>&1 | tee "$RUNNER_TEMP/dml-target-tests.log"
          done
      - name: Build reference-comparison executable
        id: build
        if: ${{ !cancelled() }}
        run: cargo build --release --locked
      - uses: ./.github/actions/python-test-environment
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        with:
          venv: target/external-venv
      - name: Compare changes to rows selected for UPDATE and DELETE
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        env:
          PGHOST: 127.0.0.1
          PGPORT: "5432"
          PGUSER: postgres
          P3_PORT: "15599"
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/dml-target.conf" <<CONFIG
          listen_addr = 127.0.0.1:15599
          data_dir = $RUNNER_TEMP/dml-target-data
          object_store = off
          max_tables = 64
          table_rows = 8192
          max_value_indexes = 64
          memtable_bytes = 256MiB
          CONFIG
          cat tests/external/differential-capacities.conf >> "$RUNNER_TEMP/dml-target.conf"
          target/release/pos3ql --config "$RUNNER_TEMP/dml-target.conf" > "$RUNNER_TEMP/dml-target.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"; cat "$RUNNER_TEMP/dml-target.log"' EXIT
          for attempt in $(seq 1 100); do
            kill -0 "$server_pid"
            if psql -h 127.0.0.1 -p 15599 -U postgres -tAc 'SELECT 1' >/dev/null 2>&1; then
              break
            fi
            test "$attempt" -lt 100
            sleep 0.1
          done
          target/external-venv/bin/python - <<'PYCODE'
          import sys
          sys.path.insert(0, 'tests/external')
          import mvcc_diff
          def transcript(port):
              with mvcc_diff.connect(port) as reader, mvcc_diff.connect(port) as writer:
                  return mvcc_diff.dml_target_transcript(reader, writer)
          expected = transcript(5432)
          print('PostgreSQL:', expected, flush=True)
          observed = transcript(15599)
          print('pos3ql:', observed, flush=True)
          assert observed == expected, 'DML target divergence'
          PYCODE
          target/external-venv/bin/python tests/external/mvcc_diff.py
      - name: Trigger, inheritance, DML, and foreign-key SQL
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        env:
          PGHOST: 127.0.0.1
          PGPORT: "5432"
          PGUSER: postgres
          RUN_FAST: "0"
          RUN_CORE: "0"
          RUN_CORPUS: "1"
          RUN_AUX: "0"
          RUN_SLT: "0"
          RUN_FUZZ: "0"
          FAST_CORPUS_SHARDS: "1"
        run: |
          set -euo pipefail
          for corpus in 66_on_conflict 90_row_triggers 100_constraint_lifecycle 106_row_level_security 117_dml_row_assignments; do
            FAST_CORPUS_ONLY="$corpus" bash tests/external/ci_diff.sh
          done
      - name: Symbolicate allocation failures in one batch
        if: failure()
        run: |
          python3 - <<'PYCODE'
          import os, re, subprocess
          from pathlib import Path
          log = Path(os.environ["RUNNER_TEMP"]) / "dml-target-tests.log"
          if log.exists():
              frames = re.findall(r"(\S*/target/debug/deps/pos3ql-[0-9a-f]+)\(\+(0x[0-9a-f]+)\)", log.read_text(errors="replace"))
              for binary in sorted({binary for binary, _ in frames}):
                  addresses = [address for owner, address in frames if owner == binary]
                  subprocess.run(["addr2line", "-C", "-f", "-e", binary, *addresses], check=True)
          PYCODE
