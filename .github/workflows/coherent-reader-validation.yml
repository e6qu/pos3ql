name: Coherent reader validation

on:
  push:
    branches: [coherent-reader-publication]

concurrency:
  group: coherent-reader-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: mirror.gcr.io/library/postgres:18@sha256:74935e72241653ca55e0414067e6d8763aceb8a810eb51b452253ec3dcfc4336
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432/tcp
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - name: Cache Rust dependencies and build
        id: cache
        uses: actions/cache/restore@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-coherent-reader-${{ hashFiles('Cargo.lock') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-coherent-reader-${{ hashFiles('Cargo.lock') }}-
            ${{ runner.os }}-transaction-publication-${{ hashFiles('Cargo.lock') }}-
            ${{ runner.os }}-cargo-
      - name: Format and record tested source
        run: |
          cargo fmt
          git diff --binary -- src > "$RUNNER_TEMP/format.patch"
          git add src
          git rev-parse HEAD > "$RUNNER_TEMP/validation-head"
          validation_tree=$(git write-tree)
          printf '%s\n' "$validation_tree" > "$RUNNER_TEMP/validation-tree"
          git rev-parse "${validation_tree}:src" > "$RUNNER_TEMP/validation-source-tree"
          git rev-parse "${validation_tree}:tests/external/differential_exact" > "$RUNNER_TEMP/validation-fixture-tree"
      - uses: actions/upload-artifact@v6
        with:
          name: coherent-reader-format
          path: |
            ${{ runner.temp }}/format.patch
            ${{ runner.temp }}/validation-head
            ${{ runner.temp }}/validation-tree
            ${{ runner.temp }}/validation-source-tree
            ${{ runner.temp }}/validation-fixture-tree
      - name: All-target compilation and lint
        run: cargo clippy --all-targets --locked -- -D warnings
      - uses: ./.github/actions/python-test-environment
        with:
          venv: ${{ runner.temp }}/pos3ql-python
      - name: PostgreSQL rewrite reference
        env:
          POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          python3 - <<'PYTHON'
          import os, pathlib, subprocess
          fixture = pathlib.Path("tests/external/differential_exact/18_row_layout.sql").read_text()
          result = subprocess.run(["docker", "exec", "-i", os.environ["POSTGRES_CONTAINER"],
              "psql", "-U", "postgres", "-d", "postgres", "-X", "-qAt", "-v", "ON_ERROR_STOP=1"],
              input=fixture, text=True, capture_output=True, check=True, timeout=5)
          expected = ["130|8515|integer", "11|order|bigint", "8|bigint", "replacement"]
          assert result.stdout.splitlines() == expected, (result.stdout, result.stderr)
          print("PostgreSQL 18 rewrite, rollback and temporary reuse:", expected)
          PYTHON
      - name: PostgreSQL concurrent and prepared rewrite reference
        env:
          POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
          PGHOST: 127.0.0.1
          PGPORT: ${{ job.services.postgres.ports[5432] }}
          PGUSER: postgres
          PGPASSWORD: postgres
        run: |
          docker exec "$POSTGRES_CONTAINER" psql -U postgres -c 'ALTER SYSTEM SET max_prepared_transactions = 1'
          docker restart "$POSTGRES_CONTAINER"
          for attempt in $(seq 1 10); do
            if docker exec "$POSTGRES_CONTAINER" pg_isready -U postgres; then break; fi
            sleep 1
          done
          "${{ runner.temp }}/pos3ql-python/bin/python" - <<'PYTHON'
          import os, sys
          sys.path.insert(0, "tests/external")
          from mvcc_diff import connect, row_layout_publication_transcript
          with connect(int(os.environ["PGPORT"])) as reader, connect(int(os.environ["PGPORT"])) as writer:
              reader.execute("SET statement_timeout = '5s'")
              writer.execute("SET statement_timeout = '5s'")
              observed = row_layout_publication_transcript(reader, writer)
          expected = [f"row_layout_prepared={prepared},older:0,invoices:[(22,)],current:[(1, 'bigint')],updated:[(2,)],batch:{batch}" for prepared, batch in ((False, "not_applicable"), (True, "25001"))]
          assert observed == expected, observed
          print("PostgreSQL 18 concurrent rewrite publication:", observed)
          PYTHON
      - name: Row layouts, retained readers, maintenance and transaction recovery
        run: >-
          cargo test --release --lib --locked --
          row_layout:: row_scans:: row_walks:: row_images:: row_reads::
          snapshot_reclamation:: row_cleanup:: row_publication::
          spill_generations:: table_name_ table_definition_ row_definition_
          statement_row_ transaction_publication:: prepared_transaction
          --test-threads=1 --nocapture
      - name: Retain build cache after a failed regression too
        if: always() && steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-coherent-reader-${{ hashFiles('Cargo.lock') }}-${{ github.sha }}
