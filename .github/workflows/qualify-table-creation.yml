name: Qualify shared table creation

on:
  push:
    branches: [share-table-creation]

jobs:
  admission:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-library-tests-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-
      - run: cargo clean -p pos3ql
      - name: Compile and lint all targets
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: Table lifetime admission, concurrent creation and retained-row publication
        run: |
          set -eu
          for selection in storage::row_publication::tests:: shared_table_creation table_retirement catalog_object_pools_follow_their_independent_startup_capacities; do
            cargo test --lib --locked "$selection" -- --test-threads=1 --nocapture | tee "$RUNNER_TEMP/admission-$selection.log"
            if ! grep -Eq 'test result: ok\. [1-9][0-9]* passed' "$RUNNER_TEMP/admission-$selection.log"; then exit 1; fi
          done
      - name: Prepared and database-clone cold recovery
        run: |
          set -eu
          for selection in prepared_transactions_survive_checkpoint_and_object_cold_recovery database_template_catalogs_diverge_and_survive_object_cold_recovery; do
            cargo test --lib --locked "$selection" -- --test-threads=1 --nocapture | tee "$RUNNER_TEMP/admission-$selection.log"
            if ! grep -Eq 'test result: ok\. [1-9][0-9]* passed' "$RUNNER_TEMP/admission-$selection.log"; then exit 1; fi
          done
