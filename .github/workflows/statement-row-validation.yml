name: Statement row validation

on:
  push:
    branches: [bind-statement-row-sources]

concurrency:
  group: statement-row-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: mirror.gcr.io/library/postgres:18@sha256:74935e72241653ca55e0414067e6d8763aceb8a810eb51b452253ec3dcfc4336
        env:
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - name: Format and record the tested source
        run: |
          cargo fmt
          git diff --binary -- src > "$RUNNER_TEMP/format.patch"
          git add src
          git rev-parse HEAD > "$RUNNER_TEMP/validation-head"
          validation_tree=$(git write-tree)
          printf '%s\n' "$validation_tree" > "$RUNNER_TEMP/validation-tree"
          git rev-parse "${validation_tree}:src" > "$RUNNER_TEMP/validation-source-tree"
      - name: Retain tested source provenance and formatting corrections
        uses: actions/upload-artifact@v6
        with:
          name: statement-row-format
          path: |
            ${{ runner.temp }}/format.patch
            ${{ runner.temp }}/validation-head
            ${{ runner.temp }}/validation-tree
            ${{ runner.temp }}/validation-source-tree
      - name: PostgreSQL row and definition reference
        env:
          POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          python3 - <<'PYTHON'
          import os, pathlib, subprocess
          sql = pathlib.Path("tests/external/differential_exact/13_row_definition_writes.sql").read_bytes()
          observed = subprocess.check_output([
              "docker", "exec", "-i", os.environ["POSTGRES_CONTAINER"], "psql", "-U", "postgres",
              "-d", "postgres", "-v", "ON_ERROR_STOP=1", "-X", "-qAt"
          ], input=sql).decode().splitlines()
          expected = ["1|first|8", "2|second|5", "3|third|9", "1|first|8", "2|second|12", "4|fourth|14"]
          assert observed == expected, observed
          print("PostgreSQL reference:", observed)
          sql = pathlib.Path("tests/external/differential_exact/14_statement_row_paths.sql").read_bytes()
          observed = subprocess.check_output([
              "docker", "exec", "-i", os.environ["POSTGRES_CONTAINER"], "psql", "-U", "postgres",
              "-d", "postgres", "-v", "ON_ERROR_STOP=1", "-X", "-qAt"
          ], input=sql).decode().splitlines()
          expected = ["1|7|20|10", "2|7|12|6", "1|7|20|10", "2|7|12|6", "1|20|10", "2|12|8", "2"]
          assert observed == expected, observed
          print("PostgreSQL statement paths:", observed)
          PYTHON
      - name: All-target compilation and lint
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: Statement write and recovery regressions
        run: >-
          cargo test --release --lib --locked -- statement_row_ row_definition_ row_undo_source_ row_publication:: row_ownership::
          table_definition_ pending_table_definition type_edits:: query_definition_ copy_ replication_ partition_ foreign_key_ large_object_ prepared_ heap_relocation::
          --test-threads=1
