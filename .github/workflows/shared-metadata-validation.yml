name: Shared metadata validation

on:
  push:
    branches: [finish-shared-metadata-lifetimes]

concurrency:
  group: shared-metadata-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: mirror.gcr.io/library/postgres:18@sha256:74935e72241653ca55e0414067e6d8763aceb8a810eb51b452253ec3dcfc4336
        env:
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - name: Verify PostgreSQL reference behavior
        env:
          POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          python3 - <<'PYTHON'
          import os, pathlib, subprocess
          sql = pathlib.Path("tests/external/differential_exact/06_metadata_comment_lifetimes.sql").read_bytes()
          output = subprocess.check_output([
              "docker", "exec", "-i", os.environ["POSTGRES_CONTAINER"],
              "psql", "-U", "postgres", "-d", "postgres", "-v", "ON_ERROR_STOP=1", "-X", "-qAt"
          ], input=sql).decode().splitlines()
          assert output == ["fresh", "replacement"], output
          print("PostgreSQL reference:", output)
          PYTHON
      - name: Sequence and saved-query lifetime regressions
        run: >-
          cargo test --release --lib --locked -- sequence query_lifecycle
          --test-threads=1
      - name: All-target compilation and lint
        run: cargo clippy --all-targets --locked -- -D warnings
