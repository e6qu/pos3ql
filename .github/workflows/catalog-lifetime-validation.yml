name: Catalog lifetime validation
on:
  push:
    branches: [catalog-lifetime-identifiers]
concurrency:
  group: catalog-lifetime-validation
  cancel-in-progress: true
jobs:
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: catalog-lifetime-dependencies-${{ hashFiles('Cargo.lock') }}
      - name: Formatting
        run: cargo fmt --all -- --check
      - name: Focused lifetime and recovery regressions
        run: cargo test --lib --locked -- public_identifiers catalog_lifetime metadata_database_copy --test-threads=1
      - name: All-target lint
        run: cargo clippy --all-targets --locked -- -D warnings
