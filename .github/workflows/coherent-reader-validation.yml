name: Coherent reader validation

on:
  push:
    branches: [coherent-reader-publication]

concurrency:
  group: coherent-reader-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - name: Cache Rust dependencies and build
        id: cache
        uses: actions/cache/restore@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-coherent-reader-${{ hashFiles('Cargo.lock') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-coherent-reader-${{ hashFiles('Cargo.lock') }}-
            ${{ runner.os }}-transaction-publication-${{ hashFiles('Cargo.lock') }}-
            ${{ runner.os }}-cargo-
      - name: Format and record tested source
        run: |
          cargo fmt
          git diff --binary -- src > "$RUNNER_TEMP/format.patch"
          git add src
          git rev-parse HEAD > "$RUNNER_TEMP/validation-head"
          validation_tree=$(git write-tree)
          printf '%s\n' "$validation_tree" > "$RUNNER_TEMP/validation-tree"
          git rev-parse "${validation_tree}:src" > "$RUNNER_TEMP/validation-source-tree"
          git rev-parse "${validation_tree}:tests/external/differential_exact" > "$RUNNER_TEMP/validation-fixture-tree"
      - uses: actions/upload-artifact@v6
        with:
          name: coherent-reader-format
          path: |
            ${{ runner.temp }}/format.patch
            ${{ runner.temp }}/validation-head
            ${{ runner.temp }}/validation-tree
            ${{ runner.temp }}/validation-source-tree
            ${{ runner.temp }}/validation-fixture-tree
      - name: All-target compilation and lint
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: Row layouts, retained readers, maintenance and transaction recovery
        run: >-
          cargo test --release --lib --locked --
          row_layout:: row_scans:: row_walks:: row_images:: row_reads::
          snapshot_reclamation:: row_cleanup:: row_publication::
          spill_generations:: table_name_ table_definition_ row_definition_
          statement_row_ transaction_publication:: prepared_transaction
          --test-threads=1
      - name: Retain build cache after a failed regression too
        if: always() && steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-coherent-reader-${{ hashFiles('Cargo.lock') }}-${{ github.sha }}
