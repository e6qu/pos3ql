name: Heap location validation
on:
  push:
    branches: [codex/heap-location-generations]
  workflow_dispatch:
concurrency:
  group: heap-location-validation
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-
      - run: cargo clean -p pos3ql
      - name: Format on runner
        run: |
          cargo fmt --all
          git diff > heap-location-format.patch
      - uses: actions/upload-artifact@v6
        with:
          name: heap-location-format
          path: heap-location-format.patch
      - run: cargo check --all-targets --locked
      - run: cargo clippy --all-targets --locked -- -D warnings
      - name: Heap ownership and recovery
        run: |
          cargo test --lib --locked row_heap_ -- --nocapture
          cargo test --lib --locked heap_compaction -- --nocapture
          cargo test --lib --locked row_read_ownership -- --nocapture
          cargo test --lib --locked prepared_transactions_survive_checkpoint_and_object_cold_recovery -- --nocapture
