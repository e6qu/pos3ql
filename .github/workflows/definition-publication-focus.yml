name: Definition publication focus

on:
  push:
    branches: [shared-definition-publication]
  workflow_dispatch:

concurrency:
  group: definition-publication-focus-${{ github.ref }}
  cancel-in-progress: true

jobs:
  focused:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: mirror.gcr.io/library/postgres:18@sha256:74935e72241653ca55e0414067e6d8763aceb8a810eb51b452253ec3dcfc4336
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_INITDB_ARGS: "--lc-collate=C --lc-ctype=C --encoding=UTF8"
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: key-preparation-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            coherent-readers-${{ runner.os }}-
            ${{ runner.os }}-cargo-
      - name: Format and retain exact patch
        run: |
          cargo fmt
          git diff --binary > "$RUNNER_TEMP/format.patch"
      - uses: actions/upload-artifact@v6
        with:
          name: definition-publication-format
          path: ${{ runner.temp }}/format.patch
      - name: Compile and lint all targets
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: PostgreSQL 18 exact SQL reference
        if: ${{ !cancelled() }}
        run: |
          python3 - <<'PY'
          import pathlib
          import subprocess

          image = "mirror.gcr.io/library/postgres:18@sha256:74935e72241653ca55e0414067e6d8763aceb8a810eb51b452253ec3dcfc4336"
          containers = subprocess.check_output(["docker", "ps", "--filter", f"ancestor={image}", "--format", "{{.ID}}"], text=True).splitlines()
          assert len(containers) == 1, containers
          command = ["docker", "exec", "-i", containers[0], "psql", "-U", "postgres", "-X", "-q", "-A", "-t", "-v", "ON_ERROR_STOP=1"]
          version = subprocess.run(command, input="SHOW server_version_num;", text=True, capture_output=True, check=True)
          assert 180000 <= int(version.stdout.strip()) < 190000, version.stdout
          cases = [
              ("19_key_preparation.sql", ["1", "1|11", "3|20|23", "2|5|42"]),
              ("20_table_publication.sql", ["1|10", "1", "3", "published table", "published index", "1", "2|30", "2"]),
          ]
          for name, expected in cases:
              fixture = pathlib.Path("tests/external/differential_exact", name).read_text()
              result = subprocess.run(command, input=fixture, text=True, capture_output=True, check=True)
              assert result.stdout.splitlines() == expected, (name, result.stdout, result.stderr)
              print(f"PostgreSQL {version.stdout.strip()} {name}: {expected}")
          PY
      - name: Definition publication, ownership, rows and index regressions
        if: ${{ !cancelled() }}
        run: >-
          cargo test --release --lib --locked --
          table_publication_ table_definition_ pending_table_definition_
          type_ domain_ enum_ composite_ shared_type_
          key_preparation_ row_layout_ shared_row_publication_ private_index_bindings_
          row_walk_ value_index_ expression_index partial_index
          index_ columnar_
          index_creation_cache_failure_ failed_index_cache_reservation_
          configured_transaction_capacity_covers_truncate_fanout_
          configured_transaction_ddl_capacity_drives_commit_and_index_scratch
          --test-threads=1 --color=never --format=pretty
