name: Owned row walk qualification
on:
  push:
    branches: [codex/owned-row-walk-identities]
concurrency:
  group: owned-row-walk-${{ github.ref }}
  cancel-in-progress: true
jobs:
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-
      - run: cargo clean -p pos3ql
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --lib --locked owned_row_walk_identities -- --nocapture
      - run: cargo test --lib --locked retained_row_walk -- --nocapture
      - run: cargo test --lib --locked retained_byte_scan -- --nocapture
      - run: cargo test --lib --locked captured_row_scans -- --nocapture
      - run: cargo test --lib --locked startup_bounded -- --nocapture
