name: Validate type edit ownership

on:
  push:
    branches: [protect-type-edit-lifetimes]

permissions:
  contents: read

concurrency:
  group: type-edits-${{ github.ref }}
  cancel-in-progress: true

jobs:
  type-edits:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-type-edits-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-library-tests-
      - run: cargo clean -p pos3ql
      - name: Record formatting without changing the tested source
        run: |
          cargo fmt --all
          git diff --binary > "$RUNNER_TEMP/type-edits-format.patch"
          git rev-parse HEAD > "$RUNNER_TEMP/type-edits-format-head.txt"
          git restore -- .
          git diff --exit-code
      - uses: actions/upload-artifact@v6
        with:
          name: type-edit-formatting
          path: |
            ${{ runner.temp }}/type-edits-format.patch
            ${{ runner.temp }}/type-edits-format-head.txt
      - name: Type lifetime, rollback and SQL behavior
        run: >-
          cargo test --lib --locked --
          storage::type_
          type_definition_transactions
          config::tests
          enum
          domain
          composite
          --test-threads=1
      - name: Check runtime lints
        run: cargo clippy --lib --bins -- -D warnings
