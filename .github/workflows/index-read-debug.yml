name: Index read diagnosis

on:
  pull_request:

concurrency:
  group: index-read-diagnosis-${{ github.ref }}
  cancel-in-progress: true

jobs:
  allocation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-library-tests-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-
      - run: cargo clean -p pos3ql
      - run: python3 tools/test_command.py cargo test --locked --lib index_file_owners_unrelated_commits -- --nocapture --test-threads=1
