name: catalog compile
on:
  push:
    branches: [codex/synchronize-view-rule-publication]
concurrency:
  group: catalog-compile-${{ github.ref }}
  cancel-in-progress: true
jobs:
  compile:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}
      - run: cargo clean -p pos3ql
      - run: cargo check --all-targets --locked
