name: Catalog publication validation

on:
  push:
    branches: [scope-catalog-publication]

concurrency:
  group: catalog-publication-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: mirror.gcr.io/library/postgres:18@sha256:74935e72241653ca55e0414067e6d8763aceb8a810eb51b452253ec3dcfc4336
        env:
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - name: Format and record the tested source
        run: |
          cargo fmt
          git diff --binary -- src > "$RUNNER_TEMP/format.patch"
          git add src
          git rev-parse HEAD > "$RUNNER_TEMP/validation-head"
          validation_tree=$(git write-tree)
          printf '%s\n' "$validation_tree" > "$RUNNER_TEMP/validation-tree"
          git rev-parse "${validation_tree}:src" > "$RUNNER_TEMP/validation-source-tree"
      - name: Retain tested source provenance and formatting corrections
        uses: actions/upload-artifact@v6
        with:
          name: catalog-publication-format
          path: |
            ${{ runner.temp }}/format.patch
            ${{ runner.temp }}/validation-head
            ${{ runner.temp }}/validation-tree
            ${{ runner.temp }}/validation-source-tree
      - name: PostgreSQL catalog publication reference
        env:
          POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          python3 - <<'PYTHON'
          import os, pathlib, select, subprocess
          command = ["docker", "exec", "-i", os.environ["POSTGRES_CONTAINER"], "psql", "-U", "postgres", "-d", "postgres", "-X", "-qAt", "-v", "ON_ERROR_STOP=1"]
          fixture = pathlib.Path("tests/external/differential_exact/15_catalog_publication.sql").read_text()
          setup, marker, changes = fixture.partition("-- Changes while another connection retains unrelated work.")
          assert marker
          subprocess.run(command, input=setup, text=True, check=True)
          reader = subprocess.Popen(command, stdin=subprocess.PIPE, stdout=subprocess.PIPE, stderr=subprocess.PIPE, text=True, bufsize=1)
          try:
              reader.stdin.write("BEGIN ISOLATION LEVEL REPEATABLE READ; SELECT 'ready' FROM catalog_receipts; SELECT 'orders' FROM catalog_orders;\n")
              reader.stdin.flush()
              assert select.select([reader.stdout], [], [], 5)[0], "reference reader did not start"
              assert reader.stdout.readline().strip() == "ready"
              assert reader.stdout.readline().strip() == "orders"
              result = subprocess.run(command, input="SET lock_timeout = '1s'; SET statement_timeout = '4s'; " + changes, text=True, capture_output=True, check=True, timeout=5)
              assert result.stdout.splitlines() == ["1", "22", "9", "ready", "(7,ok)"], result.stdout
              output, errors = reader.communicate("SELECT id FROM catalog_invoices; SELECT id FROM catalog_orders; COMMIT;\n", timeout=5)
              assert reader.returncode == 0, errors
              assert output.splitlines() == ["22", "1"], output
              print("PostgreSQL catalog changes with unrelated and related readers:", result.stdout.splitlines())
          finally:
              if reader.poll() is None:
                  reader.communicate("ROLLBACK;\n", timeout=5)
          cases = [
              "CREATE TABLE nested_values (value validation_root[])",
              "CREATE DOMAIN validation_child AS validation_root; CREATE TABLE nested_values (value validation_child[])",
              "CREATE TYPE validation_pair AS (value validation_root); CREATE TABLE nested_values (value validation_pair)",
              "CREATE TYPE validation_pair AS (value validation_root); CREATE TYPE validation_outer AS (value validation_pair[]); CREATE DOMAIN validation_holder AS validation_outer; CREATE TABLE nested_values (value validation_holder)",
              "CREATE DOMAIN validation_vector AS validation_root[]; CREATE TABLE nested_values (value validation_vector)",
              "CREATE TABLE nested_values (id integer, value validation_root[]) PARTITION BY RANGE (id)",
              "CREATE MATERIALIZED VIEW nested_values AS SELECT ARRAY[1::validation_root] AS value",
          ]
          prefix = "SET search_path = catalog_validation_reference, public; "
          for setup in cases:
              subprocess.run(command, input="DROP SCHEMA IF EXISTS catalog_validation_reference CASCADE; CREATE SCHEMA catalog_validation_reference; " + prefix + "CREATE DOMAIN validation_root AS integer; " + setup, text=True, check=True, capture_output=True, timeout=5)
              for change in ["ALTER DOMAIN validation_root ADD CONSTRAINT validation_positive CHECK (VALUE > 0)", "ALTER DOMAIN validation_root SET NOT NULL"]:
                  result = subprocess.run(command + ["-v", "VERBOSITY=sqlstate"], input=prefix + change, text=True, capture_output=True, timeout=5)
                  assert result.returncode != 0 and "0A000" in result.stderr, (setup, change, result.stdout, result.stderr)
          print("PostgreSQL stored domain containers: all seven cases reject both alterations with 0A000")
          setup = "CREATE DOMAIN validation_element AS integer; CREATE DOMAIN validation_complete_vector AS validation_element[]; CREATE TABLE validation_vectors (value validation_complete_vector); INSERT INTO validation_vectors VALUES (ARRAY[1,2]::validation_complete_vector); ALTER DOMAIN validation_complete_vector ADD CONSTRAINT validation_length CHECK (cardinality(VALUE) = 2); SELECT value::text FROM validation_vectors"
          result = subprocess.run(command, input=setup, text=True, capture_output=True, check=True, timeout=5)
          assert result.stdout.splitlines() == ["{1,2}"], result.stdout
          setup = "CREATE DOMAIN validation_unstored AS integer; CREATE TYPE validation_unstored_pair AS (value validation_unstored); CREATE VIEW validation_unstored_view AS SELECT ARRAY[1::validation_unstored] AS value; CREATE FOREIGN DATA WRAPPER validation_wrapper; CREATE SERVER validation_server FOREIGN DATA WRAPPER validation_wrapper; CREATE FOREIGN TABLE validation_remote (value validation_unstored[]) SERVER validation_server; ALTER DOMAIN validation_unstored ADD CONSTRAINT validation_unstored_positive CHECK (VALUE > 0); ALTER DOMAIN validation_unstored SET NOT NULL"
          subprocess.run(command, input=setup, text=True, capture_output=True, check=True, timeout=5)
          setup = "CREATE FUNCTION validation_rule(integer) RETURNS boolean LANGUAGE sql IMMUTABLE AS 'SELECT $1 > 0'; CREATE DOMAIN validation_value AS integer CONSTRAINT validation_existing CHECK (validation_rule(VALUE)); CREATE TABLE validation_items (value validation_value); INSERT INTO validation_items VALUES (1); CREATE DOMAIN validation_required AS integer NOT NULL; CREATE TABLE validation_required_arrays (value validation_required[]); ALTER DOMAIN validation_value VALIDATE CONSTRAINT validation_existing; ALTER DOMAIN validation_required SET NOT NULL; CREATE OR REPLACE FUNCTION validation_rule(integer) RETURNS boolean LANGUAGE sql IMMUTABLE AS 'SELECT $1 > 10'"
          subprocess.run(command, input=setup, text=True, capture_output=True, check=True, timeout=5)
          result = subprocess.run(command + ["-v", "VERBOSITY=sqlstate"], input="ALTER DOMAIN validation_value VALIDATE CONSTRAINT validation_existing", text=True, capture_output=True, timeout=5)
          assert result.returncode != 0 and "23514" in result.stderr, result.stderr
          subprocess.run(command, input="CREATE DOMAIN validation_locked AS integer; CREATE TABLE validation_locked_values(value validation_locked); INSERT INTO validation_locked_values VALUES(20)", text=True, capture_output=True, check=True, timeout=5)
          writer = subprocess.Popen(command, stdin=subprocess.PIPE, stdout=subprocess.PIPE, stderr=subprocess.PIPE, text=True, bufsize=1)
          try:
              writer.stdin.write("BEGIN; INSERT INTO validation_locked_values VALUES(2); SELECT 'ready';\n")
              writer.stdin.flush()
              assert select.select([writer.stdout], [], [], 5)[0]
              assert writer.stdout.readline().strip() == "ready"
              change = "ALTER DOMAIN validation_locked ADD CONSTRAINT validation_large CHECK (VALUE > 10)"
              result = subprocess.run(command + ["-v", "VERBOSITY=sqlstate"], input="SET lock_timeout = '200ms'; " + change, text=True, capture_output=True, timeout=5)
              assert result.returncode != 0 and "55P03" in result.stderr, result.stderr
              output, errors = writer.communicate("COMMIT;\n", timeout=5)
              assert writer.returncode == 0, errors
              result = subprocess.run(command + ["-v", "VERBOSITY=sqlstate"], input=change, text=True, capture_output=True, timeout=5)
              assert result.returncode != 0 and "23514" in result.stderr, result.stderr
              print("PostgreSQL domain validation waits for writers and rechecks their committed values")
          finally:
              if writer.poll() is None:
                  writer.communicate("ROLLBACK;\n", timeout=5)
          PYTHON
      - name: All-target compilation and lint
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: Catalog publication and recovery regressions
        run: >-
          cargo test --release --lib --locked -- catalog_publication_ alter_domain_ domain_ composite_ type_definitions:: type_edits::
          named_type_ shared_type_ table_definition_ schema_ copy_ concurrent_partition_detach
          configured_user_type_ statement_arena_scales_event_graphs_
          domains_enforce_and_report parallel_checkpoint_ constraint_validation_reuses_fixed_arena_
          --test-threads=1
