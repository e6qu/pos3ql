name: Shared metadata validation

on:
  push:
    branches: [finish-shared-metadata-lifetimes]

concurrency:
  group: shared-metadata-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: mirror.gcr.io/library/postgres:18@sha256:74935e72241653ca55e0414067e6d8763aceb8a810eb51b452253ec3dcfc4336
        env:
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - name: Verify PostgreSQL reference behavior
        env:
          POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          python3 - <<'PYTHON'
          import os, pathlib, subprocess
          fixtures = {
              "09_metadata_object_descriptions.sql": ["function|function", "table|table", "t", "type|type"],
              "06_metadata_comment_lifetimes.sql": ["fresh", "replacement"],
              "08_metadata_relation_replacements.sql": ["fresh", "replacement", "fresh", "2", "replacement", "type comment"],
              "07_metadata_savepoints.sql": ["10", "50", "11", "12", "changed", "changed", "2", "original", "2", "original", "changed", "9", "replacement"],
          }
          for filename, expected in fixtures.items():
              sql = (pathlib.Path("tests/external/differential_exact") / filename).read_bytes()
              output = subprocess.check_output([
                  "docker", "exec", "-i", os.environ["POSTGRES_CONTAINER"],
                  "psql", "-U", "postgres", "-d", "postgres", "-v", "ON_ERROR_STOP=1", "-X", "-qAt"
              ], input=sql).decode().splitlines()
              assert output == expected, (filename, output)
              print("PostgreSQL reference:", filename, output)
          print("PostgreSQL object description signatures:", subprocess.check_output([
              "docker", "exec", os.environ["POSTGRES_CONTAINER"], "psql", "-U", "postgres", "-d", "postgres", "-X", "-qAt", "-c",
              "SELECT oid, proargtypes FROM pg_proc WHERE proname = 'obj_description' ORDER BY oid"
          ]).decode().splitlines())
          PYTHON
      - name: All-target compilation and lint
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: Metadata lifetime regressions
        run: >-
          cargo test --release --lib --locked -- sequence routine metadata_ query_lifecycle matview materialized_view table_lifecycle table_catalog_lifecycle table_retirement wal:: checkpoint:: durable_catalog_position prepared_transaction database_clone_positions typed_catalog_capacities
          --test-threads=1
