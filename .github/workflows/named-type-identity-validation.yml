name: Named type identity validation

on:
  push:
    branches: [catalog-type-lifetimes]

concurrency:
  group: named-type-identity-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: mirror.gcr.io/library/postgres:18@sha256:74935e72241653ca55e0414067e6d8763aceb8a810eb51b452253ec3dcfc4336
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_INITDB_ARGS: "--lc-collate=C --lc-ctype=C --encoding=UTF8"
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-
      - name: Check named-type behavior against PostgreSQL
        env:
          POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
        shell: bash
        run: |
          set -euo pipefail
          docker exec "$POSTGRES_CONTAINER" psql -U postgres -X -At -c 'SELECT version()'
          for fixture in tests/external/differential_exact/{23_named_type_defaults,24_named_type_identities,25_numeric_privileges}.sql; do
            database=$(basename "$fixture" .sql)
            docker exec "$POSTGRES_CONTAINER" createdb -U postgres "$database"
            docker exec -i "$POSTGRES_CONTAINER" psql -U postgres -d "$database" -X -Atq -v ON_ERROR_STOP=1 < "$fixture" > "$RUNNER_TEMP/$database.reference"
            test -s "$RUNNER_TEMP/$database.reference"
            if grep -v '^t$' "$RUNNER_TEMP/$database.reference"; then
              exit 1
            fi
            cat "$RUNNER_TEMP/$database.reference"
          done
          docker exec "$POSTGRES_CONTAINER" createdb -U postgres numeric_privilege_errors
          docker exec -i "$POSTGRES_CONTAINER" psql -U postgres -d numeric_privilege_errors -X -Atq -v VERBOSITY=verbose < tests/external/differential_exact/26_numeric_privilege_errors.sql > "$RUNNER_TEMP/26_numeric_privilege_errors.reference" 2>&1
          sed -nE 's/^ERROR:  ([0-9A-Z]{5}):.*/\1/p' "$RUNNER_TEMP/26_numeric_privilege_errors.reference" > "$RUNNER_TEMP/privilege-states"
          printf '%s\n' 22023 22023 22023 22023 22023 22023 42704 3F000 42883 > "$RUNNER_TEMP/expected-privilege-states"
          diff -u "$RUNNER_TEMP/expected-privilege-states" "$RUNNER_TEMP/privilege-states"
      - name: Format and retain correction
        run: |
          cargo fmt
          git diff --binary > "$RUNNER_TEMP/formatting.patch"
      - name: Verify compact identity layouts
        shell: bash
        run: |
          cargo test --lib --locked -- named_type_creation_code_layout_probe type_creation_identity_roundtrips_without_allocation type_identity_index_replaces_at_capacity_and_isolates_databases_without_allocation cached_array_descriptors_preserve_maximum_creation_identities_without_allocation --nocapture --test-threads=1 2>&1 | tee "$RUNNER_TEMP/layout.log"
          grep -Eq 'test result: ok\. 4 passed; 0 failed; 0 ignored;' "$RUNNER_TEMP/layout.log"
      - name: Diagnose new cold-recovery and privilege regressions
        shell: bash
        run: |
          python3 tools/test_command.py cargo test --lib --locked -- named_type_cached_defaults numeric_type_schema type_recovery_installs_saved_birth restored_type_identity_rejects --nocapture --test-threads=1 2>&1 | tee "$RUNNER_TEMP/new-type-regressions.log"
          grep -Eq 'test result: ok\. 4 passed; 0 failed; 0 ignored;' "$RUNNER_TEMP/new-type-regressions.log"
      - name: Named type lifecycle, recovery and startup accounting
        shell: bash
        run: |
          python3 tools/test_command.py cargo test --lib --locked -- type_ domain enum composite database_clone relation_identity_ budget startup --test-threads=1 2>&1 | tee "$RUNNER_TEMP/type-lifetimes.log"
          grep -Eq 'test result: ok\. [1-9][0-9]* passed; 0 failed; 0 ignored;' "$RUNNER_TEMP/type-lifetimes.log"
      - name: Build every target and lint
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: Retain layout and formatting evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: named-type-layout-${{ github.sha }}
          path: |
            ${{ runner.temp }}/formatting.patch
            ${{ runner.temp }}/*.reference
            ${{ runner.temp }}/layout.log
            ${{ runner.temp }}/type-lifetimes.log
            ${{ runner.temp }}/new-type-regressions.log
          if-no-files-found: error
