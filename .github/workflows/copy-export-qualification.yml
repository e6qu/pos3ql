name: COPY export qualification

on:
  push:
    branches: [retain-copy-export-row-sources]

concurrency:
  group: copy-export-${{ github.ref }}
  cancel-in-progress: true

jobs:
  exports:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: mirror.gcr.io/library/postgres:18@sha256:74935e72241653ca55e0414067e6d8763aceb8a810eb51b452253ec3dcfc4336
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_INITDB_ARGS: "--locale-provider=libc --lc-collate=C --lc-ctype=C --encoding=UTF8"
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-
      - run: cargo clean -p pos3ql
      - name: Lint and export regressions
        run: |
          set -euo pipefail
          cargo clippy --all-targets --locked -- -D warnings
          for filter in copy_ arena_owned_slices captured_resident_byte_scans owned_ordered startup \
            external_windows_spill_through_the_provider_neutral_block_store wide_join_trees_execute_without_allocation; do
            cargo test --lib --locked "$filter" -- --nocapture --test-threads=2
          done
      - uses: ./.github/actions/python-test-environment
        with:
          venv: target/external-venv
      - name: Export transcript against vanilla PostgreSQL 18
        env:
          PGHOST: 127.0.0.1
          PGPORT: "5432"
          PGUSER: postgres
          RUN_FAST: "0"
          RUN_CORE: "0"
          RUN_CORPUS: "1"
          RUN_AUX: "0"
          RUN_SLT: "0"
          RUN_FUZZ: "0"
          FAST_CORPUS_SHARDS: "1"
          FAST_CORPUS_ONLY: 40_copy
        run: bash tests/external/ci_diff.sh

  scoped-owners:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: miri
      - run: cargo miri setup
      - run: cargo miri test --lib --locked arena_owned_slices -- --test-threads=1
      - run: cargo miri test --lib --locked owned_ordered_source_tags -- --test-threads=1
