name: Protocol hang qualification

on:
  push:
    branches: [share-table-existence-and-rule-history]

concurrency:
  group: protocol-hang-${{ github.ref }}
  cancel-in-progress: true

jobs:
  view-metadata:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - name: Qualify view metadata and execution ownership
        run: |
          set -euo pipefail
          cargo test --lib --locked --release view_metadata_never_reserves_execution_locks_for_idle_or_active_transactions -- --nocapture | tee "$RUNNER_TEMP/view-metadata.log"
          grep -F 'test result: ok. 1 passed;' "$RUNNER_TEMP/view-metadata.log"
  protocol-hang:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: taiki-e/install-action@cargo-llvm-cov
      - name: Install fixture debugger
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gdb
      - uses: ./.github/actions/python-test-environment
        with:
          venv: venv
      - name: Expose PostgreSQL 18 psql
        run: |
          mkdir -p .ci-bin
          cat > .ci-bin/psql <<'SH'
          #!/bin/sh
          exec docker run --rm --network host -v "$PWD:$PWD" -w "$PWD" -v /tmp:/tmp mirror.gcr.io/library/postgres:18@sha256:74935e72241653ca55e0414067e6d8763aceb8a810eb51b452253ec3dcfc4336 psql "$@"
          SH
          chmod +x .ci-bin/psql
          .ci-bin/psql --version
      - name: Reproduce the instrumented protocol and durability suite
        env:
          CARGO_PROFILE_RELEASE_DEBUG: "1"
          POS3QL_VENV: ${{ github.workspace }}/venv
          POS3QL_PSQL: ${{ github.workspace }}/.ci-bin/psql
          POS3QL_PGBIN: /usr/lib/postgresql/18/bin
          COVERAGE_SHARD: run:proto,dur
          COVERAGE_LCOV: ${{ runner.temp }}/protocol.lcov
        run: sh tools/coverage.sh
