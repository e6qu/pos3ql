# Installed starter configuration. Review capacities and durable storage
# settings before exposing the PostgreSQL listener.
listen_addr = 127.0.0.1:5432
operations_listen_addr = 127.0.0.1:9187
operations_max_connections = 4
log_format = json
data_dir = /var/lib/pos3ql
max_connections = 2
query_workspace_slots = 1
conn_recv_buffer_bytes = 16KiB
conn_send_buffer_bytes = 16KiB
sql_arena_bytes = 4MiB
work_arena_bytes = 4MiB
max_prepared = 4
prepared_bytes = 4KiB
max_portals = 2
portal_bytes = 4KiB
portal_result_bytes = 16KiB
txn_rows = 64
max_ddl_per_transaction = 16
max_catalog_versions_per_object = 2
max_row_versions_per_row = 2
max_spill_generations_per_table = 2
max_savepoints_per_transaction = 2
max_deferred_constraints_per_transaction = 8
deferred_trigger_bytes = 16KiB
max_analyze_per_transaction = 4
max_prepared_transactions = 1
max_locks_per_transaction = 8
memtable_bytes = 1MiB
wal_bytes = 1MiB
wal_buffer_bytes = 256KiB
max_tables = 4
max_databases = 3
max_schemas = 4
max_sequences = 4
max_domains = 4
max_enums = 4
max_enum_labels_per_type = 8
max_composites = 4
max_roles = 4
max_role_memberships = 8
max_role_settings = 8
max_acl_entries = 16
max_column_acl_entries = 16
max_default_acl_entries = 8
max_parameter_acl_entries = 8
max_indexes = 4
max_extended_statistics = 4
max_brin_unsummarized_ranges_per_index = 2
max_stored_query_dependencies_per_object = 8
max_views = 4
max_materialized_views = 4
max_routines = 8
max_casts = 4
max_operators = 4
max_operator_families = 4
max_operator_classes = 4
max_triggers = 8
max_policies = 8
max_publications = 4
max_collations = 8
max_conversions = 8
max_text_search_objects = 32
max_event_triggers = 4
max_tablespaces = 4
max_comments = 8
max_large_objects = 8
large_object_pages = 16
max_large_object_descriptors = 4
max_rules = 8
max_extension_scripts = 4
extension_script_bytes = 16KiB
max_replication_slots = 2
max_subscriptions = 1
max_foreign_data_wrappers = 1
max_foreign_servers = 1
max_user_mappings = 2
max_foreign_sessions = 1
foreign_receive_bytes = 16KiB
foreign_send_bytes = 8KiB
subscription_receive_bytes = 16KiB
subscription_send_bytes = 8KiB
subscription_arena_bytes = 64KiB
subscription_relation_capacity = 4
max_cursors = 2
cursor_bytes = 16KiB
table_rows = 64
value_index_rows = 64
max_value_indexes = 4
block_cache_bytes = 0
disk_cache_bytes = 0
temporary_spill_bytes = 0
object_store = off
# For production durability, set object_store = on, configure the endpoint,
# bucket, prefix, region and TLS settings, then use an owner-only file:
# object_store_credentials_file = /etc/pos3ql/object-store.credentials
wal_upload_buffer_bytes = 256KiB
checkpoint_manifest_bytes = 16KiB
checkpoint_commit_batches = 16
max_backups = 2
checkpoint_live_blocks = 64
checkpoint_garbage_batch_objects = 16
checkpoint_delete_objects_per_beat = 4
checkpoint_merge_entries = 128
copy_line_bytes = 16KiB
collation_scratch_bytes = 4KiB
