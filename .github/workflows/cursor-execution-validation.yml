name: Cursor execution validation
on:
  push:
    branches: [cursor-fetch-execution]
concurrency:
  group: cursor-execution-validation
  cancel-in-progress: true
jobs:
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-library-tests-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-
      - name: Format proposal for local application
        run: |
          cargo fmt
          git diff --binary > "$RUNNER_TEMP/query-format.patch"
      - uses: actions/upload-artifact@v5
        with:
          name: query-format-${{ github.sha }}
          path: ${{ runner.temp }}/query-format.patch
      - run: cargo fmt --check
      - run: cargo test --test sqlstate_gate --locked
      - run: >-
          cargo test --lib --locked -- cursor_declaration_ cursor_owned_query_ cursor_query_memory_ query_row_cursor_ arena_retained_slices_ query_reads_held_ checkpoint_reads_held_
          cursor_read_statistics_ captured_resident_byte_scans_ retained_checkpoint_ store::sst::tests:: pg::respond::tests:: procedural_static_utility_ sql::parser::tests:: exec::projected::tests:: sequence::tests::
          --nocapture --test-threads=1
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test --lib --locked cursor -- --nocapture --test-threads=1
      - run: python3 tools/check-docs.py
      - run: bash tools/check-bugs.sh
  arena-aliasing:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: miri
      - run: cargo miri setup
      - run: cargo miri test --lib --locked -- arena_retained_slices_ cursor_owned_query_ --test-threads=1
  postgres-reference:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: mirror.gcr.io/library/postgres:18@sha256:74935e72241653ca55e0414067e6d8763aceb8a810eb51b452253ec3dcfc4336
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_INITDB_ARGS: "--lc-collate=C --lc-ctype=C --encoding=UTF8"
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/python-test-environment
        with:
          venv: venv
      - run: >-
          venv/bin/python tests/external/cursor_execution.py --host 127.0.0.1
          --port 5432 --user postgres --database postgres
          --output "$RUNNER_TEMP/cursor-reference.json"
      - name: Check declared null parameters over PostgreSQL wire protocol
        env:
          POS3QL_PORT: "5432"
          POS3QL_WIRE_PROBE: test_cursor_preserves_declared_null_parameter_after_first_hundred,test_nested_function_parameters_keep_their_declaration_over_wire_types
        run: python3 tests/external/wire_probe.py
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: cursor-reference-${{ github.sha }}
          path: ${{ runner.temp }}/cursor-reference.json
      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-query-output-binary-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-
      - run: cargo build --bin pos3ql --locked
      - name: Install PostgreSQL extension fixtures
        env:
          POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          docker exec "$POSTGRES_CONTAINER" mkdir -p /tmp/pos3ql-extensions
          docker cp tests/external/extensions/. "$POSTGRES_CONTAINER":/tmp/pos3ql-extensions/
      - name: Compare exact SQL behavior with PostgreSQL
        env:
          POS3QL_VENV: venv
          PGHOST: 127.0.0.1
          PGPORT: 5432
          PGUSER: postgres
          POS3QL_REFERENCE_EXTENSION_CONTROL_PATH: /tmp/pos3ql-extensions
          RUN_CORE: "0"
          RUN_CORPUS: "0"
          RUN_AUX: "1"
          AUXILIARY_PHASE: exact
          RUN_SLT: "0"
          RUN_FUZZ: "0"
        run: bash tests/external/ci_diff.sh "$PWD/target/debug/pos3ql" "$RUNNER_TEMP/query-exact"
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: query-exact-${{ github.sha }}
          path: ${{ runner.temp }}/query-exact/
