name: Checkpoint capture validation
on:
  push:
    branches: [resumable-checkpoint-capture]
concurrency:
  group: checkpoint-capture-${{ github.ref }}
  cancel-in-progress: true
jobs:
  readers:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets --features checkpoint-profile -- -D warnings
      - run: >-
          cargo test --lib --features checkpoint-profile -- checkpoint_reads_
          --test-threads=1 --nocapture
      - run: >-
          cargo test --lib --features checkpoint-profile -- store::sst::tests::
          checkpoint_maintenance_capacities_ maintenance_metadata_
          parallel_physical_ atomic_block_reads_ parallel_checkpoint_failures_
          --test-threads=1 --nocapture
