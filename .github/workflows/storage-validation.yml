name: Storage I/O validation

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: storage-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  storage-io:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Record checked source and toolchain
        run: |
          git rev-parse HEAD
          rustc --version --verbose
          cargo --version

      - name: Cache runner build dependencies
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-storage-validation-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Rebuild checked-out crate
        run: cargo clean -p pos3ql

      - name: Formatting and static guards
        id: static
        run: |
          cargo fmt --check
          git diff --check
          python3 tools/check-docs.py
          bash tools/check-bugs.sh
          bash tools/check-object-store-boundary.sh
          bash tools/check-ci-timeouts.sh

      - name: Concurrency, ownership, format and fencing regressions
        run: |
          set -eu
          for filter in \
            parallel_ \
            sliced_heap_capture_ \
            explicit_locking_mode_ \
            transaction_mode_requires_an_explicit_supported_selection \
            aligned_column_groups_ \
            typed_block_identity_ \
            writer_promotion_fences_old_and_delayed_publications \
            ambiguous_commit_batch_put_is_idempotently_adopted \
            one_protocol_flush_publishes_many_commits_as_one_immutable_batch \
            atomic_block_reads_ \
            prepared_transactions_commit_rollback_catalog_and_lock_contracts \
            statement_files_suspended_sql_releases_on_completion_error_cancel_and_rollback \
            dirty_full_roster_merges_across_bounded_checkpoint_beats \
            row_merge_reuses_unchanged_wide_pax_groups_across_beats \
            checkpoint_merge_capacity_exhausts_loudly_for_a_pinned_full_list \
            checkpoint_maintenance_capacities_are_exactly_budgeted \
            checkpoint_value_indexes_stream_wide_spilled_rows_across_recovery \
            checkpoint_value_source_resumes_inside_a_spilled_pax_block \
            checkpoint_value_index_writes_are_bounded_restartable_and_recoverable
          do
            cargo test --lib --release --locked "$filter" -- --test-threads=1
          done

      - name: Lint production code
        if: ${{ !cancelled() && steps.static.outcome == 'success' }}
        run: cargo clippy --lib --bins --features checkpoint-profile -- -D warnings

      - name: Build release executable
        if: ${{ !cancelled() && steps.static.outcome == 'success' }}
        id: build
        run: cargo build --release --locked

      - name: PostgreSQL 18 client for protocol checks
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          mkdir -p .ci-bin
          sed 's/^          //' > .ci-bin/psql <<'SH'
          #!/bin/sh
          exec docker run --rm --network host -v "$PWD:$PWD" -w "$PWD" -v /tmp:/tmp mirror.gcr.io/library/postgres:18@sha256:74935e72241653ca55e0414067e6d8763aceb8a810eb51b452253ec3dcfc4336 psql "$@"
          SH
          chmod +x .ci-bin/psql
          .ci-bin/psql --version

      - name: Python clients for protocol and durability checks
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        uses: ./.github/actions/python-test-environment

      - name: Raw protocol and object-store durability
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        env:
          POS3QL_VENV: ${{ github.workspace }}/venv
          POS3QL_PSQL: ${{ github.workspace }}/.ci-bin/psql
          POS3QL_BIN: ${{ github.workspace }}/target/release/pos3ql
          POS3QL_RUN_GROUPS: proto,dur
        run: |
          set -o pipefail
          bash tests/external/run.sh 2>&1 | tee "$RUNNER_TEMP/storage-protocol.log"
          grep -q '^PASS:' "$RUNNER_TEMP/storage-protocol.log"

      - name: Release install and actual failover
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          tools/package-release.sh "$RUNNER_TEMP/dist"
          tools/test-release-package.sh "$RUNNER_TEMP"/dist/pos3ql-*.tar.gz
