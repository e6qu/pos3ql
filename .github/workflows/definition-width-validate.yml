name: Definition width diagnosis
on:
  push:
    branches: [codex/table-definition-images]
concurrency:
  group: definition-width-diagnosis
  cancel-in-progress: true
jobs:
  isolated:
    name: isolated width (${{ matrix.revision }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - revision: baseline
            ref: a91caa4d5bf838fcc75edb8273094eddceeb5b07
          - revision: reader
            ref: 2312c423b16f244291d0371b12c293dbf20a5588
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ matrix.ref }}
      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-library-tests-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-
      - run: cargo clean -p pos3ql
      - run: cargo test --lib --release --locked --no-run
      - name: Run isolated wide routine and cursor regression
        run: /usr/bin/time -v timeout 360s cargo test --lib --release --locked remaining_execution_widths_are_allocation_free_and_survive_cold_recovery -- --nocapture --test-threads=1
