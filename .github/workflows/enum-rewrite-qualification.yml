name: Enum rewrite qualification

on:
  push:
    branches: [retain-enum-rewrite-sources]

concurrency:
  group: enum-rewrite-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: mirror.gcr.io/library/postgres:18@sha256:74935e72241653ca55e0414067e6d8763aceb8a810eb51b452253ec3dcfc4336
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_INITDB_ARGS: "--locale-provider=libc --lc-collate=C --lc-ctype=C --encoding=UTF8"
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-
      - run: cargo clean -p pos3ql
      - run: cargo clippy --all-targets --locked -- -D warnings
      - name: Enum rewrite ownership, failure cleanup, and recovery
        run: |
          set -o pipefail
          cargo test --lib --locked owned_enum_rewrite_sources -- --nocapture 2>&1 | tee "$RUNNER_TEMP/deferred-ownership.log"
      - name: Resolve allocation failure stack
        if: failure()
        run: |
          python3 - <<'PY'
          import collections, os, pathlib, re, subprocess
          log = pathlib.Path(os.environ['RUNNER_TEMP']) / 'deferred-ownership.log'
          if log.exists():
              frames = re.findall(r'(\S*/target/debug/deps/pos3ql-[0-9a-f]+)\(\+(0x[0-9a-f]+)\)', log.read_text())
              grouped = collections.defaultdict(list)
              for binary, address in frames:
                  grouped[binary].append(address)
              for binary, addresses in grouped.items():
                  subprocess.run(['addr2line', '-C', '-f', '-i', '-e', binary, *addresses], check=True)
          PY
      - name: Enum ordering and rollback
        run: |
          cargo test --lib --locked enum_float4_renumbering_and_new_value_safety -- --nocapture
          cargo test --lib --locked enums_order_and_enforce -- --nocapture
          cargo test --lib --locked enums_survive_restart -- --nocapture
      - name: MERGE selected bytes, partition moves, and failure cleanup
        run: |
          set -o pipefail
          cargo test --lib --locked merge -- --nocapture 2>&1 | tee "$RUNNER_TEMP/merge-ownership.log"
      - name: Resolve MERGE allocation failure stack
        if: failure()
        run: |
          python3 - <<'PY'
          import collections, os, pathlib, re, subprocess
          log = pathlib.Path(os.environ['RUNNER_TEMP']) / 'merge-ownership.log'
          if log.exists():
              frames = re.findall(r'(\S*/target/debug/deps/pos3ql-[0-9a-f]+)\(\+(0x[0-9a-f]+)\)', log.read_text())
              grouped = collections.defaultdict(list)
              for binary, address in frames:
                  grouped[binary].append(address)
              for binary, addresses in grouped.items():
                  subprocess.run(['addr2line', '-C', '-f', '-i', '-e', binary, *addresses], check=True)
          PY
      - name: Original heap and saved-file row owners
        run: cargo test --lib --locked owned_ordered -- --nocapture
      - name: Startup memory accounting
        run: cargo test --lib --locked startup -- --nocapture
      - uses: ./.github/actions/python-test-environment
        with:
          venv: target/external-venv
      - name: Enum transcript against vanilla PostgreSQL 18
        env:
          PGHOST: 127.0.0.1
          PGPORT: "5432"
          PGUSER: postgres
          RUN_FAST: "0"
          RUN_CORE: "0"
          RUN_CORPUS: "1"
          RUN_AUX: "0"
          RUN_SLT: "0"
          RUN_FUZZ: "0"
          FAST_CORPUS_SHARDS: "1"
          FAST_CORPUS_ONLY: 63_enums
        run: |
          bash tests/external/ci_diff.sh
          FAST_CORPUS_ONLY=58_merge bash tests/external/ci_diff.sh

  baseline-memory-control:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-
      - name: Use the merged executor with the same regression fixtures
        run: |
          git fetch --no-tags --depth=1 origin 40508af498942c4d7f7df1161414e611627f3fa7
          git show 40508af498942c4d7f7df1161414e611627f3fa7:src/sql/exec/mod.rs > src/sql/exec/mod.rs
      - run: cargo clean -p pos3ql
      - name: Baseline small-arena rejection and standard-arena retry
        run: cargo test --lib --locked merge_small_statement_arena_preserves_rows_and_allows_retry -- --nocapture
