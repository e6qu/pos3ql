name: Qualify pending table definitions
on:
  push:
    branches: [share-pending-table-definitions]
jobs:
  native:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-library-tests-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-
      - run: cargo clean -p pos3ql
      - name: Compile and lint all targets
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: Pending edits, rollback, accounting and recovery
        shell: bash
        run: |
          set -euo pipefail
          for selection in storage::table_edits::tests:: pending_table_definition_schema_rollback_preserves_constraint_comments pending_table_definition_comment_names_survive_journal_and_checkpoint_cold_recovery storage::table_definitions::tests:: table_definition_images_survive_publication_rollback_and_slot_reuse shared_table_creation table_retirement catalog_object_pools_follow_their_independent_startup_capacities prepared_transactions_survive_checkpoint_and_object_cold_recovery catalog_comments_survive_object_store_checkpoint_and_cold_recovery; do
            cargo test --lib --locked "$selection" -- --test-threads=1 --nocapture | tee "$RUNNER_TEMP/pending-edits-$selection.log"
            grep -Eq 'test result: ok\. [1-9][0-9]* passed' "$RUNNER_TEMP/pending-edits-$selection.log"
          done
      - name: Verify the direct storage regression against the original runtime
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin 91bb2ed206cc2281b81f884e971483dc28cfcfcc
          python3 - <<'PY'
          from pathlib import Path
          import os
          import subprocess

          old = "91bb2ed206cc2281b81f884e971483dc28cfcfcc"
          storage = Path("src/storage/mod.rs")
          definitions = Path("src/storage/table_definitions.rs")
          original_storage = storage.read_text()
          original_definitions = definitions.read_text()
          marker = "#[cfg(test)]\nmod tests {"
          assert original_definitions.count(marker) == 1
          old_definitions = subprocess.check_output(
              ["git", "show", f"{old}:src/storage/table_definitions.rs"], text=True
          )
          assert old_definitions.count(marker) == 1
          try:
              storage.write_text(subprocess.check_output(
                  ["git", "show", f"{old}:src/storage/mod.rs"], text=True
              ))
              definitions.write_text(
                  old_definitions.split(marker, 1)[0] + marker
                  + original_definitions.split(marker, 1)[1]
              )
              result = subprocess.run(
                  ["cargo", "test", "--lib", "--locked",
                   "pending_table_definition_storage_rollback_restores_constraint_schema",
                   "--", "--test-threads=1", "--nocapture"],
                  stdout=subprocess.PIPE, stderr=subprocess.STDOUT, text=True,
              )
              print(result.stdout, flush=True)
              Path(os.environ["RUNNER_TEMP"], "pending-table-old-runtime.log").write_text(result.stdout)
              assert result.returncode != 0, "original runtime unexpectedly passed the storage regression"
              assert "test result: FAILED. 0 passed; 1 failed" in result.stdout
              assert "constraint comment must return to the original schema at storage rollback" in result.stdout
          finally:
              storage.write_text(original_storage)
              definitions.write_text(original_definitions)
          subprocess.check_call(["git", "diff", "--exit-code", "--",
                                 "src/storage/mod.rs", "src/storage/table_definitions.rs"])
          print("Confirmed the storage regression on the old runtime; restored the qualified source.")
          PY
  postgresql:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: mirror.gcr.io/library/postgres:18@sha256:74935e72241653ca55e0414067e6d8763aceb8a810eb51b452253ec3dcfc4336
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_INITDB_ARGS: "--lc-collate=C --lc-ctype=C --encoding=UTF8"
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-
      - run: cargo clean -p pos3ql
      - uses: ./.github/actions/python-test-environment
        with:
          venv: target/external-venv
      - name: Compare comment names and rollback with actual PostgreSQL 18
        env:
          PGHOST: 127.0.0.1
          PGPORT: "5432"
          PGUSER: postgres
          P3_PORT: "15599"
          RUN_FAST: "0"
          RUN_CORE: "0"
          RUN_CORPUS: "1"
          RUN_AUX: "0"
          RUN_SLT: "0"
          RUN_FUZZ: "0"
          FAST_CORPUS_ONLY: "191_pending_table_definition_comments"
        run: bash tests/external/ci_diff.sh
