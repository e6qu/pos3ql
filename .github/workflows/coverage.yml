# Line coverage over both test layers. The in-process tests alone report 59%
# and put the wire protocol at 6%, which measures what is instrumented rather
# than what is tested: the corpora, the sqllogictest blocks and the psql golden
# suite all drive the server binary as a subprocess. tools/coverage.sh
# instruments that binary too, which is what takes the figure to ~80%.
#
# The external suite uses six workers whose paired workloads fit under five
# minutes. Coverage-producing runs retain separate lcov files for the merge
# gate; correctness-only crash workloads run after their paired trace. This
# preserves every workload while avoiding a long runner queue on the small
# hosted pool.
name: coverage
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shard:
    name: shard ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        include:
          # Coverage traces are generated separately even when they share a
          # worker. The following correctness-only workloads kill -9 their
          # servers and intentionally do not produce traces.
          # The coverage-producing lib pass and cold subscription regression
          # have independent outputs. Keeping them separate prevents setup
          # plus both workloads from consuming the five-minute job ceiling.
          - { name: lib, shards: "lib" }
          - { name: subscription, shards: "runtest:subscription" }
          - { name: sql-wire, shards: "sql run:proto,dur" }
          - { name: diff-torture-a, shards: "run:diff runtest:torture", torture_seed: 20260723 }
          - { name: spilldiff-torture-b, shards: "run:spilldiff runtest:torture", torture_seed: 20260725 }
          - { name: spill-overlay-ingest, shards: "runtest:overlay,ingest" }
          - { name: tls-correctness, shards: "runtest:tls" }
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: taiki-e/install-action@cargo-llvm-cov
      # The suites are zsh scripts (`#!/bin/zsh`), which the Linux runner does
      # not have by default; the differential workflow reaches them through a
      # bash-compatible CI wrapper instead and so never needed it.
      - name: Install PostgreSQL 18 (the differential oracle) and zsh
        run: |
          sudo sh -c 'echo "deb http://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" > /etc/apt/sources.list.d/pgdg.list'
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo gpg --dearmor -o /etc/apt/trusted.gpg.d/pgdg.gpg
          # Runner-image Microsoft feeds are unrelated to the PostgreSQL oracle and
          # occasionally reject apt metadata requests.
          sudo rm -f /etc/apt/sources.list.d/azure-cli.list /etc/apt/sources.list.d/microsoft-prod.list
          sudo apt-get update && sudo apt-get install -y postgresql-18 zsh
      # psycopg2-binary serves the sqllogictest replay; psycopg (v3) serves
      # the crash-torture and fuzz harnesses, which use its API directly.
      - name: Python venv for the differential harnesses
        run: python3 -m venv venv && ./venv/bin/pip install --quiet psycopg2-binary 'psycopg[binary]'
      - name: Measure
        env:
          POS3QL_VENV: ${{ github.workspace }}/venv
          POS3QL_PGBIN: /usr/lib/postgresql/18/bin
          POS3QL_PSQL: /usr/lib/postgresql/18/bin/psql
          COVERAGE_SHARDS: ${{ matrix.shards }}
          POS3QL_TORTURE_ROUNDS: ${{ matrix.torture_seed && 6 || '' }}
          POS3QL_TORTURE_SEED: ${{ matrix.torture_seed || '' }}
        run: |
          for shard in $COVERAGE_SHARDS; do
            trace_name=$(printf '%s' "$shard" | tr ':,' '--')
            COVERAGE_SHARD="$shard" \
            COVERAGE_LCOV="${{ github.workspace }}/coverage-${trace_name}.lcov" \
            sh tools/coverage.sh
          done
      - uses: actions/upload-artifact@v6
        with:
          name: lcov-${{ matrix.name }}
          path: coverage-*.lcov
          # The runtest:* (torture) shards write no tracefile by design; let
          # their upload find nothing rather than error.
          if-no-files-found: ignore

  merge-and-gate:
    needs: shard
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v8
        with:
          pattern: lcov-*
          merge-multiple: true
      - name: Union the shards and hold the floor
        run: python3 tools/coverage-merge.py 70 coverage-*.lcov
