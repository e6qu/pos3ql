name: Statement row validation

on:
  push:
    branches: [bind-statement-row-sources]

concurrency:
  group: statement-row-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: mirror.gcr.io/library/postgres:18@sha256:74935e72241653ca55e0414067e6d8763aceb8a810eb51b452253ec3dcfc4336
        env:
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - name: Format and record the tested source
        run: |
          cargo fmt
          git diff --binary -- src > "$RUNNER_TEMP/format.patch"
          git add src
          git rev-parse HEAD > "$RUNNER_TEMP/validation-head"
          validation_tree=$(git write-tree)
          printf '%s\n' "$validation_tree" > "$RUNNER_TEMP/validation-tree"
          git rev-parse "${validation_tree}:src" > "$RUNNER_TEMP/validation-source-tree"
      - name: Retain tested source provenance and formatting corrections
        uses: actions/upload-artifact@v6
        with:
          name: statement-row-format
          path: |
            ${{ runner.temp }}/format.patch
            ${{ runner.temp }}/validation-head
            ${{ runner.temp }}/validation-tree
            ${{ runner.temp }}/validation-source-tree
      - name: PostgreSQL row and definition reference
        env:
          POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          python3 - <<'PYTHON'
          import os, pathlib, subprocess
          sql = pathlib.Path("tests/external/differential_exact/13_row_definition_writes.sql").read_bytes()
          observed = subprocess.check_output([
              "docker", "exec", "-i", os.environ["POSTGRES_CONTAINER"], "psql", "-U", "postgres",
              "-d", "postgres", "-v", "ON_ERROR_STOP=1", "-X", "-qAt"
          ], input=sql).decode().splitlines()
          expected = ["1|first|8", "2|second|5", "3|third|9", "1|first|8", "2|second|12", "4|fourth|14"]
          assert observed == expected, observed
          print("PostgreSQL reference:", observed)
          sql = pathlib.Path("tests/external/differential_exact/14_statement_row_paths.sql").read_bytes()
          observed = subprocess.check_output([
              "docker", "exec", "-i", os.environ["POSTGRES_CONTAINER"], "psql", "-U", "postgres",
              "-d", "postgres", "-v", "ON_ERROR_STOP=1", "-X", "-qAt"
          ], input=sql).decode().splitlines()
          expected = ["1|7|20|10", "2|7|12|6", "1|7|20|10", "2|7|12|6", "1|20|10", "2|12|8", "2"]
          assert observed == expected, observed
          print("PostgreSQL statement paths:", observed)
          import select
          command = ["docker", "exec", "-i", os.environ["POSTGRES_CONTAINER"], "psql", "-U", "postgres", "-d", "postgres", "-X", "-qAt", "-v", "ON_ERROR_STOP=1"]
          subprocess.run(command, input="CREATE TABLE rewrite_reference_orders(id integer PRIMARY KEY); CREATE TABLE rewrite_reference_invoices(id integer); INSERT INTO rewrite_reference_orders VALUES(11),(12); INSERT INTO rewrite_reference_invoices VALUES(22);", text=True, check=True)
          reader = subprocess.Popen(command, stdin=subprocess.PIPE, stdout=subprocess.PIPE, stderr=subprocess.PIPE, text=True, bufsize=1)
          try:
              reader.stdin.write("BEGIN ISOLATION LEVEL REPEATABLE READ; SELECT 'ready' FROM rewrite_reference_invoices;\n")
              reader.stdin.flush()
              assert select.select([reader.stdout], [], [], 5)[0], "reference snapshot was not established"
              assert reader.stdout.readline().strip() == "ready"
              subprocess.run(command, input="DELETE FROM rewrite_reference_orders WHERE id = 12; ALTER TABLE rewrite_reference_orders ALTER COLUMN id TYPE bigint;", text=True, check=True, timeout=5)
              output, errors = reader.communicate("SELECT count(*) FROM rewrite_reference_orders; SELECT id FROM rewrite_reference_orders WHERE id = 11; SELECT id FROM rewrite_reference_invoices; COMMIT;\n", timeout=5)
              assert reader.returncode == 0, errors
              assert output.splitlines() == ["0", "22"], output
              print("PostgreSQL unrelated snapshot rewrite:", output.splitlines())
          finally:
              if reader.poll() is None:
                  reader.communicate("ROLLBACK;\n", timeout=5)
          PYTHON
      - name: All-target compilation and lint
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: Statement write and recovery regressions
        run: >-
          cargo test --release --lib --locked -- statement_row_ row_definition_ row_undo_source_ row_publication:: row_ownership::
          table_definition_ pending_table_definition type_edits:: query_definition_ copy_ replication_ pgoutput_ partition foreign_key large_object prepared_ heap_relocation::
          --test-threads=1
