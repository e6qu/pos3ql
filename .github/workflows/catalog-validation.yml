name: Catalog validation
on:
  push:
    branches: [catalog-lifetime-identifiers]
concurrency:
  group: catalog-validation-${{ github.ref }}
  cancel-in-progress: true
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: catalog-validation-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
      - name: Formatting
        run: cargo fmt --all -- --check
      - name: Python comparison regressions
        run: python3 -m unittest tools/tests/test_differential_diagnostics.py tools/tests/test_postgres_regress_diff.py
      - name: Compile all targets and lint
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: Protocol, temporary cleanup and catalog regressions
        run: cargo test --lib --locked -- protocol_completion session_discard drop_schema rewrite_rule catalog_lifetime table_definition_images --test-threads=1
