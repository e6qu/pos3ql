name: Constraint identity validation

on:
  push:
    branches: [constraint-lifetimes]

concurrency:
  group: constraint-identity-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: mirror.gcr.io/library/postgres:18@sha256:74935e72241653ca55e0414067e6d8763aceb8a810eb51b452253ec3dcfc4336
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_INITDB_ARGS: "--lc-collate=C --lc-ctype=C --encoding=UTF8"
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-
      - name: Check constraint lifetimes against PostgreSQL
        env:
          POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
        shell: bash
        run: |
          set -euo pipefail
          docker exec "$POSTGRES_CONTAINER" psql -U postgres -X -At -c 'SELECT version()'
          for specification in 28_constraint_identities:14 29_wide_domain_constraints:1 31_domain_constraint_declarations:8; do
            database=${specification%:*}
            expected=${specification##*:}
            docker exec "$POSTGRES_CONTAINER" createdb -U postgres "$database"
            docker exec -i "$POSTGRES_CONTAINER" psql -U postgres -d "$database" -X -Atq -v ON_ERROR_STOP=1 < "tests/external/differential_exact/$database.sql" > "$RUNNER_TEMP/$database.reference"
            test "$(wc -l < "$RUNNER_TEMP/$database.reference")" -eq "$expected"
            if grep -v '^t$' "$RUNNER_TEMP/$database.reference"; then
              exit 1
            fi
            cat "$RUNNER_TEMP/$database.reference"
          done
          docker exec "$POSTGRES_CONTAINER" createdb -U postgres domain_constraint_errors
          docker exec -i "$POSTGRES_CONTAINER" psql -U postgres -d domain_constraint_errors -X -Atq -v VERBOSITY=verbose < tests/external/differential_exact/30_domain_constraint_errors.sql > "$RUNNER_TEMP/domain-constraint-errors.reference" 2>&1
          sed -nE 's/^ERROR:  ([0-9A-Z]{5}):.*/\1/p' "$RUNNER_TEMP/domain-constraint-errors.reference" > "$RUNNER_TEMP/domain-constraint-states"
          printf '%s\n' 42P17 42601 42601 42P17 42P17 42601 42710 42710 > "$RUNNER_TEMP/expected-domain-constraint-states"
          diff -u "$RUNNER_TEMP/expected-domain-constraint-states" "$RUNNER_TEMP/domain-constraint-states"
      - name: Check template identifiers against PostgreSQL
        env:
          POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
        shell: bash
        run: |
          set -euo pipefail
          docker exec "$POSTGRES_CONTAINER" createdb -U postgres constraint_template
          docker exec "$POSTGRES_CONTAINER" psql -U postgres -d constraint_template -X -Atq -v ON_ERROR_STOP=1 -c 'CREATE DOMAIN code AS integer CONSTRAINT code_positive CHECK (VALUE > 0) CONSTRAINT code_nn NOT NULL; CREATE TABLE orders(id code PRIMARY KEY)'
          docker exec "$POSTGRES_CONTAINER" createdb -U postgres -T constraint_template constraint_copy
          inventory="SELECT conname, oid FROM pg_constraint WHERE conrelid = 'orders'::regclass OR contypid = 'code'::regtype ORDER BY conname; SELECT relname, oid FROM pg_class WHERE relname IN ('orders', 'orders_pkey') ORDER BY relname"
          for database in constraint_template constraint_copy; do
            docker exec "$POSTGRES_CONTAINER" psql -U postgres -d "$database" -X -Atq -v ON_ERROR_STOP=1 -c "$inventory" > "$RUNNER_TEMP/$database.reference"
            test "$(wc -l < "$RUNNER_TEMP/$database.reference")" -eq 6
          done
          diff -u "$RUNNER_TEMP/constraint_template.reference" "$RUNNER_TEMP/constraint_copy.reference"
      - name: Format and retain correction
        run: |
          cargo fmt
          git diff --binary > "$RUNNER_TEMP/formatting.patch"
      - name: Compile production constraint bindings
        shell: bash
        run: cargo check --lib --locked --message-format short 2>&1 | tee "$RUNNER_TEMP/constraint-check.log"
      - name: Verify constraint lifetimes and cold recovery
        shell: bash
        run: |
          python3 tools/test_command.py cargo test --lib --locked -- constraint_public_identifiers constraint_manifest_wide constraint_declaration_names constraint_identity_ --nocapture --test-threads=1 2>&1 | tee "$RUNNER_TEMP/constraint-lifetimes.log"
          grep -Eq 'test result: ok\. 11 passed; 0 failed; 0 ignored;' "$RUNNER_TEMP/constraint-lifetimes.log"
      - name: Verify related catalog and recovery behavior
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          python3 tools/test_command.py cargo test --lib --locked -- database_copy database_clone clone durable_format_documentation current_manifest_metadata --nocapture --test-threads=1 2>&1 | tee "$RUNNER_TEMP/related-catalogs.log"
          grep -Eq 'test result: ok\. [1-9][0-9]* passed; 0 failed; 0 ignored;' "$RUNNER_TEMP/related-catalogs.log"
      - name: Build every target and lint
        if: ${{ !cancelled() }}
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: Retain constraint and formatting evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: constraint-identities-${{ github.sha }}
          path: |
            ${{ runner.temp }}/formatting.patch
            ${{ runner.temp }}/*.reference
            ${{ runner.temp }}/constraint-check.log
            ${{ runner.temp }}/constraint-lifetimes.log
            ${{ runner.temp }}/related-catalogs.log
          if-no-files-found: error
