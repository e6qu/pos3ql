name: Query output validation
on:
  push:
    branches: [resumable-query-output]
concurrency:
  group: query-output-validation
  cancel-in-progress: true
jobs:
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-library-tests-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-
      - name: Format proposal for local application
        run: |
          cargo fmt
          git diff --binary > "$RUNNER_TEMP/query-format.patch"
      - uses: actions/upload-artifact@v5
        with:
          name: query-format-${{ github.sha }}
          path: ${{ runner.temp }}/query-format.patch
      - run: cargo fmt --check
      - run: >-
          cargo test --lib --locked -- cursor_declaration_ query_row_cursor_ arena_retained_slices_ query_reads_held_ checkpoint_reads_held_
          captured_resident_byte_scans_ retained_checkpoint_ store::sst::tests::
          --nocapture --test-threads=1
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test --lib --locked cursor -- --nocapture --test-threads=1
      - run: python3 tools/check-docs.py
      - run: bash tools/check-bugs.sh
  arena-aliasing:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: miri
      - run: cargo miri setup
      - run: cargo miri test --lib --locked arena_retained_slices_ -- --test-threads=1
  postgres-reference:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: mirror.gcr.io/library/postgres:18@sha256:74935e72241653ca55e0414067e6d8763aceb8a810eb51b452253ec3dcfc4336
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_INITDB_ARGS: "--lc-collate=C --lc-ctype=C --encoding=UTF8"
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/python-test-environment
        with:
          venv: venv
      - run: >-
          venv/bin/python tests/external/cursor_execution.py --host 127.0.0.1
          --port 5432 --user postgres --database postgres
          --output "$RUNNER_TEMP/cursor-reference.json"
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: cursor-reference-${{ github.sha }}
          path: ${{ runner.temp }}/cursor-reference.json
