name: Validate retained type definitions

on:
  push:
    branches: [retain-type-source-lifetimes]

permissions:
  contents: read

concurrency:
  group: type-readers-${{ github.ref }}
  cancel-in-progress: true

jobs:
  retained-definitions:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-type-readers-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-library-tests-
      - run: cargo clean -p pos3ql
      - name: Retained source definitions and exact startup reservations
        run: >-
          cargo test --lib --locked --
          storage::definition_pool::tests
          storage::type_definitions::tests
          storage::type_reference_moves::tests
          storage::tests::table_state_row_map_controls_are_charged_at_startup
          config::tests
          --test-threads=1
  image-memory-safety:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: miri
      - run: cargo miri setup
      - name: Image allocation, retention and destruction
        run: >-
          cargo miri test --lib --locked --
          storage::definition_pool::tests
          --test-threads=1
