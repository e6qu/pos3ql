name: Type lifecycle validation

on:
  push:
    branches: [finish-shared-type-lifecycle]

permissions:
  contents: read

concurrency:
  group: type-lifecycle-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: Linux-type-lifecycle-native-${{ hashFiles('Cargo.lock') }}
          restore-keys: Linux-cargo-
      - name: Rebuild checked-out crate
        run: cargo clean -p pos3ql
      - name: Formatting
        run: cargo fmt --all -- --check
      - name: Shared creation and account references
        run: cargo test --lib --locked -- shared_type_creation_ role_reference_lock catalog_creation_ named_type_ type_ddl_ owned --test-threads=1
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
  postgresql:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: mirror.gcr.io/library/postgres:18@sha256:74935e72241653ca55e0414067e6d8763aceb8a810eb51b452253ec3dcfc4336
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_INITDB_ARGS: "--lc-collate=C --lc-ctype=C --encoding=UTF8"
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: Linux-type-lifecycle-release-${{ hashFiles('Cargo.lock') }}
          restore-keys: Linux-cargo-
      - name: Rebuild checked-out crate
        run: cargo clean -p pos3ql
      - name: Build release executable
        run: cargo build --release --locked
      - uses: ./.github/actions/python-test-environment
        with:
          venv: target/external-venv
      - name: PostgreSQL ownership and type comparisons
        env:
          PGHOST: 127.0.0.1
          PGPORT: "5432"
          PGUSER: postgres
          P3_PORT: "15599"
          RUN_FAST: "0"
          RUN_CORE: "0"
          RUN_CORPUS: "0"
          RUN_AUX: "1"
          AUXILIARY_PHASE: types
          RUN_SLT: "0"
          RUN_FUZZ: "0"
        run: bash tests/external/ci_diff.sh "$PWD/target/release/pos3ql"
