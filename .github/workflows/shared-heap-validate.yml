name: Shared heap validation
on:
  push:
    branches: [codex/shared-heap-append]
concurrency:
  group: shared-heap-validation-${{ github.ref }}
  cancel-in-progress: true
jobs:
  aliasing:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: miri
      - run: cargo miri setup
      - run: cargo miri test --lib --locked shared_heap_append -- --test-threads=1

  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      RUST_MIN_STACK: 134217728
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-
      - run: cargo clean -p pos3ql
      - name: Format and retain patch
        run: |
          cargo fmt
          git diff --binary > "$RUNNER_TEMP/format.patch"
      - name: Check all targets
        run: |
          set -euo pipefail
          cargo check --all-targets --locked --message-format=json 2>&1 | tee "$RUNNER_TEMP/check.json"
      - run: cargo clippy --lib --bins --locked -- -D warnings
      - name: Ownership and reclamation regressions
        run: |
          set -euo pipefail
          for filter in shared_heap_append row_heap_ownership row_heap_generation visible_row_heap_ownership large_object; do
            cargo test --lib --locked "$filter" -- --test-threads=1 2>&1 | tee -a "$RUNNER_TEMP/tests.log"
          done
      - name: Documentation and architecture
        run: |
          python3 tools/check-docs.py
          bash tools/check-bugs.sh
          bash tools/check-object-store-boundary.sh
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: shared-heap-diagnostics
          path: |
            ${{ runner.temp }}/format.patch
            ${{ runner.temp }}/check.json
            ${{ runner.temp }}/tests.log
