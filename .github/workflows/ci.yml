name: CI

on:
  push:
    branches: [main]
  pull_request:

# One run per ref: a new push cancels the previous run; a feature branch runs
# once (via pull_request) rather than twice.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - name: Install zsh (for the no-op guard)
        run: |
          if ! command -v zsh >/dev/null 2>&1; then
            sudo apt-get install -y zsh
          fi

      - name: Cache Rust build
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      # Fail fast on any new silent accept-and-ignore of SQL/protocol
      # semantics. See tools/check-noops.sh and BUGS.md B-019/B-020/B-021.
      - name: No-op guard
        run: zsh tools/check-noops.sh

      # BUGS.md is not a backlog: every `open` bug must state why it is
      # intractable and must not read as a deferral. See tools/check-bugs.sh.
      - name: BUGS.md discipline guard
        run: zsh tools/check-bugs.sh

      - name: CI timeout guard
        run: zsh tools/check-ci-timeouts.sh

      - name: Set up Node (for the duplicate-code guard)
        uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false

      # Copy-paste gate: fails if source duplication exceeds the ratchet in
      # .jscpd.json. See tools/check-dups.sh.
      - name: Duplicate-code guard (jscpd)
        run: sh tools/check-dups.sh

      - name: Build
        run: cargo build --all-targets --locked

      - name: Formatting
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --lib --bins -- -D warnings

      - name: Test
        run: cargo test --locked -- --skip sim::storage::storage_vopr --skip sql::tests::external_order_and_distinct_runs_use_object_storage_after_cold_cache

  # Independent deterministic seeds run on four bounded workers. This retains
  # the endurance sweep while keeping the PR critical path near five minutes.
  storage-vopr:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - name: Cache Rust build
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-vopr-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-vopr-

      - name: Storage VOPR (parallel extended sweep)
        run: cargo test --locked --lib sim::storage::storage_vopr -- --nocapture
        env:
          POS3QL_STORAGE_VOPR_SEEDS: 16
          POS3QL_STORAGE_VOPR_STEPS: 300

  # These cold external-run phases own the fixed object-store workload.
  # Their independent workers retain every assertion without one serial test
  # consuming the ordinary suite's runtime budget.
  external-runs:
    strategy:
      fail-fast: false
      matrix:
        phase: [cold, recursive, lateral, set]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - name: Cache Rust build
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Cold external-run regression
        run: cargo test --locked --lib sql::tests::external_order_and_distinct_runs_use_object_storage_after_cold_cache
        env:
          POS3QL_EXTERNAL_RUN_PHASE: ${{ matrix.phase }}
