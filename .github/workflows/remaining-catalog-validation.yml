name: Remaining catalog validation
on:
  push:
    branches: [remaining-catalog-lifetimes]
concurrency:
  group: remaining-catalog-${{ github.ref }}
  cancel-in-progress: true
jobs:
  reference:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      reference:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: pos3ql-reference
        ports: [5432:5432]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGUSER: postgres
      PGDATABASE: postgres
      PGPASSWORD: pos3ql-reference
    steps:
      - uses: actions/checkout@v5
      - name: PostgreSQL identity reference and provenance
        env:
          REFERENCE_CONTAINER: ${{ job.services.reference.id }}
        run: |
          mkdir -p "$RUNNER_TEMP/catalog-reference"
          psql -XAt -v ON_ERROR_STOP=1 -c 'SELECT version()' > "$RUNNER_TEMP/catalog-reference/version.txt"
          docker inspect --format '{{.Image}}' "$REFERENCE_CONTAINER" > "$RUNNER_TEMP/catalog-reference/image.txt"
          sha256sum tests/external/differential/199_privilege_and_partition_lifetimes.sql tests/external/differential_exact/33_membership_grantors.sql > "$RUNNER_TEMP/catalog-reference/fixture.sha256"
          psql -XAt -v ON_ERROR_STOP=1 -f tests/external/differential/199_privilege_and_partition_lifetimes.sql > "$RUNNER_TEMP/catalog-reference/output.txt" 2> "$RUNNER_TEMP/catalog-reference/diagnostics.txt"
          psql -XAt -v ON_ERROR_STOP=0 -v VERBOSITY=verbose -f tests/external/differential_exact/33_membership_grantors.sql > "$RUNNER_TEMP/catalog-reference/grantor-output.txt" 2> "$RUNNER_TEMP/catalog-reference/grantor-diagnostics.txt"
          python3 - <<'PY'
          import os
          import re
          from pathlib import Path
          path = Path(os.environ['RUNNER_TEMP'], 'catalog-reference')
          output = path.joinpath('output.txt').read_text()
          observations = [line for line in output.splitlines() if line in ('t', 'f')]
          assert len(observations) == 30 and all(value == 't' for value in observations), output
          diagnostics = path.joinpath('grantor-diagnostics.txt').read_text()
          codes = re.findall(r'(ERROR|NOTICE|WARNING):\s+([0-9A-Z]{5}):', diagnostics)
          assert codes == [('ERROR', '0LP01'), ('ERROR', '0LP01'), ('NOTICE', '00000'), ('WARNING', '01000')], diagnostics
          assert [line for line in path.joinpath('grantor-output.txt').read_text().splitlines() if line in ('t', 'f')] == ['t', 't', 't']
          print(path.joinpath('version.txt').read_text().strip())
          print(f'PostgreSQL: {len(observations)} true observations')
          PY
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: remaining-catalog-postgresql-reference
          path: ${{ runner.temp }}/catalog-reference/
          if-no-files-found: error
  focused:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: remaining-catalog-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
      - name: Format
        run: |
          cargo fmt --all
          git diff --binary -- src > "$RUNNER_TEMP/catalog-format.patch"
          git diff --exit-code -- src
      - name: Retain runner formatting patch
        if: always() && matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v6
        with:
          name: remaining-catalog-format
          path: ${{ runner.temp }}/catalog-format.patch
          if-no-files-found: error
      - name: Compile and lint all targets
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: Catalog lifetime regressions
        run: python3 tools/test_command.py cargo test --lib --locked -- catalog_lifetime --test-threads=1
      - name: Journal and identity range regressions
        run: |
          python3 tools/test_command.py cargo test --lib --locked -- wal::tests:: --test-threads=1
          python3 tools/test_command.py cargo test --lib --locked -- catalog_constraint_identity_ranges_reject_overflow_and_keep_triggers_disjoint --test-threads=1
