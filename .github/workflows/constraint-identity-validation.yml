name: Constraint identity validation

on:
  push:
    branches: [constraint-lifetimes]

concurrency:
  group: constraint-identity-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: mirror.gcr.io/library/postgres:18@sha256:74935e72241653ca55e0414067e6d8763aceb8a810eb51b452253ec3dcfc4336
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_INITDB_ARGS: "--lc-collate=C --lc-ctype=C --encoding=UTF8"
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-
      - name: Check constraint lifetimes against PostgreSQL
        env:
          POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
        shell: bash
        run: |
          set -euo pipefail
          docker exec "$POSTGRES_CONTAINER" psql -U postgres -X -At -c 'SELECT version()'
          docker exec "$POSTGRES_CONTAINER" createdb -U postgres constraint_identities
          docker exec -i "$POSTGRES_CONTAINER" psql -U postgres -d constraint_identities -X -Atq -v ON_ERROR_STOP=1 < tests/external/differential_exact/28_constraint_identities.sql > "$RUNNER_TEMP/constraint-identities.reference"
          test "$(wc -l < "$RUNNER_TEMP/constraint-identities.reference")" -eq 12
          if grep -v '^t$' "$RUNNER_TEMP/constraint-identities.reference"; then
            exit 1
          fi
          cat "$RUNNER_TEMP/constraint-identities.reference"
      - name: Format and retain correction
        run: |
          cargo fmt
          git diff --binary > "$RUNNER_TEMP/formatting.patch"
      - name: Compile production constraint bindings
        shell: bash
        run: cargo check --lib --locked --message-format short 2>&1 | tee "$RUNNER_TEMP/constraint-check.log"
      - name: Verify constraint lifetimes and cold recovery
        shell: bash
        run: |
          python3 tools/test_command.py cargo test --lib --locked -- constraint_public_identifiers --nocapture --test-threads=1 2>&1 | tee "$RUNNER_TEMP/constraint-lifetimes.log"
          grep -Eq 'test result: ok\. 2 passed; 0 failed; 0 ignored;' "$RUNNER_TEMP/constraint-lifetimes.log"
      - name: Build every target and lint
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: Retain constraint and formatting evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: constraint-identities-${{ github.sha }}
          path: |
            ${{ runner.temp }}/formatting.patch
            ${{ runner.temp }}/constraint-identities.reference
            ${{ runner.temp }}/constraint-check.log
            ${{ runner.temp }}/constraint-lifetimes.log
          if-no-files-found: error
