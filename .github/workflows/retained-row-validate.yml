name: Retained row validation
on:
  push:
    branches: [codex/retained-row-walks]
concurrency:
  group: retained-row-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Prepare diagnostics and runner formatting patch
        run: |
          mkdir -p diagnostics
          cargo fmt
          git diff --binary > diagnostics/format.patch
      - name: Check all targets
        run: cargo check --all-targets --locked --message-format=json > diagnostics/check.json
      - name: Lint
        run: cargo clippy --lib --bins --locked -- -D warnings
      - name: Ownership and recovery regressions
        env:
          RUST_MIN_STACK: '134217728'
        run: |
          for filter in retained_row_walk row_read_ownership shared_row_publication; do
            cargo test --lib --locked "$filter" -- --test-threads=1 --nocapture
          done
      - name: Documentation and architecture guards
        run: |
          python3 tools/check-docs.py
          bash tools/check-bugs.sh
          bash tools/check-object-store-boundary.sh
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: retained-row-diagnostics
          path: diagnostics/
