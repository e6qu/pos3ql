name: Owned ordered row qualification
on:
  push:
    branches: [codex/owned-ordered-row-sources]
concurrency:
  group: owned-ordered-row-${{ github.ref }}
  cancel-in-progress: true
jobs:
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-
      - run: cargo clean -p pos3ql
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --lib --locked owned_ordered_ -- --nocapture
      - run: cargo test --lib --locked external_windows_spill_through_the_provider_neutral_block_store -- --nocapture
      - run: cargo test --lib --locked visible_row_heap_ownership -- --nocapture
      - run: cargo test --lib --locked owned_immutable_scan -- --nocapture
      - run: cargo test --lib --locked startup_bounded -- --nocapture
