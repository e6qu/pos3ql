name: Type publication validation

on:
  push:
    branches: [publish-type-moves-with-shared-owners]

permissions:
  contents: read

concurrency:
  group: type-publication-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mutex-model:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: miri
      - run: cargo miri setup --target aarch64-apple-darwin
      - name: Inline native mutex ownership
        run: >-
          cargo miri test --package pos3ql-mutex-model --lib --locked
          --target aarch64-apple-darwin -- mem::mutex::tests --test-threads=1

  validate:
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - name: Cache Rust build
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: macOS-type-publication-${{ hashFiles('Cargo.lock') }}
          restore-keys: macOS-type-publication-
      - name: Rebuild checked-out crate
        run: cargo clean -p pos3ql
      - name: Prepare formatting evidence
        run: |
          git rev-parse HEAD > "$RUNNER_TEMP/type-publication-head.txt"
          cargo fmt --all
          git diff --binary > "$RUNNER_TEMP/type-publication-format.patch"
      - name: Save formatting evidence
        uses: actions/upload-artifact@v6
        with:
          name: type-publication-format
          path: |
            ${{ runner.temp }}/type-publication-head.txt
            ${{ runner.temp }}/type-publication-format.patch
      - name: Type publication, retained readers and rollback
        run: >-
          cargo test --lib --locked -- mem::mutex::tests type_ domain_ enum_ composite_
          --test-threads=1 --nocapture
      - name: Clippy
        run: cargo clippy --lib --bins -- -D warnings
      - name: Repository guards
        run: |
          python3 tools/check-docs.py
          bash tools/check-bugs.sh
          bash tools/check-ci-timeouts.sh
