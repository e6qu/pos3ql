name: Invocation development checks

on:
  push:
    branches: [retain-procedural-invocations]

concurrency:
  group: invocation-development-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  formatting:
    uses: ./.github/workflows/formatting.yml

  ownership:
    needs: formatting
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-invocation-dependencies-${{ hashFiles('Cargo.lock') }}
      - name: Verify ownership manifest guards
        run: python3 -m unittest tools/tests/test_miri_ownership_manifest.py
      - name: Verify documentation and execution limits
        run: |
          python3 tools/check-docs.py
          bash tools/check-bugs.sh
          bash tools/check-ci-timeouts.sh
      - name: Compile library tests and exercise value ownership
        shell: bash
        run: |
          set -o pipefail
          cargo test --lib --locked --profile native-ci --jobs 1 -- \
            inplace_conversion_ cursor_owned_query_scratch_marks_ \
            exec::control_flow::ownership_tests \
            exec::control_flow::resumption_tests \
            exec::local_values::ownership_tests exec::numeric_loops::ownership_tests \
            exec::diagnostics::ownership_tests \
            exec::transition_rows::ownership_tests \
            exec::trigger_firing::ownership_tests \
            exec::write_completion::ownership_tests \
            completion_streaming_preserves_ \
            sequence::tests::retained_statement_position_ \
            lock::tests::advisory_ \
            procedural_parameter_staging_ procedural_source_ \
            procedural_locals_initialize_ control_capacity_is_admitted_ \
            output_control_admission_ diagnostic_directory_admission_ \
            diagnostic_payload_exhaustion_ nested_diagnostic_calls_ caught_diagnostics_ \
            unhandled_diagnostic_details_ \
            procedural_control_frames_ numeric_loop_frames_ custom_sqlstates_ \
            expired_procedural_blocks_ owned_set_results_ input_validation_ \
            uninitialized_domain_locals_ parameter_names_and_shadowed_ \
            transition_columns_keep_declared_types_ \
            trigger_parameters_remain_separate_ \
            mixed_writes_bind_each_row_trigger_ \
            write_completion_preserves_ \
            checked_array_inputs_in_row_triggers_ checked_before_trigger_inputs_ \
            retained_write_completion_keeps_ \
            retained_nested_write_completion_ \
            adjacent_triggers_observe_restored_ guc::ownership_tests datetime::test_clock:: \
            saved_output_scopes_reuse_ \
            nested_static_and_dynamic_writes_ routine_calls:: procedural_subtransactions:: \
            utility_descriptions_match_execution suspended_invocations:: \
            suspended_input_frames_ retained_region_transfers_ \
            shared_row_work:: dml_target_ pgoutput_ subscription_copy_transition_values_ \
            streamed_copy_trigger_handlers_keep_ statement_files_streamed_copy_ \
            copy_from_ binary_copy_ \
            --test-threads=1 --nocapture 2>&1 | tee "$RUNNER_TEMP/invocation-development.log"
      - name: Retain development diagnostics
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: invocation-development-${{ github.sha }}
          path: ${{ runner.temp }}/invocation-development.log
          if-no-files-found: error
          retention-days: 1

  miri:
    needs: formatting
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        group: [memory-sql, storage]
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: miri
      - run: cargo miri setup
      - name: Verify the ownership group
        run: bash tools/test-miri-ownership.sh "$RUNNER_TEMP/invocation-miri.log" "${{ matrix.group }}"
      - name: Retain ownership diagnostics
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: invocation-miri-${{ matrix.group }}-${{ github.sha }}
          path: |
            ${{ runner.temp }}/invocation-miri.log
            ${{ runner.temp }}/invocation-miri.log.manifest
          if-no-files-found: error
          retention-days: 1

  postgres-reference:
    needs: formatting
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    services:
      postgres:
        image: mirror.gcr.io/library/postgres:18@sha256:885953109528ad3dfc90362b1a6f50a78620b5315be19f187753d267e484dc5b
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_INITDB_ARGS: "--lc-collate=C --lc-ctype=C --encoding=UTF8"
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v5
      - name: Capture trigger input behavior from PostgreSQL
        env:
          POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir "$RUNNER_TEMP/trigger-input-reference"
          cd "$RUNNER_TEMP/trigger-input-reference"
          cp "$GITHUB_WORKSPACE/tests/external/differential/265_trigger_input_visibility.sql" fixture-265.sql
          cp "$GITHUB_WORKSPACE/tests/external/differential/266_nested_write_selection.sql" fixture-266.sql
          cp "$GITHUB_WORKSPACE/tests/external/differential/267_domain_local_initialization.sql" fixture-267.sql
          cp "$GITHUB_WORKSPACE/tests/external/differential/268_transition_column_types.sql" fixture-268.sql
          cp "$GITHUB_WORKSPACE/tests/external/differential/269_trigger_parameter_scope.sql" fixture-269.sql
          cp "$GITHUB_WORKSPACE/tests/external/differential/270_mixed_transition_tables.sql" fixture-270.sql
          cp "$GITHUB_WORKSPACE/tests/external/differential/271_trigger_setting_scope.sql" fixture-271.sql
          cp "$GITHUB_WORKSPACE/tests/external/differential/272_write_completion.sql" fixture-272.sql
          cp "$GITHUB_WORKSPACE/tests/external/differential/273_dynamic_write_completion.sql" fixture-273.sql
          cp "$GITHUB_WORKSPACE/tests/external/differential/274_procedural_lexical_boundaries.sql" fixture-274.sql
          cp "$GITHUB_WORKSPACE/tests/external/differential/275_dynamic_into_errors.sql" fixture-275.sql
          cp "$GITHUB_WORKSPACE/tests/external/differential/276_suspended_query_invocations.sql" fixture-276.sql
          git -C "$GITHUB_WORKSPACE" rev-parse HEAD > revision
          docker exec "$POSTGRES_CONTAINER" psql -U postgres -XAt -c 'SHOW server_version_num' > server-version.txt
          test "$(cat server-version.txt)" = 180006
          docker inspect --format '{{.Image}}' "$POSTGRES_CONTAINER" > image-id
          for fixture in 265 266 267 268 269 270 271 272 273 274 275 276; do
            docker exec -i -e PGOPTIONS='-c timezone=UTC -c standard_conforming_strings=on' \
              "$POSTGRES_CONTAINER" psql -U postgres -X -A -t -e -v ON_ERROR_STOP=1 \
              < "fixture-$fixture.sql" > "stdout-$fixture.txt" 2> "stderr-$fixture.txt"
          done
          python3 - <<'PY'
          from pathlib import Path
          for fixture, expected in [
              (265, '1|3|1|1|1|1|8193|2'),
              (266, '63|396|123|141|10|0|2|3|8193|3|4'),
              (267, '23502|23514|23502|23502|22004|0|7:true|2'),
              (268, '8|2|2|2|2|4|t'),
              (269, '6|2|2|2|t|t|15'),
              (270, '10|4|4|2|t|t|301'),
              (271, '10|5|t|t|t|t|t|outer|hex|warning|t'),
              (272, '16|8|6|2|t|3|17'),
              (273, '1|1|1|1|1|1|1|16385|1|1|t|integer'),
              (274, 'ok|branch|20|INTO, USING, THEN, LOOP|first,second|x|1'),
              (275, '0|3|0|1|1|42601/P0003/P0002|1|8193|t|integer'),
              (276, 'one,two,three|6|3|t|f|t|t|t|f|t|f'),
          ]:
              assert Path(f'stdout-{fixture}.txt').read_text().splitlines().count(expected) == 1
              assert not Path(f'stderr-{fixture}.txt').read_bytes()
              print(f'PostgreSQL 18.6 fixture {fixture}: {expected}')
          assert Path('stdout-272.txt').read_text().splitlines().count('2') == 1
          PY
          sha256sum fixture-*.sql revision server-version.txt image-id stdout-*.txt stderr-*.txt > SHA256SUMS
      - name: Retain PostgreSQL reference
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: trigger-input-reference-${{ github.sha }}
          path: ${{ runner.temp }}/trigger-input-reference/
          if-no-files-found: error
          retention-days: 1
