name: CI

on:
  push:
    branches: [main]
  pull_request:

# One run per ref: a new push cancels the previous run; a feature branch runs
# once (via pull_request) rather than twice.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - name: Install zsh (for the no-op guard)
        run: |
          if ! command -v zsh >/dev/null 2>&1; then
            sudo apt-get install -y zsh
          fi

      - name: Cache Rust build
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      # Fail fast on any new silent accept-and-ignore of SQL/protocol
      # semantics. See tools/check-noops.sh.
      - name: No-op guard
        run: zsh tools/check-noops.sh

      # BUGS.md is not a backlog: every `open` bug must state why it is
      # intractable and must not read as a deferral. See tools/check-bugs.sh.
      - name: BUGS.md discipline guard
        run: zsh tools/check-bugs.sh

      - name: External harness liveness guard
        run: sh tests/external/liveness_test.sh

      - name: CI timeout guard
        run: zsh tools/check-ci-timeouts.sh

      - name: Set up Node (for the duplicate-code guard)
        uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false

      # Copy-paste gate: fails if source duplication exceeds the ratchet in
      # .jscpd.json. See tools/check-dups.sh.
      - name: Duplicate-code guard (jscpd)
        run: sh tools/check-dups.sh

      - name: Build
        run: cargo build --all-targets --locked

      - name: Formatting
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --lib --bins -- -D warnings

      - name: Test
        run: >-
          cargo test --locked -- --skip sim::storage::storage_vopr
          --skip sql::tests::external_cold_order_and_distinct_runs_use_object_storage
          --skip sql::tests::external_recursive_runs_use_object_storage
          --skip sql::tests::external_lateral_runs_use_object_storage
          --skip sql::tests::external_set_runs_use_object_storage

      - name: Object-store gateway contract
        run: |
          set -eu
          python3 tests/external/object_store_gateway.py \
            --root "$RUNNER_TEMP/object-store-gateway" --port 19200 &
          gateway_pid=$!
          trap 'kill "$gateway_pid"' EXIT
          POS3QL_OBJECT_STORE_ENDPOINT=127.0.0.1:19200 \
          POS3QL_OBJECT_STORE_NAMESPACE=ci-contract \
          POS3QL_OBJECT_STORE_TLS=off \
          cargo test --locked --test object_store_it -- --test-threads=1

  # Split the fixed seed range across runners. The complete 16-seed sweep is
  # unchanged, but no one runner owns all four batches.
  storage-vopr:
    strategy:
      fail-fast: false
      matrix:
        seed0: [460259, 460263, 460267, 460271]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - name: Cache Rust build
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-vopr-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-vopr-

      - name: Storage VOPR (seed range ${{ matrix.seed0 }})
        run: cargo test --locked --lib sim::storage::storage_vopr -- --nocapture
        env:
          POS3QL_STORAGE_VOPR_SEED0: ${{ matrix.seed0 }}
          POS3QL_STORAGE_VOPR_SEEDS: 4
          POS3QL_STORAGE_VOPR_STEPS: 300

  # These cold external-run phases own the fixed object-store workload.
  # Their independent workers retain every assertion without one serial test
  # consuming the ordinary suite's runtime budget.
  external-runs:
    strategy:
      fail-fast: false
      matrix:
        include:
          - phase: cold
            test: external_cold_order_and_distinct_runs_use_object_storage
          - phase: recursive
            test: external_recursive_runs_use_object_storage
          - phase: lateral
            test: external_lateral_runs_use_object_storage
          - phase: set
            test: external_set_runs_use_object_storage
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - name: Cache Rust build
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Cold external-run regression
        run: cargo test --locked --lib sql::tests::${{ matrix.test }} -- --exact
