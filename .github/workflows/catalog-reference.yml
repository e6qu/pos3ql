name: Catalog reference

on:
  push:
    branches: [catalog-statement-visibility]

permissions:
  contents: read
  actions: read

jobs:
  reference:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    services:
      postgres:
        image: mirror.gcr.io/library/postgres:18@sha256:74935e72241653ca55e0414067e6d8763aceb8a810eb51b452253ec3dcfc4336
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_INITDB_ARGS: "--lc-collate=C --lc-ctype=C --encoding=UTF8"
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/python-test-environment
        with:
          venv: target/external-venv
      - name: Record actual PostgreSQL catalog visibility
        run: |
          mkdir -p "$RUNNER_TEMP/catalog-reference"
          target/external-venv/bin/python tests/external/catalog_snapshot_diff.py \
            --host 127.0.0.1 --port 5432 --user postgres --database postgres \
            --metadata-output "$RUNNER_TEMP/catalog-reference/metadata.json" \
            --output "$RUNNER_TEMP/catalog-reference/postgresql.json"
          git rev-parse HEAD > "$RUNNER_TEMP/catalog-reference/revision"
          docker inspect '${{ job.services.postgres.id }}' --format '{{.Image}}' > "$RUNNER_TEMP/catalog-reference/postgresql-image"
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: catalog-reference-${{ github.sha }}
          path: ${{ runner.temp }}/catalog-reference/
          if-no-files-found: error

  history:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-catalog-history-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-library-tests-
      - name: Rebuild and test catalog history ownership
        shell: bash
        run: |
          cargo clean -p pos3ql
          cargo test --lib --release --locked -- storage::catalog_history::tests sql::catalog_snapshot:: config::tests:: --nocapture --test-threads=1 \
            2>&1 | tee "$RUNNER_TEMP/catalog-history.log"
      - name: Check formatting and all-target lint
        run: |
          cargo fmt --all -- --check
          cargo clippy --all-targets --locked -- -D warnings
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: catalog-history-${{ github.sha }}
          path: ${{ runner.temp }}/catalog-history.log
          if-no-files-found: error

  history-ownership:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      MIRIFLAGS: -Zmiri-preemption-rate=1
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: miri
      - run: cargo miri setup
      - name: Interpret catalog history lifetimes and concurrent publication
        shell: bash
        run: |
          cargo miri test --lib --locked -- storage::catalog_history::tests sql::catalog_snapshot::tests --test-threads=1 \
            2>&1 | tee "$RUNNER_TEMP/catalog-history-miri.log"
          grep -F 'test result: ok. 14 passed; 0 failed; 0 ignored;' "$RUNNER_TEMP/catalog-history-miri.log"
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: catalog-history-miri-${{ github.sha }}
          path: ${{ runner.temp }}/catalog-history-miri.log
          if-no-files-found: error
