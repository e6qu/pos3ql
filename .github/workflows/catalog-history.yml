name: Catalog history

on:
  push:
    branches: [catalog-statement-visibility]
    paths:
      - src/**
      - Cargo.toml
      - Cargo.lock
      - build.rs
      - tools/generate-pg18-catalog-snapshot-keys.py
      - .github/workflows/catalog-history.yml

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  history:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-catalog-history-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-library-tests-
      - name: Rebuild and test catalog history ownership
        shell: bash
        run: |
          cargo clean -p pos3ql
          RUST_BACKTRACE=1 cargo test --lib --release --locked -- storage::catalog_history::tests sql::catalog_snapshot:: config::tests:: catalog_snapshot_ parameter_acl prepared_catalog_row acl_catalog_is_synchronized comment_catalog_ pending_table_definition_comment_ownership manifest_hex_decode current_manifest_metadata_rejects_missing_duplicate_and_old_fields manifest_catalog_duplicates_reject_before_replacement manifest_round_trip_preserves_reference_names current_manifest_cold_recovery_rejects_invalid_roots_without_publication promotion_retags_mutable_roots_even_when_etags_follow_content statistics_ownership --nocapture --test-threads=1 \
            2>&1 | tee "$RUNNER_TEMP/catalog-history.log"
      - name: Check formatting and all-target lint
        run: |
          cargo fmt --all -- --check
          cargo clippy --all-targets --locked -- -D warnings
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: catalog-history-${{ github.sha }}
          path: ${{ runner.temp }}/catalog-history.log
          if-no-files-found: error

  history-ownership:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      MIRIFLAGS: -Zmiri-preemption-rate=1
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: miri
      - run: cargo miri setup
      - name: Interpret catalog history lifetimes and concurrent publication
        shell: bash
        run: |
          cargo miri test --lib --locked -- storage::catalog_history::tests sql::catalog_snapshot::tests --test-threads=1 \
            2>&1 | tee "$RUNNER_TEMP/catalog-history-miri.log"
          grep -F 'test result: ok. 15 passed; 0 failed; 0 ignored;' "$RUNNER_TEMP/catalog-history-miri.log"
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: catalog-history-miri-${{ github.sha }}
          path: ${{ runner.temp }}/catalog-history-miri.log
          if-no-files-found: error
