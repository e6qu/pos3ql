name: Cursor execution validation
on:
  push:
    branches: [cursor-fetch-execution]
concurrency:
  group: cursor-execution-validation
  cancel-in-progress: true
jobs:
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-library-tests-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-
      - name: Format proposal for local application
        run: |
          cargo fmt
          git diff --binary > "$RUNNER_TEMP/query-format.patch"
      - uses: actions/upload-artifact@v5
        with:
          name: query-format-${{ github.sha }}
          path: ${{ runner.temp }}/query-format.patch
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test --test sqlstate_gate --locked
      - if: ${{ !cancelled() }}
        run: >-
          cargo test --lib --locked -- cursor_ arena_retained_slices_ query_reads_held_ checkpoint_reads_held_
          cursor_read_statistics_ captured_resident_byte_scans_ retained_checkpoint_ table_sources_survive_ subquery_execution_ store::sst::tests:: pg::respond::tests:: procedural_static_utility_ sql::parser::tests:: exec::projected::tests:: sequence::tests::
          configured_user_type_capacities_ owned_enum_rewrite_sources_ type_reference_moves_ user_type_schema_identity_ user_defined_aggregate_resolves_
          lateral_joins create_table_as_builds_and_populates moved_enum_identity_ postgresql_18_catalog_reference_family_ regcollation_values_ row_history_exhaustion_ row_history_reservation_ client_catalog_ mem::budget::tests config::tests
          --nocapture --test-threads=1
      - run: python3 tools/check-docs.py
      - run: bash tools/check-bugs.sh
      - name: Measure empty embedded engine reservations and peak memory
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          cargo build --example embedded-memory --locked
          mkdir -p "$RUNNER_TEMP/embedded-memory"
          git rev-parse HEAD > "$RUNNER_TEMP/embedded-memory/revision.txt"
          rustc -vV > "$RUNNER_TEMP/embedded-memory/compiler.txt"
          for mode in mvcc locking; do
            if [ "$mode" = mvcc ]; then history_slots=65536; else history_slots=0; fi
            for tables in 1 8 32; do
              target/debug/examples/embedded-memory --tables "$tables" --table-rows 8192 \
                --mode "$mode" --row-history-slots "$history_slots" \
                --data-dir "$RUNNER_TEMP/embedded-memory/$mode-$tables" \
                --budget-limit-bytes 2147483648 \
                2> "$RUNNER_TEMP/embedded-memory/$mode-$tables.budget.log" \
                | tee -a "$RUNNER_TEMP/embedded-memory/samples.jsonl"
            done
          done
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: embedded-memory-${{ github.sha }}
          path: |
            ${{ runner.temp }}/embedded-memory/*.jsonl
            ${{ runner.temp }}/embedded-memory/*.txt
            ${{ runner.temp }}/embedded-memory/*.budget.log
          if-no-files-found: error
  arena-aliasing:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: miri
      - run: cargo miri setup
      - run: cargo miri test --lib --locked -- arena_retained_slices_ cursor_owned_query_ subquery_execution_ --test-threads=1
  postgres-reference:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: mirror.gcr.io/library/postgres:18@sha256:74935e72241653ca55e0414067e6d8763aceb8a810eb51b452253ec3dcfc4336
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_INITDB_ARGS: "--lc-collate=C --lc-ctype=C --encoding=UTF8"
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/python-test-environment
        with:
          venv: venv
      - run: >-
          venv/bin/python tests/external/cursor_execution.py --host 127.0.0.1
          --port 5432 --user postgres --database postgres
          --output "$RUNNER_TEMP/cursor-reference.json"
      - name: Check declared null parameters over PostgreSQL wire protocol
        env:
          POS3QL_PORT: "5432"
          POS3QL_WIRE_PROBE: test_cursor_preserves_declared_null_parameter_after_first_hundred,test_nested_function_parameters_keep_their_declaration_over_wire_types,test_cursor_hold_commits_at_message_and_sync_boundaries,test_cursor_hold_copy_boundary_preserves_snapshot_and_abort_cleanup
        run: python3 tests/external/wire_probe.py
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: cursor-reference-${{ github.sha }}
          path: ${{ runner.temp }}/cursor-reference.json
      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-query-output-binary-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-
      - id: cursor_binary
        run: cargo build --bin pos3ql --locked
      - name: Install PostgreSQL extension fixtures
        env:
          POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          docker exec "$POSTGRES_CONTAINER" mkdir -p /tmp/pos3ql-extensions
          docker cp tests/external/extensions/. "$POSTGRES_CONTAINER":/tmp/pos3ql-extensions/
      - name: Compare exact SQL behavior with PostgreSQL
        env:
          POS3QL_VENV: venv
          PGHOST: 127.0.0.1
          PGPORT: 5432
          PGUSER: postgres
          POS3QL_REFERENCE_EXTENSION_CONTROL_PATH: /tmp/pos3ql-extensions
          RUN_CORE: "0"
          RUN_CORPUS: "0"
          RUN_AUX: "1"
          AUXILIARY_PHASE: exact
          RUN_SLT: "0"
          RUN_FUZZ: "0"
        run: bash tests/external/ci_diff.sh "$PWD/target/debug/pos3ql" "$RUNNER_TEMP/query-exact"
      - name: Compare cursor ownership with PostgreSQL under forced spilling
        if: ${{ !cancelled() && steps.cursor_binary.outcome == 'success' }}
        env:
          PGHOST: 127.0.0.1
          PGPORT: "5432"
          PGUSER: postgres
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/cursor-spill"
          mkdir -p "$evidence"
          python3 tests/external/s3_test_server.py --root "$evidence/objects" --port 19311 \
            --bucket cursor-validation --region test-region --access-key test-access \
            --secret-key test-secret --page-size 7 --latency-ms 1 \
            --audit-file "$evidence/object-audit.jsonl" > "$evidence/object-store.log" 2>&1 &
          object_pid=$!
          server_pid=
          trap 'if [[ -n "$server_pid" ]]; then kill "$server_pid" 2>/dev/null || true; fi; kill "$object_pid" 2>/dev/null || true' EXIT
          for _attempt in $(seq 1 50); do
            kill -0 "$object_pid"
            if nc -z 127.0.0.1 19311; then break; fi
            sleep 0.1
          done
          nc -z 127.0.0.1 19311
          cat tests/external/differential-capacities.conf > "$evidence/server.conf"
          cat >> "$evidence/server.conf" <<EOF
          listen_addr = 127.0.0.1:15598
          data_dir = $evidence/data
          object_store = on
          object_store_endpoint = 127.0.0.1:19311
          object_store_bucket = cursor-validation
          object_store_region = test-region
          object_store_access_key = test-access
          object_store_secret_key = test-secret
          object_store_prefix = cursors/
          wal_upload = on
          wal_upload_sync = on
          memtable_bytes = 256KiB
          work_arena_bytes = 192MiB
          max_tables = 64
          table_rows = 8192
          max_value_indexes = 64
          max_prepared_transactions = 8
          extension_control_path = $PWD/tests/external/extensions
          EOF
          target/debug/pos3ql --config "$evidence/server.conf" > "$evidence/server.log" 2>&1 &
          server_pid=$!
          for _attempt in $(seq 1 100); do
            kill -0 "$server_pid"
            if grep -q 'accepting connections$' "$evidence/server.log"; then break; fi
            sleep 0.1
          done
          grep -q 'accepting connections$' "$evidence/server.log"
          source=tests/external/differential_exact/38_cursor_query_ownership.sql
          for port in 5432 15598; do
            if [[ "$port" == 5432 ]]; then
              export PGOPTIONS='-c timezone=UTC -c extension_control_path=/tmp/pos3ql-extensions'
            else
              unset PGOPTIONS
            fi
            psql -h 127.0.0.1 -p "$port" -U postgres -d postgres -X -e -P pager=off \
                -v VERBOSITY=verbose -f "$source" > "$evidence/$port.stdout" 2> "$evidence/$port.stderr"
            python3 tests/external/differential_diagnostics.py --source "$source" \
              --stdout "$evidence/$port.stdout" --stderr "$evidence/$port.stderr" \
              --input-diagnostics verbose --diagnostics verbose > "$evidence/$port.normalized"
          done
          diff -u "$evidence/5432.normalized" "$evidence/15598.normalized"
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: cursor-spill-${{ github.sha }}
          path: ${{ runner.temp }}/cursor-spill/
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: query-exact-${{ github.sha }}
          path: ${{ runner.temp }}/query-exact/
