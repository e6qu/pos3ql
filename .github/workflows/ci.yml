name: CI

on:
  push:
    branches: [main]
  pull_request:

# One run per ref: a new push cancels the previous run; a feature branch runs
# once (via pull_request) rather than twice.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  reactor-ownership:
    name: native build (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: Linux arm64
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - platform: macOS arm64
            runner: macos-15
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Verify native compiler target
        env:
          EXPECTED_TARGET: ${{ matrix.target }}
        run: |
          test "$(rustc -vV | sed -n 's/^host: //p')" = "$EXPECTED_TARGET"

      - name: Cache Rust dependencies
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-${{ runner.arch }}-native-dependencies-${{ hashFiles('Cargo.lock') }}

      - name: Build all native targets
        run: cargo build --all-targets --locked --target '${{ matrix.target }}'

      - name: Socket readiness and allocation-free catalog publication
        run: >-
          cargo test --lib --locked --target '${{ matrix.target }}' -- io:: mem::mutex::tests type_ domain_ enum_ composite_ table_name catalog_creation_
          timezone_abbreviation_ fixed_default_abbreviations_ degree_special_and_random_math_
          maintenance_metadata_ cleanup_download_overlap_ object_store::http::tests::
          reader_scratch_is_synchronized_and_startup_bounded database_default_collation_is_bounded_
          --test-threads=1

      - name: Native allocation-free boundaries
        run: cargo clippy --all-targets --locked --target '${{ matrix.target }}' -- -D warnings

  macos-lock-ownership:
    name: macOS mutex ownership
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      MIRIFLAGS: -Zmiri-preemption-rate=1
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: miri
      - run: cargo miri setup --target aarch64-apple-darwin
      - name: Native mutex movement, contention and unwinding
        shell: bash
        run: |
          cargo miri test --package pos3ql-mutex-model --lib --locked \
            --target aarch64-apple-darwin -- mem::mutex::tests --test-threads=1 \
            2>&1 | tee "$RUNNER_TEMP/macos-mutex.log"
          grep -Eq 'test result: ok\. [1-9][0-9]* passed; 0 failed; 0 ignored;' \
            "$RUNNER_TEMP/macos-mutex.log"

  heap-aliasing:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: miri
      - run: cargo miri setup
      - name: Shared ownership and publication
        shell: bash
        run: |
          filters=(
            shared_heap_append
            owned_write_inputs_scoped_arena
            arena_owned_list_
            arena_retained_handles_
            arena_retained_slices_
            cursor_owned_query_
            sequence::tests::statement_replay_
            shared_heap_relocation_heap_
            row_lock_owners_heap_
            stable_row_slots_
            sliced_heap_cleanup_heap_
            statement_files_miri_
            index_file_owners_miri_
            enum_image_ownership_pool_
            storage::definition_pool::tests
            catalog_lifetime_schemas_share_bounded_images
            owned_ordered_source_tags
            stable_spill_generation_ranges
            stable_spill_generation_exhaustion
            type_publication_workspace_exact_startup_budget
            bound_type_origin_never_reuses_an_exhausted_identifier
            storage::catalog_sources::tests
            storage::catalog_history::tests
            sql::catalog_snapshot::tests
            catalog_snapshot_schema_cache_
            transaction_admission_does_not_wait_for_existing_queries_to_finish
            lock_wait_handoff_
            mem::mutex::tests
          )
          # All libtest filters share one interpreter startup.
          cargo miri test --lib --locked -- "${filters[@]}" --test-threads=1 --color=never --format=pretty \
            2>&1 | tee "$RUNNER_TEMP/miri-ownership.log"
          python3 - "$RUNNER_TEMP/miri-ownership.log" "${filters[@]}" <<'PY'
          import pathlib
          import re
          import sys

          log = pathlib.Path(sys.argv[1]).read_text()
          passed = re.findall(r"^test (\S+)(?: - should panic)? \.\.\. ok$", log, re.MULTILINE)
          results = re.findall(r"^test result: ok\. (\d+) passed; (\d+) failed; (\d+) ignored;", log, re.MULTILINE)
          if len(results) != 1 or results[0] != (str(len(passed)), "0", "0"):
              raise SystemExit("Miri did not report one complete passing test run")
          missing = [pattern for pattern in sys.argv[2:]
                     if not any(pattern in name for name in passed)]
          if missing:
              raise SystemExit("Miri filters matched no passing tests: " + ", ".join(missing))
          print(f"Miri ownership: {len(passed)} passed across {len(sys.argv) - 2} filters")
          PY

  release-package:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - name: Formatting
        run: |
          if ! cargo fmt --check; then
            cargo fmt
            git diff --binary > "$RUNNER_TEMP/formatting.patch"
            exit 1
          fi

      - name: Retain formatting correction
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: formatting-${{ github.sha }}
          path: ${{ runner.temp }}/formatting.patch
          if-no-files-found: ignore

      - name: Build release executable
        run: cargo build --release --locked

      - name: Build and install-test release archive
        run: |
          tools/package-release.sh "$RUNNER_TEMP/dist"
          tools/test-release-package.sh "$RUNNER_TEMP"/dist/pos3ql-*.tar.gz

      - name: Upload release-package evidence
        uses: actions/upload-artifact@v6
        with:
          name: release-package
          path: ${{ runner.temp }}/dist/

  build-and-check:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - name: Verify Linux amd64 compiler target
        run: |
          test "$(rustc -vV | sed -n 's/^host: //p')" = x86_64-unknown-linux-gnu

      - name: Cache Rust build
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      # `target` is cached by dependency lockfile, not source revision. Keep
      # dependencies warm but rebuild this checkout's crate every time.
      - name: Rebuild checked-out crate
        run: cargo clean -p pos3ql

      # Fail fast on any new silent accept-and-ignore of SQL/protocol
      # semantics. See tools/check-noops.sh.
      - name: No-op guard
        run: bash tools/check-noops.sh

      # BUGS.md is not a backlog: every `open` bug must state why it is
      # intractable and must not read as a deferral. See tools/check-bugs.sh.
      - name: BUGS.md discipline guard
        run: bash tools/check-bugs.sh

      - name: Documentation links
        run: python3 tools/check-docs.py

      - name: Object-store architecture guard
        run: bash tools/check-object-store-boundary.sh

      - name: Vendored corpus integrity guard
        run: bash tools/check-vendor.sh

      - name: External harness liveness guard
        run: sh tests/external/liveness_test.sh

      - name: CI timeout guard
        run: bash tools/check-ci-timeouts.sh

      - name: Tool guard tests
        run: >-
          python3 -m unittest tools/tests/test_coverage_merge.py
          tools/tests/test_coverage_script.py
          tools/tests/test_check_dups.py
          tools/tests/test_postgres_regress_diff.py
          tools/tests/test_differential_diagnostics.py
          tools/tests/test_s3_audit.py
          tools/tests/test_benchmark.py
          tools/tests/test_benchmark_environment.py
          tools/tests/test_benchmark_matrix_report.py
          tools/tests/test_benchmark_postgresql.py
          tools/tests/test_benchmark_report.py
          tools/tests/test_run_performance.py
          tools/tests/test_test_ports.py
          tools/tests/test_test_command.py
          tools/tests/test_python_env.py

      - name: Duplicate-code guard
        run: sh tools/check-dups.sh

      - name: Build
        run: cargo build --all-targets --locked

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Checkpoint and catalog regression diagnostics
        run: >-
          cargo test --lib --locked --
          sql::tests::catalog_snapshot_view_columns_survive_table_column_rename
          maintenance_metadata_ --nocapture --test-threads=1

      - name: Integration guards
        run: cargo test --locked --test no_noops --test sqlstate_gate

      - name: S3 profile-v1 contract
        run: |
          set -eu
          python3 tests/external/s3_test_server.py \
            --root "$RUNNER_TEMP/s3-profile-v1" --port 19200 \
            --bucket pos3ql-contract --region test-region \
            --access-key pos3ql-contract --secret-key pos3ql-contract-secret \
            --page-size 7 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          for attempt in $(seq 1 50); do
            if curl --silent --output /dev/null http://127.0.0.1:19200/; then
              break
            fi
            if [ "$attempt" = 50 ]; then
              exit 1
            fi
            sleep 0.1
          done
          POS3QL_OBJECT_STORE_ENDPOINT=127.0.0.1:19200 \
          POS3QL_OBJECT_STORE_BUCKET=pos3ql-contract \
          POS3QL_OBJECT_STORE_REGION=test-region \
          POS3QL_OBJECT_STORE_ACCESS_KEY=pos3ql-contract \
          POS3QL_OBJECT_STORE_SECRET_KEY=pos3ql-contract-secret \
          POS3QL_OBJECT_STORE_TLS=off \
          cargo test --locked --test object_store_it -- --test-threads=1

  library-tests:
    name: library tests (${{ matrix.partition }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        partition: [0-of-8, 1-of-8, 2-of-8, 3-of-8, 4-of-8, 5-of-8, 6-of-8, 7-of-8]
    steps:
      - uses: actions/checkout@v5

      - name: Cache Rust build
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-library-tests-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Rebuild checked-out crate
        run: cargo clean -p pos3ql

      - name: Test library shard
        run: sh tools/test-lib-shard.sh '${{ matrix.partition }}'

  wide-execution:
    name: wide execution and cold recovery
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - name: Cache Rust build
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-library-tests-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Rebuild checked-out crate
        run: cargo clean -p pos3ql

      # This production-width fixture also runs in instrumented release
      # coverage; its unoptimized replay exceeds the shared debug job budget.
      - name: Wide mutable routine replay, cursor positions, and cold recovery
        run: >-
          cargo test --lib --release --locked
          sql::tests::remaining_execution_widths_are_allocation_free_and_survive_cold_recovery
          -- --exact --test-threads=1

  object-store-compatibility:
    name: object-store (${{ matrix.implementation }})
    strategy:
      fail-fast: false
      matrix:
        include:
          # Image provenance: release 4.46, published 2026-09-08 by the
          # SeaweedFS release workflow; GHCR serves the same multi-platform digest.
          - implementation: seaweedfs
            port: 19300
            image: ghcr.io/chrislusf/seaweedfs@sha256:08d516132314207d10c8e37cbffc1f32b147d870169688734cc61c6231625b62
          # Image provenance: MinIO RELEASE.2025-10-15T17-29-55Z, rebuilt by
          # alpine-docker/minio revision 951e146 and pinned to its verified
          # multi-platform digest. The release includes the conditional-PUT fix.
          - implementation: minio
            port: 19400
            image: alpine/minio@sha256:cf23643a6cf9ce159c57643ceb88279e431262282428c9e0bf3a7ef1a97e84b4
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - name: Cache Rust build
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-object-store-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Start independent S3-compatible implementation
        env:
          IMPLEMENTATION: ${{ matrix.implementation }}
          IMAGE: ${{ matrix.image }}
          PORT: ${{ matrix.port }}
        run: |
          set -eu
          if [ "$IMPLEMENTATION" = seaweedfs ]; then
            docker run -d --name object-store -p "$PORT:8333" \
              -e AWS_ACCESS_KEY_ID=pos3ql-contract \
              -e AWS_SECRET_ACCESS_KEY=pos3ql-contract-secret \
              -e S3_BUCKET=pos3ql-contract "$IMAGE" mini -dir=/data
          else
            docker run -d --name object-store --user 0:0 -p "$PORT:9000" \
              -e MINIO_ROOT_USER=pos3ql-contract \
              -e MINIO_ROOT_PASSWORD=pos3ql-contract-secret \
              "$IMAGE" server /data
          fi
          for attempt in $(seq 1 100); do
            if curl --silent --output /dev/null "http://127.0.0.1:$PORT/"; then
              break
            fi
            if [ "$attempt" = 100 ]; then
              docker logs object-store
              exit 1
            fi
            sleep 0.2
          done
          if [ "$IMPLEMENTATION" = minio ]; then
            curl --fail --silent --show-error \
              --aws-sigv4 "aws:amz:us-east-1:s3" \
              --user pos3ql-contract:pos3ql-contract-secret \
              --request PUT "http://127.0.0.1:$PORT/pos3ql-contract"
          fi

      - name: Wait for the shared bucket contract
        env:
          POS3QL_OBJECT_STORE_ENDPOINT: 127.0.0.1:${{ matrix.port }}
          POS3QL_OBJECT_STORE_BUCKET: pos3ql-contract
          POS3QL_OBJECT_STORE_REGION: us-east-1
          POS3QL_OBJECT_STORE_ACCESS_KEY: pos3ql-contract
          POS3QL_OBJECT_STORE_SECRET_KEY: pos3ql-contract-secret
          POS3QL_OBJECT_STORE_TLS: off
        run: |
          set -eu
          for attempt in $(seq 1 50); do
            if cargo test --quiet --locked --test object_store_it \
              bucket_exists_and_is_listable -- --exact \
              >"$RUNNER_TEMP/object-store-readiness.log" 2>&1; then
              exit 0
            fi
            if [ "$attempt" = 50 ]; then
              cat "$RUNNER_TEMP/object-store-readiness.log"
              docker logs object-store
              exit 1
            fi
            sleep 0.2
          done

      - name: Run the shared compatibility qualification
        env:
          POS3QL_OBJECT_STORE_ENDPOINT: 127.0.0.1:${{ matrix.port }}
          POS3QL_OBJECT_STORE_BUCKET: pos3ql-contract
          POS3QL_OBJECT_STORE_REGION: us-east-1
          POS3QL_OBJECT_STORE_ACCESS_KEY: pos3ql-contract
          POS3QL_OBJECT_STORE_SECRET_KEY: pos3ql-contract-secret
          POS3QL_OBJECT_STORE_TLS: off
        run: cargo test --locked --test object_store_it -- --test-threads=1

      - name: Endpoint diagnostics
        if: failure()
        run: docker logs object-store

  performance-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - name: Cache release build
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-performance-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Rebuild checked-out crate
        run: cargo clean -p pos3ql

      # This gates result-schema integrity, fixed-memory occupancy, cold
      # object reads, and concurrent-commit request amplification. Absolute
      # timing remains an artifact, not a flaky hosted-runner threshold.
      - name: Cache and group-commit benchmark smoke
        run: tools/run-performance.sh smoke "$RUNNER_TEMP/performance-smoke"

      - name: Upload raw performance evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: performance-smoke
          path: ${{ runner.temp }}/performance-smoke

  # One fixed range per worker preserves the complete 16-seed sweep within
  # the five-minute job contract, including a cold rebuild.
  storage-vopr:
    name: storage-vopr (${{ matrix.first }}-${{ matrix.last }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { first: 460259, last: 460262 }
          - { first: 460263, last: 460266 }
          - { first: 460267, last: 460270 }
          - { first: 460271, last: 460274 }
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5

      - name: Cache Rust build
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-vopr-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-vopr-

      # The cache may contain another commit's application artifacts.
      - name: Rebuild checked-out crate
        run: cargo clean -p pos3ql

      - name: Storage VOPR
        run: POS3QL_STORAGE_VOPR_SEED0=${{ matrix.first }} cargo test --locked --lib sim::storage::storage_vopr -- --nocapture
        env:
          POS3QL_STORAGE_VOPR_SEEDS: 4
          POS3QL_STORAGE_VOPR_STEPS: 300

  # Two cold object-store phases fit comfortably within five minutes. Pairing
  # them preserves every assertion while halving queue pressure on the small
  # runner pool.
  external-runs:
    name: external-runs (${{ matrix.phase }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - phase: cold-recursive
            tests: >-
              external_cold_order_and_distinct_runs_use_object_storage
              external_recursive_runs_use_object_storage
          - phase: lateral-set
            tests: >-
              external_lateral_runs_use_object_storage
              external_set_runs_use_object_storage
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5

      - name: Cache Rust build
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      # The cache may contain another commit's application artifacts.
      - name: Rebuild checked-out crate
        run: cargo clean -p pos3ql

      - name: Cold external-run regression
        run: |
          for test in ${{ matrix.tests }}; do
            cargo test --locked --lib sql::tests::$test -- --exact
          done
