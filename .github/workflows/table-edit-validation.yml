name: Table edit validation

on:
  push:
    branches: [bind-table-edit-sources]

concurrency:
  group: table-edit-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: mirror.gcr.io/library/postgres:18@sha256:74935e72241653ca55e0414067e6d8763aceb8a810eb51b452253ec3dcfc4336
        env:
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - name: Format and record the tested source
        run: |
          cargo fmt
          git diff --binary -- src > "$RUNNER_TEMP/format.patch"
          git add src
          git rev-parse HEAD > "$RUNNER_TEMP/validation-head"
          validation_tree=$(git write-tree)
          printf '%s\n' "$validation_tree" > "$RUNNER_TEMP/validation-tree"
          git rev-parse "${validation_tree}:src" > "$RUNNER_TEMP/validation-source-tree"
      - name: Retain tested source provenance and formatting corrections
        uses: actions/upload-artifact@v6
        with:
          name: table-edit-format
          path: |
            ${{ runner.temp }}/format.patch
            ${{ runner.temp }}/validation-head
            ${{ runner.temp }}/validation-tree
            ${{ runner.temp }}/validation-source-tree
      - name: PostgreSQL reference behavior
        env:
          POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          python3 - <<'PYTHON'
          import os, pathlib, subprocess
          fixtures = {
              "10_private_index_bindings.sql": ["payload|7", "10|payload|7", "payload|7", "1"],
              "11_index_schema_names.sql": ["key comment", "key comment", "key comment", "key comment", "fresh", "key comment", "1"],
              "12_table_definition_undo.sql": ["1|order|7", "11|original", "11|original", "1|ready|kept"],
          }
          for filename, expected in fixtures.items():
              sql = (pathlib.Path("tests/external/differential_exact") / filename).read_bytes()
              observed = subprocess.check_output([
                  "docker", "exec", "-i", os.environ["POSTGRES_CONTAINER"],
                  "psql", "-U", "postgres", "-d", "postgres", "-v", "ON_ERROR_STOP=1", "-X", "-qAt"
              ], input=sql).decode().splitlines()
              assert observed == expected, (filename, observed)
              print("PostgreSQL reference:", filename, observed)
          import re, select
          command = ["docker", "exec", "-i", os.environ["POSTGRES_CONTAINER"], "psql", "-U", "postgres", "-d", "postgres", "-X", "-qAt", "-v", "ON_ERROR_STOP=1", "-v", "VERBOSITY=sqlstate"]
          subprocess.run(command, input="CREATE TABLE namespace_reference_source(id integer); CREATE TABLE namespace_reference_other(id integer); CREATE INDEX namespace_reference_old ON namespace_reference_source(id); CREATE INDEX namespace_reference_competitor ON namespace_reference_other(id);", text=True, check=True)
          for label, statement, requests in [
              ("rename", "ALTER INDEX namespace_reference_old RENAME TO namespace_reference_new", [
                  ("rename_old", "ALTER INDEX namespace_reference_competitor RENAME TO namespace_reference_old"),
                  ("rename_new", "ALTER INDEX namespace_reference_competitor RENAME TO namespace_reference_new"),
                  ("create_old", "CREATE INDEX namespace_reference_old ON namespace_reference_other(id)"),
                  ("create_new", "CREATE INDEX namespace_reference_new ON namespace_reference_other(id)"),
              ]),
              ("drop", "DROP INDEX namespace_reference_old", [
                  ("rename_old", "ALTER INDEX namespace_reference_competitor RENAME TO namespace_reference_old"),
                  ("create_old", "CREATE INDEX namespace_reference_old ON namespace_reference_other(id)"),
              ]),
          ]:
              owner = subprocess.Popen(command, stdin=subprocess.PIPE, stdout=subprocess.PIPE, stderr=subprocess.PIPE, text=True, bufsize=1)
              try:
                  owner.stdin.write(f"BEGIN; {statement}; SELECT 'ready';\n")
                  owner.stdin.flush()
                  assert select.select([owner.stdout], [], [], 5)[0], label
                  assert owner.stdout.readline().strip() == "ready", label
                  observed = {}
                  for request, query in requests:
                      attempt = subprocess.run(command + ["-c", "SET lock_timeout = '50ms'; " + query], capture_output=True, text=True, timeout=5)
                      matched = re.search(r"ERROR:\s+([A-Z0-9]{5})", attempt.stderr)
                      observed[request] = matched.group(1) if matched else f"exit={attempt.returncode}:{attempt.stdout}:{attempt.stderr}"
                  print("PostgreSQL namespace reference:", label, observed, flush=True)
                  expected = {
                      "rename": {"rename_old": "42P07", "rename_new": "55P03", "create_old": "42P07", "create_new": "55P03"},
                      "drop": {"rename_old": "42P07", "create_old": "42P07"},
                  }
                  assert observed == expected[label], (label, observed)
              finally:
                  if owner.poll() is None:
                      owner.communicate("ROLLBACK;\n", timeout=5)
          PYTHON
      - name: All-target compilation and lint
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: Table and index lifecycle regressions
        run: >-
          cargo test --release --lib --locked -- private_index_ table_name pending_table_definition table_definition_ query_definition_
          index_catalog index_slot index_rename metadata_database_copy type_reference_moves type_edits wal:: checkpoint::
          --test-threads=1
