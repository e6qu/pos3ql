# pos3ql development configuration.
# Every limit is fixed at startup; the server reserves exactly the memory
# this file implies and never allocates beyond it. Sizes accept KiB/MiB/GiB.

listen_addr = 127.0.0.1:5433
data_dir = ./data

max_connections = 64
max_prepared_transactions = 8
max_locks_per_transaction = 64
conn_recv_buffer_bytes = 64KiB   # bounds the largest inbound wire message
conn_send_buffer_bytes = 64KiB
sql_arena_bytes = 4MiB           # shared statement parse/plan arena
max_prepared = 64
prepared_bytes = 8KiB            # query text plus declared parameter metadata per statement
max_portals = 4
portal_bytes = 4KiB              # Bind formats, lengths, and values per portal

# Object storage is the durable home of a production database. This quick-start
# configuration stays local-only; change this to `on` after creating the bucket
# and replacing the development endpoint and credentials below.
object_store = off
object_store_endpoint = 127.0.0.1:9000
object_store_bucket = pos3ql
object_store_prefix = dev/
object_store_region = us-east-1
object_store_access_key = pos3ql-dev
object_store_secret_key = replace-this-development-secret
object_store_addressing = path
object_store_tls = off

memtable_bytes = 64MiB           # LSM write buffer before flush to object storage
wal_bytes = 64MiB                # preallocated journal file (disk)
wal_buffer_bytes = 1MiB          # per-transaction WAL stage (one per connection)
checkpoint_manifest_bytes = 4MiB # complete object-storage catalog checkpoint
checkpoint_commit_batches = 4096 # immutable batches one cold start may replay
checkpoint_live_blocks = 65536   # live content-addressed blocks retained by GC
checkpoint_garbage_batch_objects = 4096 # obsolete object identities staged by one GC scan
checkpoint_delete_objects_per_beat = 16 # DELETE requests issued per maintenance beat
checkpoint_merge_entries = 524288 # row versions retained by one SST-pair merge
max_ddl_per_transaction = 256    # atomic catalog changes retained for rollback
max_row_versions_per_row = 8     # command and snapshot images retained per row
max_spill_generations_per_table = 8 # immutable SST fan-out before merge pressure
max_savepoints_per_transaction = 16
max_deferred_constraints_per_transaction = 128 # each deferred metadata pool
deferred_trigger_bytes = 256KiB  # retained OLD/NEW row images
max_analyze_per_transaction = 64 # ordinary and extended statistics changes
max_tables = 32
max_databases = 32               # includes template1, template0, and postgres
max_schemas = 64                 # database-local schemas; publication slots are u8
max_sequences = 256              # sequence relations across all databases
max_domains = 64                 # domain definitions across all databases
max_enums = 64                   # enum definitions across all databases
max_composites = 64              # named composite definitions across all databases
max_roles = 64                   # includes the postgres bootstrap role
max_role_memberships = 256
max_role_settings = 128          # ALTER ROLE/DATABASE setting rows
max_acl_entries = 512            # includes three built-in public-schema grants
max_column_acl_entries = 1024
max_default_acl_entries = 256
max_parameter_acl_entries = 128
max_indexes = 64                 # named indexes; physical bindings are budgeted separately
max_extended_statistics = 256   # shared catalog; no separate per-table ceiling
max_brin_unsummarized_ranges_per_index = 64 # startup-reserved, durable-format maximum 255
max_views = 64
max_materialized_views = 32      # backing relations also consume max_tables
max_routines = 128
max_stored_query_dependencies_per_object = 64 # shared rule/policy/routine/view bound; max 255
max_casts = 64
max_operators = 64
max_operator_families = 64
max_operator_classes = 64
max_triggers = 128
max_policies = 256              # shared catalog; no separate per-table ceiling
max_publications = 64
max_collations = 128
max_conversions = 128
max_text_search_objects = 512 # includes 21 built-in objects
max_event_triggers = 64
max_tablespaces = 64          # includes pg_default and pg_global
max_comments = 64
table_rows = 8192                # per-table rows resident in the memtable
max_large_objects = 1024
large_object_pages = 8192        # sparse 2 KiB pages resident in the memtable
max_large_object_descriptors = 64 # per transaction
block_cache_bytes = 128MiB       # RAM cache of object-storage blocks
disk_cache_bytes = 1GiB          # local disk cache of object-storage objects
