name: Maintenance qualification
on:
  push:
    branches: [catalog-reader-consistency]
concurrency:
  group: maintenance-qualification-${{ github.ref }}
  cancel-in-progress: true
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-maintenance-${{ hashFiles('Cargo.lock') }}
      - name: Metadata waits and retained cleanup positions
        run: >-
          cargo test --locked --lib -- maintenance_metadata_ cleanup_download_overlap_
          checkpoint_maintenance_capacities_ automatic_checkpoint_deletes_
          --test-threads=1
      - name: Warnings and ownership boundaries
        run: cargo clippy --all-targets --locked -- -D warnings
