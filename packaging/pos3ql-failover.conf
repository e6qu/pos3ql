# Configure this file on one passive candidate for a durable object prefix.
# The candidate pos3ql service must be disabled until this monitor promotes it.
POS3QL_PRIMARY_READY_URL=http://primary.example:9187/readyz
POS3QL_CANDIDATE_READY_URL=http://127.0.0.1:9187/readyz
POS3QL_FAILURE_THRESHOLD=3
POS3QL_PROBE_INTERVAL_SECONDS=5
POS3QL_PROBE_TIMEOUT_SECONDS=2
POS3QL_PROMOTION_TIMEOUT_SECONDS=120
