name: File cleanup validation
on:
  push:
    branches: [resumable-file-cleanup]
concurrency:
  group: file-cleanup-validation
  cancel-in-progress: true
jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: file-cleanup-dependencies-${{ hashFiles('Cargo.lock') }}
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets --locked --features checkpoint-profile -- -D warnings
      - run: >-
          cargo test --lib --locked --features checkpoint-profile -- maintenance_metadata_ index_file_owners_ parallel_physical_ store::value::tests:: store::navigation::tests:: store::tiered::tests:: store::disk::tests:: store::cache::tests:: checkpoint_maintenance_capacities checkpoint_garbage_is_drained --nocapture --test-threads=1
