name: Owned lookup qualification
on:
  push:
    branches: [codex/owned-row-lookups]
concurrency:
  group: owned-lookup-${{ github.ref }}
  cancel-in-progress: true
jobs:
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-
      - run: cargo clean -p pos3ql
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --lib --locked owned_row_lookup -- --nocapture
      - run: cargo test --lib --locked row_read_ownership -- --nocapture
      - run: cargo test --lib --locked row_publication -- --nocapture
      - run: cargo test --lib --locked owned_heap_rows -- --nocapture
      - run: cargo test --lib --locked startup_bounded -- --nocapture
