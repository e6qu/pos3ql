name: Validate type publication

on:
  push:
    branches: [source-type-publication-owners]

permissions:
  contents: read

concurrency:
  group: type-publication-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ownership:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-type-publication-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-library-tests-
      - run: cargo clean -p pos3ql
      - name: Check publication ownership and typed recovery
        run: >-
          cargo test --lib --locked --
          storage::type_reference_moves::tests
          storage::type_references::tests
          storage::table_edits::tests
          storage::tests::shared_table
          sql::tests::captured_type_references
          sql::tests::typed_table_membership
          sql::tests::database_template_catalogs
          sql::tests::alter_table_of_and_not_of
          sql::tests::domain
          sql::tests::composite
          sql::tests::enum
          wal::tests
          durable_format
          --test-threads=1
