name: Checkpoint read replay
on:
  push:
    branches: [resumable-checkpoint-reads]
jobs:
  cursors:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets --features checkpoint-profile -- -D warnings
      - run: >-
          cargo test --lib --features checkpoint-profile -- store::sst::tests::
          checkpoint_reads_ checkpoint_budget maintenance_metadata_
          parallel_physical_ atomic_block_reads_ --test-threads=1
  torture:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: mirror.gcr.io/library/postgres:18@sha256:74935e72241653ca55e0414067e6d8763aceb8a810eb51b452253ec3dcfc4336
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: ./.github/actions/python-test-environment
      - name: Verify crash recovery and complete results at each storage delay
        env:
          POS3QL_VENV: ${{ github.workspace }}/venv
          POS3QL_PSQL: psql
          POS3QL_REFERENCE_PG_HOST: 127.0.0.1
          POS3QL_REFERENCE_PG_PORT: "5432"
          POS3QL_TORTURE_ROUNDS: "6"
          POS3QL_TORTURE_SEED: "20260725"
        run: |
          cargo build --release --locked
          for latency in 0 1 5; do
            POS3QL_TEST_ARTIFACTS="$RUNNER_TEMP/crash-failure/latency-$latency" \
            POS3QL_TEST_S3_LATENCY_MS="$latency" \
            POS3QL_RUN_GROUPS=torture POS3QL_BIN="$PWD/target/release/pos3ql" bash tests/external/run.sh
          done
      - uses: actions/upload-artifact@v6
        if: failure()
        with:
          name: repeated-crash-failure
          path: ${{ runner.temp }}/crash-failure/
