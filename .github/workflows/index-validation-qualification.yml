name: Index validation qualification

on:
  push:
    branches: [retain-index-validation-row-sources]

concurrency:
  group: index-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: mirror.gcr.io/library/postgres:18@sha256:74935e72241653ca55e0414067e6d8763aceb8a810eb51b452253ec3dcfc4336
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_INITDB_ARGS: "--locale-provider=libc --lc-collate=C --lc-ctype=C --encoding=UTF8"
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-
      - run: cargo clean -p pos3ql
      - name: Lint and index regressions
        run: |
          set -euo pipefail
          cargo clippy --all-targets --locked -- -D warnings
          for filter in index_validation captured_resident_byte_scans create_index_and_unique \
            uncommitted_create_index_is_invisible_to_other_sessions unique_expression_indexes_are_transactional_and_durable \
            expression_index_tuple_limits_follow_partial_membership reindex_ startup; do
            cargo test --lib --locked "$filter" -- --nocapture --test-threads=2
          done
      - uses: ./.github/actions/python-test-environment
        with:
          venv: target/external-venv
      - name: Index transcript against vanilla PostgreSQL 18
        env:
          PGHOST: 127.0.0.1
          PGPORT: "5432"
          PGUSER: postgres
          RUN_FAST: "0"
          RUN_CORE: "0"
          RUN_CORPUS: "1"
          RUN_AUX: "0"
          RUN_SLT: "0"
          RUN_FUZZ: "0"
          FAST_CORPUS_SHARDS: "1"
          FAST_CORPUS_ONLY: 43_indexes
        run: bash tests/external/ci_diff.sh
      - name: Index creation with an older transaction snapshot
        env:
          PGHOST: 127.0.0.1
          PGPORT: "5432"
          PGUSER: postgres
          P3_PORT: "15599"
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/index-validation.conf" <<CONFIG
          listen_addr = 127.0.0.1:15599
          data_dir = $RUNNER_TEMP/index-validation-data
          object_store = off
          max_tables = 64
          table_rows = 8192
          max_value_indexes = 64
          memtable_bytes = 256MiB
          CONFIG
          cat tests/external/differential-capacities.conf >> "$RUNNER_TEMP/index-validation.conf"
          target/release/pos3ql --config "$RUNNER_TEMP/index-validation.conf" > "$RUNNER_TEMP/index-validation.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"; cat "$RUNNER_TEMP/index-validation.log"' EXIT
          for attempt in $(seq 1 100); do
            kill -0 "$server_pid"
            if psql -h 127.0.0.1 -p 15599 -U postgres -tAc 'SELECT 1' >/dev/null 2>&1; then
              break
            fi
            test "$attempt" -lt 100
            sleep 0.1
          done
          target/external-venv/bin/python tests/external/mvcc_diff.py
