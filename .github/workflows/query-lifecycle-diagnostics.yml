name: Query lifecycle diagnostics

on:
  push:
    branches: [protect-shared-query-lifecycles]

concurrency:
  group: query-lifecycle-diagnostics-${{ github.ref }}
  cancel-in-progress: true

jobs:
  protocol:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: taiki-e/install-action@cargo-llvm-cov
      - name: Install native debugger
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends gdb
          gdb --version
      - name: Python environment
        uses: ./.github/actions/python-test-environment
      - name: Expose PostgreSQL 18 client
        run: |
          mkdir -p .ci-bin
          cat > .ci-bin/psql <<'SH'
          #!/bin/sh
          exec docker run --rm --network host -v "$PWD:$PWD" -w "$PWD" -v /tmp:/tmp mirror.gcr.io/library/postgres:18@sha256:74935e72241653ca55e0414067e6d8763aceb8a810eb51b452253ec3dcfc4336 psql "$@"
          SH
          chmod +x .ci-bin/psql
          .ci-bin/psql --version
      - name: Reproduce instrumented protocol and durability behavior
        env:
          POS3QL_VENV: ${{ github.workspace }}/venv
          POS3QL_PGBIN: /usr/lib/postgresql/18/bin
          POS3QL_PSQL: ${{ github.workspace }}/.ci-bin/psql
          COVERAGE_SHARD: run:proto
          COVERAGE_LCOV: ${{ github.workspace }}/query-lifecycle-diagnostics.lcov
        run: sh tools/coverage.sh
  native:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt
      - name: Format and lint
        run: |
          cargo fmt --check
          cargo clippy --all-targets --locked -- -D warnings
      - name: Native protocol and login tests
        run: |
          cargo test --release --lib --locked pg::conn::tests::
          cargo test --release --lib --locked sql::tests::login_event_triggers_commit_or_reject_the_login_atomically -- --exact
