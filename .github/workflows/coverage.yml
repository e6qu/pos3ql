# Line coverage over both test layers. The in-process tests alone report 59%
# and put the wire protocol at 6%, which measures what is instrumented rather
# than what is tested: the corpora, the sqllogictest blocks and the psql golden
# suite all drive the server binary as a subprocess. tools/coverage.sh
# instruments that binary too, which is what takes the figure to ~80%.
#
# Coverage-producing runs retain separate lcov files for the merge gate.
# Instrumented unit tests are partitioned after one build per worker so test
# growth cannot consume the fixed five-minute job budget.
name: coverage
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shard:
    name: shard ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        include:
          # Coverage and crash-torture builds use incompatible instrumentation.
          # Keep them in distinct jobs: serializing either pair can exceed the
          # hard five-minute bound even though each workload fits on its own.
          - { name: lib-a, shards: "lib:0/2", needs_pg18: false }
          - { name: lib-b, shards: "lib:1/2", needs_pg18: false }
          - { name: protocol-durability, shards: "run:proto,dur", needs_pg18_client: true }
          - { name: spill-overlay, shards: "runtest:overlay", needs_pg18: false }
          - { name: ingest, shards: "runtest:ingest", needs_pg18: false }
          - { name: tls-correctness, shards: "runtest:tls", needs_pg18: false }
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: taiki-e/install-action@cargo-llvm-cov
      - name: Expose PostgreSQL 18 psql for protocol coverage
        if: matrix.needs_pg18_client
        run: |
          mkdir -p .ci-bin
          sed 's/^          //' > .ci-bin/psql <<'SH'
          #!/bin/sh
          exec docker run --rm --network host -v "$PWD:$PWD" -w "$PWD" -v /tmp:/tmp postgres:18 psql "$@"
          SH
          chmod +x .ci-bin/psql
      # psycopg2-binary serves the sqllogictest replay; psycopg (v3) serves
      # the crash-torture and fuzz harnesses, which use its API directly.
      - name: Python venv for the differential harnesses
        if: ${{ !startsWith(matrix.shards, 'lib:') }}
        run: python3 -m venv venv && ./venv/bin/pip install --quiet psycopg2-binary 'psycopg[binary]'
      - name: Measure
        env:
          POS3QL_VENV: ${{ github.workspace }}/venv
          POS3QL_PGBIN: /usr/lib/postgresql/18/bin
          POS3QL_PSQL: ${{ matrix.needs_pg18_client && format('{0}/.ci-bin/psql', github.workspace) || 'psql' }}
          COVERAGE_SHARDS: ${{ matrix.shards }}
        run: |
          for shard in $COVERAGE_SHARDS; do
            trace_name=$(printf '%s' "$shard" | tr ':,' '--')
            COVERAGE_SHARD="$shard" \
            COVERAGE_LCOV="${{ github.workspace }}/coverage-${trace_name}.lcov" \
            sh tools/coverage.sh
          done
      - uses: actions/upload-artifact@v6
        with:
          name: lcov-${{ matrix.name }}
          path: coverage-*.lcov
          # The runtest:* (torture) shards write no tracefile by design; let
          # their upload find nothing rather than error.
          if-no-files-found: ignore

  torture:
    name: shard torture-${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: a, seed: 20260723 }
          - { name: b, seed: 20260725 }
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_INITDB_ARGS: "--lc-collate=C --lc-ctype=C --encoding=UTF8"
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - name: Python venv for crash torture
        run: python3 -m venv venv && ./venv/bin/pip install --quiet 'psycopg[binary]'
      - name: Run crash torture against the PostgreSQL 18 service
        env:
          POS3QL_VENV: ${{ github.workspace }}/venv
          POS3QL_PSQL: psql
          POS3QL_REFERENCE_PG_HOST: 127.0.0.1
          POS3QL_REFERENCE_PG_PORT: "5432"
          POS3QL_TORTURE_ROUNDS: "6"
          POS3QL_TORTURE_SEED: ${{ matrix.seed }}
          COVERAGE_SHARD: runtest:torture
        run: sh tools/coverage.sh

  subscription:
    name: shard subscription
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - name: Expose PostgreSQL 18 publisher and client adapters
        run: |
          docker run --rm --detach --name pos3ql-subscription-publisher \
            -e POSTGRES_HOST_AUTH_METHOD=trust -p 15496:5432 postgres:18 \
            -c wal_level=logical -c max_replication_slots=4 -c max_wal_senders=4
          mkdir -p .ci-bin
          sed 's/^          //' > .ci-bin/psql <<'SH'
          #!/bin/sh
          exec docker run --rm --network host -v "$PWD:$PWD" -w "$PWD" -v /tmp:/tmp postgres:18 psql "$@"
          SH
          printf '%s\n' '#!/bin/sh' 'exit 0' > .ci-bin/postgres
          printf '%s\n' '#!/bin/sh' 'exit 0' > .ci-bin/initdb
          printf '%s\n' '#!/bin/sh' 'exit 0' > .ci-bin/pg_ctl
          chmod +x .ci-bin/psql .ci-bin/postgres .ci-bin/initdb .ci-bin/pg_ctl
          for _ in $(seq 1 50); do .ci-bin/psql -h 127.0.0.1 -p 15496 -U postgres -X -q -c 'SELECT 1' >/dev/null 2>&1 && exit 0; sleep 0.1; done
          exit 1
      - name: Run logical-subscription recovery against PostgreSQL 18
        env:
          POS3QL_PGBIN: ${{ github.workspace }}/.ci-bin
          POS3QL_PSQL: ${{ github.workspace }}/.ci-bin/psql
          POS3QL_SUBSCRIPTION_EXTERNAL_PUBLISHER_PORT: "15496"
          COVERAGE_SHARD: runtest:subscription
        run: sh tools/coverage.sh

  spill-differential:
    name: shard spilldiff
    runs-on: ubuntu-latest
    timeout-minutes: 5
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_INITDB_ARGS: "--lc-collate=C --lc-ctype=C --encoding=UTF8"
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v5
      - name: Enable PostgreSQL prepared transactions
        run: |
          postgres_container=$(docker ps --filter ancestor=postgres:18 --format '{{.ID}}' | head -n 1)
          test -n "$postgres_container"
          docker exec "$postgres_container" psql -U postgres -X -v ON_ERROR_STOP=1 \
            -c "ALTER SYSTEM SET max_prepared_transactions = 8"
          docker restart "$postgres_container"
          for _ in $(seq 1 50); do
            pg_isready -h 127.0.0.1 -p 5432 -U postgres >/dev/null 2>&1 && exit 0
            sleep 0.1
          done
          exit 1
      - name: Install SQL extension oracle fixtures
        run: |
          postgres_container=$(docker ps --filter ancestor=postgres:18 --format '{{.ID}}' | head -n 1)
          test -n "$postgres_container"
          docker exec "$postgres_container" mkdir -p /tmp/pos3ql-extensions
          docker cp tests/external/extensions/. "$postgres_container":/tmp/pos3ql-extensions/
      - name: Python venv for differential oracles
        run: python3 -m venv venv && ./venv/bin/pip install --quiet 'psycopg[binary]'
      - name: Run forced-spill differential
        env:
          POS3QL_VENV: ${{ github.workspace }}/venv
          POS3QL_PSQL: psql
          POS3QL_REFERENCE_PG_HOST: 127.0.0.1
          POS3QL_REFERENCE_PG_PORT: "5432"
          POS3QL_REFERENCE_PSQL: psql
          POS3QL_EXTENSION_CONTROL_PATH: ${{ github.workspace }}/tests/external/extensions
          POS3QL_REFERENCE_EXTENSION_CONTROL_PATH: /tmp/pos3ql-extensions
          COVERAGE_SHARD: runtest:spilldiff
        run: sh tools/coverage.sh

  # The plain SQL differential workload needs PostgreSQL 18 as an oracle but
  # not a host-installed server. A disposable service keeps the job's setup
  # bounded; differential.sh enters this mode only when all reference settings
  # are explicitly supplied.
  reference-diff:
    name: shard diff
    runs-on: ubuntu-latest
    timeout-minutes: 5
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_INITDB_ARGS: "--lc-collate=C --lc-ctype=C --encoding=UTF8"
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v5
      - name: Enable PostgreSQL prepared transactions
        run: |
          postgres_container=$(docker ps --filter ancestor=postgres:18 --format '{{.ID}}' | head -n 1)
          test -n "$postgres_container"
          docker exec "$postgres_container" psql -U postgres -X -v ON_ERROR_STOP=1 \
            -c "ALTER SYSTEM SET max_prepared_transactions = 8"
          docker restart "$postgres_container"
          for _ in $(seq 1 50); do
            pg_isready -h 127.0.0.1 -p 5432 -U postgres >/dev/null 2>&1 && exit 0
            sleep 0.1
          done
          exit 1
      - name: Install SQL extension oracle fixtures
        run: |
          postgres_container=$(docker ps --filter ancestor=postgres:18 --format '{{.ID}}' | head -n 1)
          test -n "$postgres_container"
          docker exec "$postgres_container" mkdir -p /tmp/pos3ql-extensions
          docker cp tests/external/extensions/. "$postgres_container":/tmp/pos3ql-extensions/
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: taiki-e/install-action@cargo-llvm-cov
      - name: Python venv for the differential harnesses
        run: python3 -m venv venv && ./venv/bin/pip install --quiet psycopg2-binary 'psycopg[binary]'
      - name: Measure
        env:
          POS3QL_VENV: ${{ github.workspace }}/venv
          POS3QL_PSQL: psql
          POS3QL_REFERENCE_PSQL: psql
          POS3QL_REFERENCE_PG_HOST: 127.0.0.1
          POS3QL_REFERENCE_PG_PORT: "5432"
          POS3QL_EXTENSION_CONTROL_PATH: ${{ github.workspace }}/tests/external/extensions
          POS3QL_REFERENCE_EXTENSION_CONTROL_PATH: /tmp/pos3ql-extensions
          COVERAGE_SHARDS: "run:diff"
        run: |
          COVERAGE_SHARD="$COVERAGE_SHARDS" \
          COVERAGE_LCOV="${{ github.workspace }}/coverage-run-diff.lcov" \
          sh tools/coverage.sh
      - uses: actions/upload-artifact@v6
        with:
          name: lcov-diff
          path: coverage-run-diff.lcov

  merge-and-gate:
    needs: [shard, reference-diff]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v8
        with:
          pattern: lcov-*
          merge-multiple: true
      - name: Union the shards and hold the floor
        run: python3 tools/coverage-merge.py 70 coverage-*.lcov
