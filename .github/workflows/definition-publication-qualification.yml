name: Definition publication qualification

on:
  push:
    branches: [share-pending-definition-publication]

concurrency:
  group: definition-publication-${{ github.ref }}
  cancel-in-progress: true

jobs:
  definition-publication:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-
      - run: cargo clean -p pos3ql
      - name: Lint all targets
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: Ownership, publication, capacity, and rollback regressions
        run: |
          set -euo pipefail
          qualification_status=0
          for filter in live_definition_ownership table_catalog_lifecycle definition_images metadata_alter configured_catalog_version catalog_object_pools_follow configured_transaction_ddl reservation dml_target; do
            if ! cargo test --lib --locked "$filter" -- --nocapture --test-threads=2; then
              qualification_status=1
            fi
          done
          exit "$qualification_status"
