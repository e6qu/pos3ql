name: Historical SST validation
on:
  push:
    branches: [codex/historical-sst-retention]
concurrency:
  group: historical-sst-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      RUST_MIN_STACK: 134217728
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Format evidence
        run: |
          cargo fmt --all
          git diff > "$RUNNER_TEMP/format.patch"
      - uses: actions/upload-artifact@v6
        with:
          name: historical-sst-format
          path: ${{ runner.temp }}/format.patch
      - run: cargo check --all-targets --locked
      - run: cargo clippy --lib --bins --locked -- -D warnings
      - run: cargo test --lib --locked historical_sst_ -- --test-threads=1
      - run: cargo test --lib --locked object_store_checkpoint_preserves_snapshot_and_survives_cold_cache -- --test-threads=1
      - run: cargo test --lib --locked checkpoint_merge_capacity_exhausts_loudly_for_a_pinned_full_list -- --test-threads=1
      - run: cargo test --lib --locked dirty_full_roster_merges_across_bounded_checkpoint_beats -- --test-threads=1
      - run: cargo test --lib --locked failed_full_roster_merge_keeps_the_prior_slice_for_retry -- --test-threads=1
      - run: cargo test --lib --locked retained_sst_ -- --test-threads=1
      - run: python3 tools/check-docs.py
      - run: bash tools/check-bugs.sh
      - run: bash tools/check-noops.sh
      - run: bash tools/check-object-store-boundary.sh
