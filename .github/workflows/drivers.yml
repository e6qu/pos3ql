name: Drivers

# Runs real PostgreSQL client drivers (pgJDBC, jackc/pgx, node-postgres)
# against a real PostgreSQL 18 and against pos3ql, and diffs each driver's
# transcript. This guards the wire-protocol and catalog-introspection surface
# those drivers depend on — the compatibility the unit tests cannot cover.

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  drivers:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          # Match pos3ql: C collation, UTF8 encoding.
          POSTGRES_INITDB_ARGS: "--lc-collate=C --lc-ctype=C --encoding=UTF8"
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      - uses: actions/checkout@v5

      - name: Install PostgreSQL client
        run: |
          # Runner-image Microsoft feeds are unrelated to this client install and
          # occasionally reject apt metadata requests.
          sudo rm -f /etc/apt/sources.list.d/azure-cli.list /etc/apt/sources.list.d/microsoft-prod.list
          sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Cache Rust build
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      # `target` is cached by dependency lockfile, not source revision. Keep
      # dependencies warm but rebuild this checkout's crate every time.
      - name: Rebuild checked-out crate
        run: cargo clean -p pos3ql

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Driver conformance (pgJDBC / pgx / node-postgres vs real PostgreSQL)
        env:
          PGHOST: 127.0.0.1
          PGPORT: "5432"
          PGUSER: postgres
          P3_PORT: "15599"
        run: bash tests/external/ci_drivers.sh
