name: Executable catalog validation
on:
  push:
    branches: [catalog-execution-lifetimes]
concurrency:
  group: executable-catalog-${{ github.ref }}
  cancel-in-progress: true
jobs:
  focused:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: text-catalog-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
      - name: Format
        run: cargo fmt --all -- --check
      - name: Compile and lint all targets
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: Catalog execution and recovery regressions
        run: cargo test --lib --locked -- catalog_lifetime operator cast access_method event_trigger database_template named_type_layout protocol_completion event_graphs --test-threads=1
