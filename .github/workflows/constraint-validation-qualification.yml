name: Constraint validation qualification

on:
  push:
    branches: [retain-constraint-validation-sources]

concurrency:
  group: constraint-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: mirror.gcr.io/library/postgres:18@sha256:74935e72241653ca55e0414067e6d8763aceb8a810eb51b452253ec3dcfc4336
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_INITDB_ARGS: "--locale-provider=libc --lc-collate=C --lc-ctype=C --encoding=UTF8"
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-
      - run: cargo clean -p pos3ql
      - name: Lint constraint validation regressions
        run: |
          set -euo pipefail
          cargo clippy --all-targets --locked -- -D warnings
      - name: Build reference-comparison executable
        run: cargo build --release --locked
      - uses: ./.github/actions/python-test-environment
        with:
          venv: target/external-venv
      - name: Constraint scans and older query snapshots
        env:
          PGHOST: 127.0.0.1
          PGPORT: "5432"
          PGUSER: postgres
          P3_PORT: "15599"
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/constraint-validation.conf" <<CONFIG
          listen_addr = 127.0.0.1:15599
          data_dir = $RUNNER_TEMP/constraint-validation-data
          object_store = off
          max_tables = 64
          table_rows = 8192
          max_value_indexes = 64
          memtable_bytes = 256MiB
          CONFIG
          cat tests/external/differential-capacities.conf >> "$RUNNER_TEMP/constraint-validation.conf"
          target/release/pos3ql --config "$RUNNER_TEMP/constraint-validation.conf" > "$RUNNER_TEMP/constraint-validation.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"; cat "$RUNNER_TEMP/constraint-validation.log"' EXIT
          for attempt in $(seq 1 100); do
            kill -0 "$server_pid"
            if psql -h 127.0.0.1 -p 15599 -U postgres -tAc 'SELECT 1' >/dev/null 2>&1; then
              break
            fi
            test "$attempt" -lt 100
            sleep 0.1
          done
          target/external-venv/bin/python tests/external/mvcc_diff.py
      - name: Constraint validation fixed-memory regressions
        run: |
          set -euo pipefail
          cargo test --lib --locked constraint_validation -- --nocapture --test-threads=2 2>&1 | tee "$RUNNER_TEMP/constraint-validation-test.log"
      - name: Symbolicate allocation failures in one batch
        if: failure()
        run: |
          python3 - <<'PYCODE'
          import os, re, subprocess
          from pathlib import Path
          log = Path(os.environ["RUNNER_TEMP"]) / "constraint-validation-test.log"
          if log.exists():
              frames = re.findall(r"(\S*/target/debug/deps/pos3ql-[0-9a-f]+)\(\+(0x[0-9a-f]+)\)", log.read_text(errors="replace"))
              for binary in sorted({binary for binary, _ in frames}):
                  addresses = [address for owner, address in frames if owner == binary]
                  subprocess.run(["addr2line", "-C", "-f", "-e", binary, *addresses], check=True)
          PYCODE
