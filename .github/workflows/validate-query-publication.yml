name: Validate query publication

on:
  push:
    branches: [share-stored-query-publication]

permissions:
  contents: read

concurrency:
  group: query-publication-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publication:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-query-publication-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-library-tests-
      - run: cargo clean -p pos3ql
      - name: Check runtime lint before the complete PR gates
        run: cargo clippy --lib --bins --locked -- -D warnings
      - name: Check saved query publication and recovery
        run: >-
          cargo test --lib --locked --
          storage::type_reference_moves::tests
          storage::tests::view_rule_catalog
          storage::tests::failed_rule
          sql::tests::captured_type_references
          sql::tests::materialized_view
          row_security
          --test-threads=1
