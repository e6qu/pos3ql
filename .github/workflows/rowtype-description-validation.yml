name: Row type description validation

on:
  push:
    branches: [catalog-relation-identities]

concurrency:
  group: rowtype-description-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-
      - name: Format and retain correction
        run: |
          cargo fmt
          git diff --binary > "$RUNNER_TEMP/formatting.patch"
      - name: Build every target and lint
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: Focused identity regressions
        run: >-
          cargo test --lib --locked -- relation_identity_
          json_populate_record_uses_table_rowtype_fields
          column_metadata_stays_within_recovery_stack_budget
          partitioned_catalog_relations_expose_parent_and_leaf_identity
          wide_schema_objects_cover_full_definition_bounds_and_object_cold_recovery
          --test-threads=1
      - name: Retain formatting
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: relation-formatting-${{ github.sha }}
          path: ${{ runner.temp }}/formatting.patch
          if-no-files-found: error
