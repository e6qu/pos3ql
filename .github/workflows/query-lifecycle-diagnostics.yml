name: Query lifecycle diagnostics

on:
  push:
    branches: [protect-shared-query-lifecycles]

concurrency:
  group: query-lifecycle-diagnostics-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt
      - name: Format and lint
        run: |
          cargo fmt --check
          cargo clippy --all-targets --locked -- -D warnings
      - name: Native protocol and login tests
        run: |
          cargo test --release --lib --locked pg::conn::tests::
          cargo test --release --lib --locked sql::tests::login_event_triggers_commit_or_reject_the_login_atomically -- --exact
